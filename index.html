      <label class="f full">Percurso<input name="distancia" value="${esc(p.distancia)}" placeholder="Ex.: OC6, 12 km; V1, 500 m"></label>
      <div class="full"><div class="hint" style="margin:0 0 6px">Categorias</div><div class="row" style="gap:14px">${CATS.map(c=>`<label class="chk"><input type="checkbox" name="cat_${c[0]}" ${(p.categorias||[]).includes(c[0])?"checked":""}> ${c[1]}</label>`).join("")}</div></div>
      <label class="f">Inscrições até<input name="inscricao_ate" type="date" value="${esc(p.inscricao_ate)}"></label>
      <label class="f">Situação<select name="status"><option value="confirmada" ${p.status!=="cancelada"?"selected":""}>Confirmada</option><option value="cancelada" ${p.status==="cancelada"?"selected":""}>Cancelada</option></select></label>
      <label class="f full">Link do regulamento ou inscrição<input name="link" type="url" value="${esc(p.link)}" placeholder="https://"></label>
      <label class="f full">Observações<textarea name="obs" placeholder="Transporte, uniforme, taxa de inscrição…">${esc(p.obs)}</textarea></label>
      ${id?"":`<label class="chk full"><input type="checkbox" name="mural" checked> Publicar também no Mural</label>`}
    </div>
    <div class="row" style="margin-top:18px">${id?`<button type="button" class="btn danger small" id="dPv">Excluir</button>`:""}<span class="spacer"></span><button type="button" class="btn ghost" id="cPv">Cancelar</button><button class="btn" type="submit">${id?"Salvar prova":"Cadastrar prova"}</button></div>
    </form>`, root=>{
      root.querySelector("#cPv").addEventListener("click",()=> id ? verProva(id) : closeSheet());
      const d=root.querySelector("#dPv"); if(d) d.addEventListener("click",async()=>{ if(!await ask("Excluir esta prova do calendário?","Excluir prova")) return; try{ await S.db.doc("provas/"+id).delete(); closeSheet(); toast("Prova excluída"); }catch(e){ failWrite(e); } });
      root.querySelector("#fpv").addEventListener("submit",async ev=>{
        ev.preventDefault(); const f=new FormData(ev.target); const o={};
        ["nome","data","data_fim","local","distancia","inscricao_ate","status","link","obs"].forEach(k=>o[k]=(f.get(k)||"").toString().trim());
        o.categorias=CATS.map(c=>c[0]).filter(c=>f.get("cat_"+c));
        const nid=id||("p"+Date.now().toString(36)+rid());
        try{
          await S.db.doc("provas/"+nid).set(o);
          if(!id && f.get("mural")){
            await S.db.doc("avisos/prova_"+nid).set({tipo:"competicao", titulo:o.nome, texto:[o.categorias.length?"Categorias: "+o.categorias.map(c=>CAT_LABEL[c]).join(", "):"", o.inscricao_ate?"Inscrições até "+dataCurta(o.inscricao_ate):"", o.obs, "Marque seu interesse na aba Competição."].filter(Boolean).join("\n"), data_evento:o.data, hora:"", local:o.local, link:o.link, expira:o.data_fim||o.data, fixado:false, criado:new Date().toISOString()});
          }
          toast(id?"Prova salva":"Prova cadastrada"); verProva(nid);
        }catch(e){ failWrite(e); }
      });
    });
}
function editAtleta(){
  const m=S.atletaMe||{};
  const ref=+todaySP().slice(0,4);
  openSheet(`
    <div class="head"><h2>Minha categoria</h2><button class="x" aria-label="Fechar">×</button></div>
    <form id="fat"><div class="grid">
      <label class="f full">Seu nome nas listas<input name="apelido" maxlength="60" value="${esc(m.apelido||(S.insc[S.uid]&&S.insc[S.uid].apelido)||"")}"></label>
      <label class="f">Ano de nascimento<input name="ano" type="number" inputmode="numeric" min="1930" max="${ref}" required value="${esc(m.ano)}"></label>
      <label class="f">Naipe<select name="naipe"><option value="">–</option>${["Feminino","Masculino"].map(n=>`<option ${n===m.naipe?"selected":""}>${n}</option>`).join("")}</select></label>
    </div>
    <p class="hint" id="catPrev"></p>
    <div class="row" style="margin-top:18px"><span class="spacer"></span><button type="button" class="btn ghost" id="cAt">Cancelar</button><button class="btn" type="submit">Salvar</button></div>
    </form>`, root=>{
      const ai=root.querySelector("[name=ano]"), pv=root.querySelector("#catPrev");
      const upd=()=>{ const cs=catsPorAno(ai.value); pv.textContent = cs && +ai.value>1900 ? `Sua categoria em ${ref}: ${CAT_LABEL[catPrincipal(cs)]}.` : ""; };
      ai.addEventListener("input",upd); upd();
      root.querySelector("#cAt").addEventListener("click",closeSheet);
      root.querySelector("#fat").addEventListener("submit",async ev=>{
        ev.preventDefault(); const f=new FormData(ev.target);
        const body=JSON.parse(JSON.stringify(m)); body.ano=+f.get("ano"); body.naipe=f.get("naipe")||""; const ap=(f.get("apelido")||"").toString().trim(); if(ap) body.apelido=ap;
        try{ await S.db.doc("atletas/"+S.uid).set(body); closeSheet(); toast("Categoria salva"); }
        catch(e){ if(e&&e.code==="invalid_argument"){ S.canWrite=false; toast("Seu acesso é só de leitura"); } else failWrite(e); }
      });
    });
}

/* ---------- CLUBE ---------- */

function renderClube(){
  const el=$("#clubeBody");
  const c=S.config; const canoas=c.canoas||[];
  const ativas=canoas.filter(x=>x.status!=="manutencao");
  const L=lim();
  const porBase=LOCAIS.map(l=>{const cs=ativas.filter(x=>(x.local||"Urca")===l);return {l, n:cs.length, v:cs.reduce((s,x)=>s+(+x.lugares||0),0)};});
  const grade=(c.grade||[]).map(gNorm).sort((a,b)=>(a.locais.join()+a.inicio).localeCompare(b.locais.join()+b.inicio));
  const tu=bfTabela("Urca"), tl=bfTabela("Lagoa");
  const optN=(v,dis)=>`${[0,1,2].map(k=>`<option value="${k}" ${+v===k?"selected":""}>${NIVEL_TXT[k]}</option>`).join("")}`;
  let html=`<div class="panel" style="margin-top:0"><h3>Vagas por turno</h3>
    <div class="row" style="gap:28px">${porBase.map(b=>`<div class="capacity"><span class="n">${b.v}</span><span>${b.l}<br><span class="hint">${b.n} ${b.n===1?"canoa":"canoas"}</span></span></div>`).join("")}</div>
    <p class="hint">Cada remada usa as vagas da sua base. A divisão de quem vai em qual canoa continua sendo feita na praia.</p></div>
  <div class="panel"><div class="row"><h3 style="margin:0">Grade semanal</h3><span class="spacer"></span>${S.canAgenda?`<button class="btn small" id="addG">Adicionar horário</button>`:""}</div>
    ${grade.length?grade.map(g=>`<div class="grade-row"><div><div style="font-weight:600">${diasTxt(g.dias)}, ${esc(g.inicio)}–${esc(g.fim)}</div><div class="hint" style="margin:0">${esc(locaisTxt(g.locais))}${g.categoria?", treino "+esc(CAT_LABEL[g.categoria]):""}${g.titulo?", "+esc(g.titulo):""}</div></div><span class="spacer"></span>${S.canAgenda?`<button class="btn ghost small" data-gi="${esc(g.id)}">Editar</button>`:""}</div>`).join("")
      :`<p class="hint">Nenhum horário fixo cadastrado.</p>${S.canAgenda?`<button class="btn ghost small" id="gPadrao">Usar a grade atual: Urca de segunda a sábado e Lagoa terça e quinta, às 6h</button>`:""}`}
  </div>
  <div class="panel"><div class="row"><h3 style="margin:0">Frota</h3><span class="spacer"></span>${S.canEdit?`<button class="btn small" id="addC">Adicionar canoa</button>`:""}</div>
    ${canoas.length?canoas.map((x,i)=>`<div class="canoe"><div><div class="nm">${esc(x.nome)}</div><div class="sub">${esc(x.local||"Urca")}, ${esc(x.tipo)}, ${x.lugares} ${+x.lugares===1?"lugar":"lugares"}${x.status==="manutencao"?", em manutenção":""}</div></div><span class="spacer"></span>${S.canEdit?`<button class="btn ghost small" data-ci="${i}">Editar</button>`:""}</div>`).join(""):`<p class="hint">Nenhuma canoa cadastrada. Cadastre a frota para calcular as vagas.</p>`}
  </div>
  <div class="panel"><h3>Vento: escala Beaufort por base</h3>
    <p class="hint" style="margin:0 0 8px">Defina o que cada força significa em cada base. Rajadas contam com uma força a menos. Valores iniciais sugeridos para canoa havaiana; ajuste com os instrutores.</p>
    <div class="scroll-x"><table class="limits"><tr><th>Força</th><th>Vento</th><th>Urca</th><th>Lagoa</th></tr>
    ${BEAUFORT.map((r,i)=>`<tr><td><b>${i}</b> ${r[1]}</td><td>${r[2]}</td><td><select data-bfu="${i}" ${S.canEdit?"":"disabled"}>${optN(tu[i])}</select></td><td><select data-bfl="${i}" ${S.canEdit?"":"disabled"}>${optN(tl[i])}</select></td></tr>`).join("")}</table></div>
    <h3 style="margin-top:16px">Ondulação e chuva</h3>
    <div class="scroll-x"><table class="limits"><tr><th>Leitura</th><th>Atenção a partir de</th><th>Cancelar a partir de</th></tr>
      ${[["onda","Ondulação na Urca (m)"],["chuva_mm","Chuva no horário (mm)"],["chuva_prob","Chance de chuva (%)"]].map(([k,l])=>`<tr><td>${l}</td><td><input data-l="${k}.a" inputmode="decimal" value="${L[k]?.a??""}" ${S.canEdit?"":"disabled"} aria-label="${l}, atenção"></td><td><input data-l="${k}.c" inputmode="decimal" value="${L[k]?.c??""}" ${S.canEdit?"":"disabled"} aria-label="${l}, cancelar"></td></tr>`).join("")}
    </table></div>
    ${S.canEdit?`<div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn" id="saveL">Salvar regras</button></div>`:""}
  </div>`;
  if(S.canEdit){
    const ids=Object.keys(S.equipe);
    html+=`<div class="panel"><h3>Equipe e permissões</h3>
      <p class="hint" style="margin:0 0 8px">Quem tem acesso de editor ao app aparece aqui ao abrir o app pela primeira vez. Gestão altera tudo; instrutores abrem e gerenciam a agenda, fazem check-in e lançam a previsão do mar. Alunos entram como colaboradores e só editam a própria ficha e os agendamentos.</p>
      ${ids.length?ids.map(id=>{ const p=S.names[id], nm=(p&&p.name)||"Membro da equipe", dono=S.ownerIds.includes(id); return `<div class="grade-row"><div><div style="font-weight:600">${esc(nm)}${id===S.uid?" (você)":""}</div><div class="hint" style="margin:0">${dono?"Responsável pelo app":"Acesso de editor"}</div></div><span class="spacer"></span>${dono?`<span class="b grn">Gestão</span>`:`<select data-papel="${esc(id)}"><option value="instrutor" ${(c.papeis||{})[id]!=="gestao"?"selected":""}>Instrutor</option><option value="gestao" ${(c.papeis||{})[id]==="gestao"?"selected":""}>Gestão</option></select>`}</div>`; }).join(""):`<p class="hint">Ninguém da equipe abriu o app ainda.</p>`}
    </div>`;
  }
  el.innerHTML=html;
  const ac=$("#addC"); if(ac) ac.addEventListener("click",()=>editCanoa(-1));
  const ag=$("#addG"); if(ag) ag.addEventListener("click",()=>editGrade(null));
  const gp=$("#gPadrao"); if(gp) gp.addEventListener("click",async()=>{ await saveConfig({grade:[{id:rid(),dias:[1,2,3,4,5,6],locais:["Urca"],inicio:"06:00",fim:"07:30",titulo:"",categoria:""},{id:rid(),dias:[2,4],locais:["Lagoa"],inicio:"06:00",fim:"07:30",titulo:"",categoria:""}]}); toast("Grade cadastrada"); });
  el.querySelectorAll("[data-gi]").forEach(b=>b.addEventListener("click",()=>editGrade(b.dataset.gi)));
  el.querySelectorAll("[data-ci]").forEach(b=>b.addEventListener("click",()=>editCanoa(+b.dataset.ci)));
  el.querySelectorAll("[data-papel]").forEach(s=>s.addEventListener("change",async()=>{ const p=Object.assign({}, c.papeis||{}); p[s.dataset.papel]=s.value; await saveConfig({papeis:p}); toast("Permissão atualizada"); }));
  const sl=$("#saveL"); if(sl) sl.addEventListener("click",async()=>{
    const nl=JSON.parse(JSON.stringify(L));
    el.querySelectorAll("[data-l]").forEach(i=>{const [k,p]=i.dataset.l.split("."); nl[k]=nl[k]||{}; nl[k][p]=num(i.value.replace(",","."));});
    const bf={Urca:[...el.querySelectorAll("[data-bfu]")].map(s=>+s.value), Lagoa:[...el.querySelectorAll("[data-bfl]")].map(s=>+s.value)};
    await saveConfig({limites:nl, beaufort:bf}); toast("Regras salvas");
  });
}

function editCanoa(i){
  const canoas = (S.config.canoas||[]).slice();
  const c = i>=0 ? canoas[i] : {nome:"", tipo:"OC6", lugares:6, status:"ativa"};
  openSheet(`
    <div class="head"><h2>${i>=0?"Editar canoa":"Nova canoa"}</h2><button class="x" aria-label="Fechar">×</button></div>
    <form id="fc"><div class="grid">
      <label class="f full">Nome<input name="nome" required value="${esc(c.nome)}" placeholder="Ex.: Iemanjá"></label>
      <label class="f">Tipo<select name="tipo">${Object.keys(TIPOS).map(t=>`<option ${t===c.tipo?"selected":""}>${t}</option>`).join("")}</select></label>
      <label class="f">Lugares<input name="lugares" type="number" min="1" max="12" value="${esc(c.lugares)}"></label>
      <label class="f full">Base<select name="local">${LOCAIS.map(l=>`<option ${l===(c.local||"Urca")?"selected":""}>${l}</option>`).join("")}</select></label>
      <label class="f full">Situação<select name="status"><option value="ativa" ${c.status!=="manutencao"?"selected":""}>Disponível</option><option value="manutencao" ${c.status==="manutencao"?"selected":""}>Em manutenção</option></select></label>
    </div>
    <div class="row" style="margin-top:18px">${i>=0?`<button type="button" class="btn danger small" id="dC">Remover</button>`:""}<span class="spacer"></span><button type="button" class="btn ghost" id="cC">Cancelar</button><button class="btn" type="submit">Salvar canoa</button></div>
    </form>`, root=>{
      const tipo=root.querySelector("[name=tipo]"), lug=root.querySelector("[name=lugares]");
      tipo.addEventListener("change",()=>lug.value=TIPOS[tipo.value]);
      root.querySelector("#cC").addEventListener("click",closeSheet);
      const d=root.querySelector("#dC"); if(d) d.addEventListener("click",async()=>{ if(!await ask("Remover "+c.nome+" da frota?","Remover canoa"))return; canoas.splice(i,1); await saveConfig({canoas}); closeSheet(); toast("Canoa removida"); });
      root.querySelector("#fc").addEventListener("submit",async ev=>{
        ev.preventDefault(); const f=new FormData(ev.target);
        const o={nome:f.get("nome").toString().trim(), tipo:f.get("tipo"), lugares:Math.max(1,+f.get("lugares")||1), status:f.get("status"), local:f.get("local")||"Urca"};
        if(!o.nome) return;
        if(i>=0) canoas[i]=o; else canoas.push(o);
        await saveConfig({canoas}); closeSheet(); toast("Canoa salva");
      });
    });
}
async function saveConfig(patch){
  const next = Object.assign({}, S.config, patch);
  try{ await S.db.doc("config/clube").set(next); }catch(e){ failWrite(e); }
}

function failWrite(e){
  const code = e && e.code;
  if(code==="invalid_argument") toast("Você não tem permissão para alterar esses dados");
  else if(code==="quota_exceeded") toast("Limite de armazenamento atingido");
  else toast("Não foi possível salvar. Tente de novo.");
}

/* ---------- render ---------- */
function render(){
  if(S.tab==="mural"){ marcarLido(); }
  updateBadge();
  if(S.tab==="agenda") renderAgenda(); else if(S.tab==="mar") renderMar(); else if(S.tab==="mural") renderMural(); else if(S.tab==="competicao") renderCompeticao(); else if(S.tab==="alunos") renderAlunos(); else renderClube();
}

const h0 = location.hash.slice(1);
setTab(TABS.includes(h0)?h0:"agenda");

/* ---------- capabilities ---------- */
function computeRole(){
  const p=S.config.papeis||{};
  S.role = S.isOwner ? "gestao" : S.platAdmin ? (p[S.uid]==="gestao"?"gestao":"instrutor") : (S.uid ? "aluno" : "visitante");
  S.canEdit = S.role==="gestao"; S.canAgenda = S.canEdit || S.role==="instrutor";
  const nome = S.me && S.me.name ? S.me.name.split(" ")[0] : "";
  $("#who").textContent = nome ? `${nome} (${{gestao:"gestão",instrutor:"instrutor",aluno:"aluno",visitante:"visitante"}[S.role]})` : "";
  document.querySelectorAll('[data-tab="alunos"] .lbl').forEach(l=>l.textContent = S.role==="aluno" ? (l.closest("nav.bottom")?"Ficha":"Minha ficha") : "Alunos");
}
(async function boot(){
  if(!NA_CLAUDE) montarBarraTeste();
  const [db, user] = await Promise.all([CL.use("db"), CL.use("user")]);
  S.db = db; S.user = user;
  if(user){
    try{ S.platAdmin = await user.canEdit(); }catch(_){}
    try{ S.isOwner = await user.isOwner(); }catch(_){}
    try{ S.uid = await user.id(); }catch(_){}
    try{ S.canWrite = await user.can("data.write"); }catch(_){}
    try{ S.me = await user.me(); }catch(_){}
  }
  S.ownerIds = S.isOwner && S.uid ? [S.uid] : [];
  computeRole();
  if(!db){ showNoDb(); return; }
  db.doc("config/clube").onSnapshot(s=>{ S.config = s.exists ? Object.assign({}, DEFAULT_CONFIG, s.data()) : DEFAULT_CONFIG; S.configLoaded=true; computeRole(); if(S.tab!=="alunos") render(); else updateBadge(); }, ()=>{});
  db.collection("boletins").orderBy("data","desc").limit(30).onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{const x=d.data(); if(x&&x.data) m[x.data]=x;}); S.boletins=m; S.boletinsLoaded=true; if(S.tab==="mar") renderMar(); else if(S.tab==="agenda") renderAgenda(); }, ()=>{ S.boletinsLoaded=true; renderMar(); });
  db.collection("previsoes").where("data",">=",addDays(todaySP(),-2)).orderBy("data","asc").limit(30).onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ const x=d.data(); if(x&&x.data) m[x.data]=x; }); S.previsoes=m; S.previsaoConectada=s.docs.length>0; if(S.tab==="mar") renderMar(); else if(S.tab==="agenda") renderAgenda(); }, ()=>{});
  const desde = addDays(todaySP(), -14);
  db.collection("turmas").where("data",">=",desde).orderBy("data","asc").limit(300).onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{const x=d.data(); if(x) m[d.id]=Object.assign({id:d.id},x);}); S.turmas=m; S.turmasLoaded=true; if(S.tab==="agenda") renderAgenda(); else if(S.tab==="competicao") renderCompeticao(); else if(S.tab==="mar") renderMar(); refreshSheet(); }, ()=>{ S.turmasLoaded=true; renderAgenda(); });
  db.collection("inscricoes").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=d.data()||{}; }); S.insc=m; resolveNames(); if(S.tab==="agenda") renderAgenda(); else if(S.tab==="competicao") renderCompeticao(); refreshSheet(); }, ()=>{});
  db.collection("avisos").orderBy("criado","desc").limit(150).onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=Object.assign({_id:d.id}, d.data()); }); S.avisos=m; S.avisosLoaded=true; if(S.tab==="mural"){ marcarLido(); renderMural(); } else if(S.tab==="agenda") renderAgenda(); else if(S.tab==="mar") renderMar(); updateBadge(); }, ()=>{ S.avisosLoaded=true; });
  db.collection("provas").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=Object.assign({_id:d.id}, d.data()); }); S.provas=m; if(S.tab==="competicao") renderCompeticao(); }, ()=>{});
  if(S.platAdmin){
    db.collection("atletas").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=d.data()||{}; }); S.atletas=m; S.atletaMe=S.uid?(m[S.uid]||null):null; resolveNames(); if(S.tab==="competicao") renderCompeticao(); }, ()=>{});
    db.collection("alunos").onSnapshot(s=>{ S.alunos = s.docs.map(d=>Object.assign({_id:d.id}, d.data())); S.alunosLoaded=true; S.minhaFicha = S.uid ? (S.alunos.find(a=>a._id===S.uid)||null) : null; updateBadge(); if(S.tab==="alunos") renderAlunos(); else if(S.tab==="competicao") renderCompeticao(); }, ()=>{ S.alunosLoaded=true; renderAlunos(); });
    db.collection("equipe").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=d.data()||{}; }); S.equipe=m; resolveNames(); if(S.tab==="clube") renderClube(); }, ()=>{});
    if(S.uid){ try{ const me=await db.doc("equipe/"+S.uid).get(); if(!me.exists) await db.doc("equipe/"+S.uid).set({desde:new Date().toISOString()}); }catch(_){} }
  } else if(S.uid){
    db.doc("atletas/"+S.uid).onSnapshot(s=>{ S.atletaMe=s.exists?s.data():null; if(S.tab==="competicao"||S.tab==="agenda") render(); }, ()=>{});
    db.doc("alunos/"+S.uid).onSnapshot(s=>{ S.minhaFicha=s.exists?s.data():null; S.alunosLoaded=true; render(); }, ()=>{ S.alunosLoaded=true; });
  }
  render();
})();
function montarBarraTeste(){
  const b=document.createElement("div"); b.className="testbar";
  b.innerHTML=`<span><b>Versão de testes.</b> Previsão ao vivo; dados salvos só neste aparelho.</span><label>Ver como <select id="tbPapel"><option value="gestao">Gestão</option><option value="instrutor">Instrutor</option><option value="aluno">Aluno</option></select></label><button class="linkbtn" id="tbLimpa">Apagar dados de teste</button>`;
  document.querySelector("main").prepend(b);
  const sel=b.querySelector("#tbPapel"); sel.value=TESTE.papel;
  sel.addEventListener("change",()=>{ try{ localStorage.setItem(TESTE.RKEY, sel.value); }catch(_){} location.reload(); });
  b.querySelector("#tbLimpa").addEventListener("click",async()=>{ if(!await ask("Apagar todos os dados salvos nesta versão de testes?","Apagar")) return; try{ localStorage.removeItem(TESTE.KEY); }catch(_){} location.reload(); });
}
setInterval(()=>{ try{ updateBadge(); }catch(_){} }, 60000);
function showNoDb(){
  const n=$("#dbnotice"); n.hidden=false;
  n.textContent="Abra este app pelo Claude, conectado à sua conta, para salvar boletins e cadastros.";
  S.boletinsLoaded=true; S.alunosLoaded=true; S.turmasLoaded=true; S.avisosLoaded=true; render();
}
})();
</script>
