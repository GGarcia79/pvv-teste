      root.querySelector("#fg").addEventListener("submit",async ev=>{
        ev.preventDefault(); const f=new FormData(ev.target);
        const o={id:g.id||rid(), dias:[0,1,2,3,4,5,6].filter(k=>f.get("d_"+k)), locais:LOCAIS.filter(l=>f.get("l_"+l)), inicio:f.get("inicio"), fim:f.get("fim"), titulo:f.get("titulo").toString().trim(), categoria:f.get("categoria")||"", ativo:!!f.get("ativo"), vagas:(f.get("vagas")||"").toString().trim()}; Object.assign(o, lerRegras(f));
        if(!o.dias.length || !o.locais.length){ toast("Escolha ao menos um dia e uma base"); return; }
        if(i>=0) grade[i]=o; else grade.push(o);
        await saveConfig({grade}); closeSheet(); toast("Horário salvo");
      });

}

/* ---------- utilidades ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(_){} }
function quando(iso){
  if(!iso) return ""; const d=new Date(iso), m=Math.round((Date.now()-d.getTime())/60000);
  if(m<1) return "agora"; if(m<60) return `há ${m} min`; if(m<24*60) return `há ${Math.round(m/60)} h`;
  if(m<48*60) return "ontem"; return d.toLocaleDateString("pt-BR",{day:"numeric",month:"short"}).replace(".","");
}
function dataCurta(iso){ return iso ? new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"") : ""; }
function linkOk(u){ return /^https?:\/\//i.test(u||""); }
async function copiar(txt){
  try{ await navigator.clipboard.writeText(txt); toast("Copiado, é só colar no WhatsApp"); }
  catch(_){ openSheet(`<div class="head"><h2>Copiar texto</h2><button class="x" aria-label="Fechar">×</button></div><p class="hint">Selecione o texto e copie.</p><textarea readonly style="width:100%;min-height:200px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink)">${esc(txt)}</textarea>`, root=>{ const t=root.querySelector("textarea"); t.focus(); t.select(); }); }
}

const TIPOS_AV = {geral:"Comunicado", cancelamento:"Cancelamento", agenda:"Agenda", passeio:"Passeio", competicao:"Competição", evento:"Evento", viagem:"Viagem", midia:"Mídia", formulario:"Formulário"};
function avisosVisiveis(){ const h=todaySP(); return Object.values(S.avisos).filter(a=>S.canEdit || !a.expira || a.expira>=h); }
function naoLidos(){ const v=lsGet("pvv-mural-visto")||""; return avisosVisiveis().filter(a=>(a.criado||"")>v).length; }
function marcarLido(){ const max=avisosVisiveis().reduce((m,a)=>(a.criado||"")>m?a.criado:m,""); if(max) lsSet("pvv-mural-visto",max); }

function textoAviso(a){
  let s=`*${(a.titulo||"").toUpperCase()}*\n${TIPOS_AV[a.tipo]||"Comunicado"}\n\n${a.texto||""}`;
  const q=[a.data_evento?dataCurta(a.data_evento):"", a.hora||""].filter(Boolean).join(", ");

}

/* ---------- COMPETIÇÃO ---------- */
const CATS = [["OPEN","Open",0],["M40","Master 40+",40],["M50","Master 50+",50],["M60","Master 60+",60],["M70","Master 70+",70]];
const CAT_LABEL = Object.assign(Object.fromEntries(CATS.map(c=>[c[0],c[1]])), {EST:"Estreante", PCD:"PCD"});
function catsPorAno(ano, ref){ ano=+ano; if(!ano) return null; const idade=(ref||+todaySP().slice(0,4))-ano; return CATS.filter(c=>idade>=c[2]).map(c=>c[0]); }
function catPrincipal(cs){ return cs && cs.length ? cs[cs.length-1] : null; }
function meusCats(ref){ const m=S.atletaMe; return m ? catsPorAno(m.ano, ref) : null; }
function nomeAtleta(uid){ const d=S.atletas[uid]||(uid===S.uid?S.atletaMe:null); if(d && d.apelido) return d.apelido; const i=S.insc[uid]; if(i && i.apelido) return i.apelido; const p=S.names[uid]; return (p && p.name) || "Atleta"; }
function diasAte(iso){ return Math.round((new Date(iso+"T12:00:00")-new Date(todaySP()+"T12:00:00"))/86400000); }

function renderCompeticao(){
  const el=$("#compBody");
  if(!S.db){ el.innerHTML=`<div class="locked"><h3>Competição indisponível aqui</h3><p>Abra este app pelo Claude, conectado à sua conta.</p></div>`; return; }
  if(S.compView && S.canAgenda){ renderTripulacoes(el, S.compView); return; }
  const h=todaySP();
  const provas=Object.values(S.provas).sort((a,b)=>(a.data||"").localeCompare(b.data||""));
  const futuras=provas.filter(p=>(p.data_fim||p.data)>=h), passadas=provas.filter(p=>(p.data_fim||p.data)<h).reverse();
  const prox=futuras.find(p=>p.status!=="cancelada");
  let html=`<div class="ag-head"><div><h2>Competição</h2><p class="hint">Provas, treinos por categoria e equipe.</p></div><span class="spacer"></span>${S.canEdit?`<button class="btn small" id="newPv">Nova prova</button>`:""}</div>`;
  if(prox){
    const dd=diasAte(prox.data), insc=prox.inscricao_ate?diasAte(prox.inscricao_ate):null;
    html+=`<button class="hero" data-pv="${esc(prox._id)}"><div class="hk">Próxima prova</div><div class="hn">${dd===0?"Hoje":dd===1?"Amanhã":`Faltam ${dd} dias`}</div>
      <div class="ht">${esc(prox.nome)}</div><div class="hs">${esc(dataCurta(prox.data))}${prox.local?", "+esc(prox.local):""}</div>
      ${insc!=null&&insc>=0?`<div class="hs ${insc<=7?"warn":""}">Inscrições até ${esc(dataCurta(prox.inscricao_ate))}${insc<=7?` (${insc===0?"hoje":`faltam ${insc} dias`})`:""}</div>`:""}
      ${(prox.categorias||[]).length?`<div class="chips">${prox.categorias.map(c=>`<span class="b">${esc(CAT_LABEL[c]||c)}</span>`).join("")}</div>`:""}</button>`;
  }
  if(S.uid && S.role!=="agencia") html+=painelMeuComp();
  // treinos
  const treinos=Object.values(S.turmas).filter(t=>t.categoria && (t.data>h || (t.data===h && Date.now()<startMs(t)+3*3600e3)))
    .sort((a,b)=>(a.data+a.inicio).localeCompare(b.data+b.inicio));
  html+=`<div class="dayhdr" style="margin-top:24px">Treinos da equipe</div>`;
  if(!treinos.length) html+=`<div class="empty">${S.canEdit?"Nenhum treino aberto. Na Agenda, crie uma remada do tipo treino e escolha a categoria.":"Nenhum treino aberto no momento."}</div>`;
  else { let last=null; for(const t of treinos){ if(t.data!==last){ last=t.data; html+=`<div class="subday">${dayHeader(t.data)}</div>`; } html+=cardTurma(t); } }

    </div>`;

}

      `${elig.length?`<label class="f" style="max-width:260px">Categoria<select id="pCat">${elig.map(c=>`<option value="${c}" ${me&&me.cat===c||(!me&&c===catPrincipal(elig.filter(z=>z!=="PCD")))?"selected":""}>${CATP[c]}</option>`).join("")}</select></label>`:`<p class="hint">Pela sua idade, nenhuma das categorias desta prova se aplica.</p>`}
      <div class="rsvp" style="border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden">${[["quero","Quero competir"],["talvez","Talvez"],["nao","Não vou"]].map(([k,l])=>`<button class="${k==="quero"?"vou":k}" data-ps="${k}" aria-pressed="${me&&me.s===k?"true":"false"}" ${k==="quero"&&!elig.length?"disabled":""}>${l}</button>`).join("")}</div>`}

const CHAVES_AGENDA = ["grade"];
async function saveConfig(patch){
  const ks=Object.keys(patch), soAgenda=ks.every(k=>CHAVES_AGENDA.includes(k));
  try{
    if(soAgenda){ await S.db.doc("config/agenda").set(Object.assign({}, S.configAgenda||{}, patch)); }
    else { const base=Object.assign({}, S.configClube||{}); ks.filter(k=>!CHAVES_AGENDA.includes(k)).forEach(k=>base[k]=patch[k]); await S.db.doc("config/clube").set(base); if(ks.some(k=>CHAVES_AGENDA.includes(k))){ const ag=Object.assign({}, S.configAgenda||{}); CHAVES_AGENDA.forEach(k=>{ if(k in patch) ag[k]=patch[k]; }); await S.db.doc("config/agenda").set(ag); } }
    return true;
  }catch(e){ failWrite(e); return false; }
}

function failWrite(e){
  const code = e && e.code;
  if(code==="invalid_argument") toast("Você não tem permissão para alterar esses dados");
  else if(code==="quota_exceeded") toast("Limite de armazenamento atingido");
  else toast("Não foi possível salvar. Tente de novo.");
}

/* ---------- maré: enchente ou vazante ---------- */
function faseMare(dia, i, base){
  const s=dia.h && dia.h.sea; if(!s) return null;
  const a=s[Math.max(0,i-1)], b=s[Math.min(23,i+1)]; if(a==null||b==null) return null;
  const d=(b-a)/2;
  let cur=null; if(dia.h.cur && dia.h.cur[i]!=null) cur={kn:dia.h.cur[i]/1.852, dir:dia.h.curdir?dia.h.curdir[i]:null};
  if(Math.abs(d)<0.025) return {cls:"estofo", nome:"Estofo", txt:"Virada da maré, corrente fraca", cur};
  const baia=(base&&B(base).baia)||"baía";
  return d>0 ? {cls:"enchente", nome:"Enchente", txt:`Água entrando na ${baia}`, cur}
             : {cls:"vazante", nome:"Vazante", txt:`Água saindo da ${baia}`, cur};
}
function mareFaixa(dia, i, manual, base){
  const f=faseMare(dia,i,base);
  if(!f) return manual ? `<div class="mareline"><b>Corrente de maré</b><span>${esc(manual)}</span></div>` : `<div class="mareline"><b>Corrente de maré</b><span>Sem dados do modelo. Consulte o SISCORAR antes de sair.</span></div>`;

/* ---------- frequência ---------- */
function frequencia(dias){
  const ini=addDays(todaySP(),-dias), hoje=todaySP(), out={};
  const o=id=>out[id]||(out[id]={pres:0,agend:0,tarde:0,ult:""});
  for(const t of Object.values(S.turmas)){
    if(t.data<ini || t.data>hoje || t.status==="cancelada") continue;
    const ck=t.checkin||{};
    for(const k of Object.keys(ck)){ if(!ck[k]) continue; let id=null;
      if(k.startsWith("u_")) id=k.slice(2); else if(k.startsWith("m_")){ const m=(t.manual||{})[k.slice(2)]; id=m&&m.aluno; }
      if(id){ const x=o(id); x.pres++; if(t.data>x.ult) x.ult=t.data; } }
    for(const m of Object.values(t.manual||{})) if(m && m.s==="vou" && m.aluno) o(m.aluno).agend++;
  }
  for(const [uid,d] of Object.entries(S.insc)) for(const [tid,r] of Object.entries((d&&d.r)||{})){ const t=S.turmas[tid]; if(!t||t.data<ini||t.data>hoje) continue; if(r.s==="vou") o(uid).agend++; if(r.tarde) o(uid).tarde++; }
  return out;
}
function ultimaPresenca(){ return frequencia(120); }
function presencasSemana(semanas){
  const out=[]; const hoje=todaySP();
  for(let w=semanas-1; w>=0; w--){ const fim=addDays(hoje,-7*w), ini=addDays(fim,-6); let n={}; LOCAIS.forEach(l=>n[l]=0);
    for(const t of Object.values(S.turmas)){ if(t.data<ini||t.data>fim||t.status==="cancelada") continue; const c=Object.values(t.checkin||{}).filter(Boolean).length; n[t.local]=(n[t.local]||0)+c; }
    out.push({ini, n}); }
  return out;
}

function barras(itens, max, cor){ max=max||Math.max(1,...itens.map(i=>i[1])); return `<div class="bars">${itens.map(([l,v,extra])=>`<div class="barrow"><span class="bl">${esc(l)}</span><span class="bt"><i style="width:${Math.round(v/max*100)}%;background:${cor||"var(--ocean)"}"></i></span><span class="bv">${v}${extra?` <small>${esc(extra)}</small>`:""}</span></div>`).join("")}</div>`; }
function renderPainel(el){
  const hoje=todaySP(), ativos=S.alunos.filter(a=>a.status!=="inativo"&&a.status!=="trancado");
  const f30=frequencia(30), f120=ultimaPresenca();
  const emDia=ativos.filter(a=>pagoEmDia(a)===true), aberto=ativos.filter(a=>pagoEmDia(a)===false);
  const pres30=Object.values(f30).reduce((s,x)=>s+x.pres,0);
  const fichasOk=ativos.filter(a=>fichaStatus(a).s==="ok"||fichaStatus(a).s==="vence").length;
  const resgatar=emDia.filter(a=>{ const u=(f120[a._id]||{}).ult; return !u || u<addDays(hoje,-21); });
  const devedores=aberto.filter(a=>(f30[a._id]||{}).pres>0).sort((x,y)=>(f30[y._id].pres)-(f30[x._id].pres));
  const top=ativos.map(a=>[a.nome||"Sem nome",(f30[a._id]||{}).pres||0]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const tardes=Object.values(f30).reduce((s,x)=>s+x.tarde,0);
  const sem=presencasSemana(8), maxS=Math.max(1,...sem.map(s=>LOCAIS.reduce((a,l)=>a+(s.n[l]||0),0)));
  const CORB=["var(--ocean)","#3D958F","#B9800F","#7A4FD0"];
  const porPlano=Object.entries(PLANOS).map(([k,[n]])=>[n, ativos.filter(a=>a.plano_tipo===k).length]);
  const semPlano=ativos.filter(a=>!a.plano_tipo).length;
  const pr=precos();
  const receita=emDia.reduce((s,a)=>{ const p=PLANOS[a.plano_tipo]; const v=+pr[a.plano_tipo]||0; return s+(p&&v?v/p[1]:0); },0);
  const lista=(arr,info)=>arr.length?`<div class="list">${arr.slice(0,30).map(a=>`<div class="item" style="cursor:default"><span class="av">${esc(initials(a.nome))}</span><span style="min-width:0;flex:1"><span class="nm">${esc(a.nome||"Sem nome")}</span><span class="sub"> ${esc(info(a))}</span></span>${a.telefone?`<a class="btn ghost small" href="${waLink(`Oi, ${(a.nome||"").split(" ")[0]}! Aqui é do Praia Vermelha Va'a.`, a.telefone)}" target="_blank" rel="noopener">WhatsApp</a>`:""}<button class="btn ghost small" data-va="${esc(a._id)}">Ficha</button></div>`).join("")}</div>`:`<div class="empty">Ninguém nesta lista.</div>`;
  el.innerHTML=`<h2 class="ptitle">Painel social</h2>
    <div class="kpis">${kpi(ativos.length,"alunos ativos")}${kpi(pres30,"presenças em 30 dias")}${kpi(`${emDia.length}<small>/${ativos.length}</small>`,"mensalidade em dia", aberto.length?"warn":"")}${kpi(`${fichasOk}<small>/${ativos.length}</small>`,"fichas em dia", fichasOk<ativos.length?"warn":"")}</div>
    <div class="panel"><h3>Para resgatar</h3><p class="hint" style="margin:0 0 8px">Mensalidade em dia, mas sem remar há mais de 21 dias. Vale um contato antes que deixem o clube.</p>${lista(resgatar,a=>{ const u=(f120[a._id]||{}).ult; return u?`última remada ${dataCurta(u)}`:"sem presença registrada"; })}</div>
    <div class="panel"><h3>Remando com mensalidade em aberto</h3><p class="hint" style="margin:0 0 8px">Alunos frequentes com pagamento vencido. O agendamento não é bloqueado.</p>${lista(devedores,a=>`${f30[a._id].pres} presenças em 30 dias, ${a.pago_ate?`pago até ${dataCurta(a.pago_ate)}`:"pagamento pendente"}`)}</div>
    <div class="panel"><h3>Mais assíduos, 30 dias</h3>${top.length?barras(top,0,"var(--ok)"):`<div class="empty">Sem check-ins registrados ainda. A frequência conta os check-ins feitos na praia.</div>`}</div>
    <div class="panel"><h3>Presenças por semana</h3><div class="wk">${sem.map(s=>`<div class="wkc"><div class="wkb">${LOCAIS.map((l,k)=>`<i style="height:${(s.n[l]||0)/maxS*100}%;background:${CORB[k%4]}"></i>`).join("")}</div><span>${new Date(s.ini+"T12:00").toLocaleDateString("pt-BR",{day:"numeric",month:"numeric"})}</span></div>`).join("")}</div><div class="legend">${LOCAIS.map((l,k)=>`<span><i style="background:${CORB[k%4]}"></i>${esc(B(l).curto)}</span>`).join("")}</div></div>
    <div class="panel"><h3>Planos</h3>${barras(porPlano.concat(semPlano?[["Sem plano definido",semPlano]]:[]),0,"#7A4FD0")}${receita?`<p style="margin:8px 0 0">Receita mensal estimada dos alunos em dia: <b>${receita.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</b></p>`:`<p class="hint">Defina o plano de cada aluno na ficha para ver a receita estimada.</p>`}</div>
    <div class="panel"><h3>Cadastro</h3>${barras([["Fichas em dia",fichasOk],["A revisar ou incompletas",ativos.length-fichasOk],["Cancelamentos fora do prazo (30 dias)",tardes]],Math.max(1,ativos.length),"var(--ocean)")}</div>`;
  el.querySelectorAll("[data-va]").forEach(b=>b.addEventListener("click",()=>verAluno(b.dataset.va)));
}
/* ---------- painel de competição ---------- */
function formCompeticao(){ return Object.values(S.forms).filter(f=>f.tipo==="competicao").sort((a,b)=>(b.criado||"").localeCompare(a.criado||""))[0]||null; }
function renderPainelComp(el){
  const fc=formCompeticao(); const resp=fc?Object.entries(S.formresp).filter(([u,d])=>d&&d.r&&d.r[fc._id]):[];
  const equipe=S.alunos.filter(a=>a.equipe&&a.status!=="inativo");
  const respIds=new Set(resp.map(r=>r[0]));
  const pend=equipe.filter(a=>!respIds.has(a._id));
  const catDe=a=>catPrincipal(catsPorAno((a.nascimento||"").slice(0,4)));
  const atl=Object.values(S.atletas||{}).filter(cadastroCompOk), anoR=+todaySP().slice(0,4);
  const porCat=CATEG_PROVA.map(([k,l])=>[l, atl.filter(a=>k==="EST"?ehEstreante(a,anoR):k==="PCD"?a.pcd==="sim":(catPrincipal(catsPorAno(a.ano))===k)).length]);
  const porNaipe=[["Feminino",equipe.filter(a=>a.naipe==="Feminino").length],["Masculino",equipe.filter(a=>a.naipe==="Masculino").length],["Não informado",equipe.filter(a=>!a.naipe).length]];
  const f30=frequencia(30), treinos={};
  for(const t of Object.values(S.turmas)){ if(!t.categoria||t.data<addDays(todaySP(),-30)||t.data>todaySP()) continue; for(const k of Object.keys(t.checkin||{})) if(t.checkin[k]&&k.startsWith("u_")) treinos[k.slice(2)]=(treinos[k.slice(2)]||0)+1; }
  const topT=Object.entries(treinos).map(([id,n])=>[(S.alunos.find(a=>a._id===id)||{}).nome||nomeAtleta(id),n]).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const provas=Object.values(S.provas).filter(p=>(p.data_fim||p.data)>=todaySP()).sort((a,b)=>a.data.localeCompare(b.data));
  el.innerHTML=`<h2 class="ptitle">Painel de competição</h2>
    <div class="kpis">${kpi(equipe.length,"atletas na equipe")}${kpi(resp.length,`fichas de atleta${fc?"":" (sem formulário)"}`)}${kpi(pend.length,"atletas sem ficha", pend.length?"warn":"")}${kpi(provas.length,"provas no calendário")}</div>
    <div class="panel"><h3>Atletas com cadastro de competição: ${atl.length}</h3><p class="hint" style="margin:0 0 8px">Categoria principal pela idade; estreantes e PCD contados à parte.</p>${barras(porCat,0,"#B9800F")}<h3 style="margin-top:14px">Por naipe (equipe)</h3>${barras(porNaipe,0,"#1C6C86")}</div>
    <div class="panel"><h3>Ficha de atleta pendente</h3>${pend.length?`<p style="margin:0">${pend.map(a=>esc(a.nome)).join(", ")}</p>${fc?`<button class="btn ghost small" style="margin-top:8px" id="lembraComp">Lembrar no WhatsApp</button>`:""}`:`<p class="hint" style="margin:0">Todos os atletas da equipe preencheram.</p>`}</div>
    <div class="panel"><h3>Interesse nas próximas provas</h3>${provas.length?provas.map(p=>{ const q=Object.values(S.atletas).filter(x=>x.provas&&x.provas[p._id]&&x.provas[p._id].s==="quero"); const tr=Array.isArray(p.tripulacoes)?p.tripulacoes:[], sent=new Set(); tr.forEach(c=>c.bancos.forEach(b=>{ if(b) sent.add(b.uid); })); const dist=Object.entries(S.atletas).filter(([u,x])=>x.provas&&x.provas[p._id]&&x.provas[p._id].s==="quero"&&sent.has(u)).length;
      return `<div class="grade-row"><div><b>${esc(p.nome)}</b><div class="hint" style="margin:0">${esc(dataCurta(p.data))}, ${CATEG_PROVA.map(c=>`${c[1]}: ${q.filter(x=>x.provas[p._id].cat===c[0]).length}`).join(", ")}</div><div class="hint" style="margin:0">${tr.length} canoas, ${dist} distribuídos, ${q.length-dist} pendentes</div></div><span class="spacer"></span><button class="btn ghost small" data-mt="${esc(p._id)}">Montar</button></div>`; }).join(""):`<p class="hint" style="margin:0">Nenhuma prova cadastrada.</p>`}</div>
    <div class="panel"><h3>Presença em treinos por categoria, 30 dias</h3>${topT.length?barras(topT,0,"#B9800F"):`<p class="hint" style="margin:0">Sem check-ins em treinos de categoria.</p>`}</div>
    ${fc?`<div class="row"><button class="btn ghost small" id="verResp">Ver respostas da ficha de atleta</button></div>`:""}`;
  const lc=el.querySelector("#lembraComp"); if(lc) lc.addEventListener("click",()=>compartilharWhats("competicao",`*${fc.titulo.toUpperCase()}*\nQuem quer competir pelo PVV precisa preencher a ficha de atleta no app, aba Mídia.\n\nPendentes: ${pend.map(a=>a.nome).join(", ")}`));
  const vr=el.querySelector("#verResp"); if(vr) vr.addEventListener("click",()=>verRespostas(fc._id));
  el.querySelectorAll("[data-mt]").forEach(b=>b.addEventListener("click",()=>{ S.compView=b.dataset.mt; S.tripPag=0; S.tripLista="pend"; setTab("competicao"); S.compView=b.dataset.mt; renderCompeticao(); }));
}
/* ---------- auditoria ---------- */
function renderAuditoria(el){
  el.innerHTML=`<h2 class="ptitle">Auditoria</h2><div class="empty">Carregando…</div>`;
  S.db.collection("auditoria").orderBy("quando","desc").limit(100).get().then(s=>{
    const rows=s.docs.map(d=>d.data());
    el.innerHTML=`<h2 class="ptitle">Auditoria</h2><p class="hint">Últimas 100 alterações feitas pela equipe.</p>${rows.length?`<div class="list">${rows.map(r=>`<div class="item" style="cursor:default"><span style="min-width:0"><span class="nm">${esc(r.acao)}</span><span class="sub"> ${esc(r.alvo||"")}</span><span class="badges"><span class="b">${esc((S.names[r.quem]&&S.names[r.quem].name)||"Equipe")}</span><span class="b">${new Date(r.quando).toLocaleString("pt-BR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span></span></span></div>`).join("")}</div>`:`<div class="empty">Nenhuma alteração registrada ainda.</div>`}`;
  }).catch(()=>{ el.innerHTML=`<h2 class="ptitle">Auditoria</h2><div class="empty">Não foi possível carregar.</div>`; });
}

function formVisivel(f){
  if(S.canAgenda) return true; if(!f.ativo) return false; if(f.prazo && f.prazo<todaySP()) return false;
  if(f.publico==="todos"||!f.publico) return true;
  const a=S.minhaFicha||{}; if(f.publico==="atletas") return !!a.equipe;
  const cs=catsPorAno((a.nascimento||"").slice(0,4))||meusCats(); return !!(cs && cs.includes(f.publico));
}

function editForm(id){
  const base = id ? JSON.parse(JSON.stringify(S.forms[id])) : {titulo:"", descricao:"", tipo:"geral", publico:"todos", prazo:"", ativo:true, campos:[{rotulo:"",tipo:"texto",obrig:true}]};
  let campos = base.campos.map(c=>Object.assign({id:c.id||rid()},c));
  const selO=(name,opts,val)=>`<select name="${name}">${Object.entries(opts).map(([k,v])=>`<option value="${k}" ${k===val?"selected":""}>${v}</option>`).join("")}</select>`;
  openSheet(`<div class="head"><h2>${id?"Editar formulário":"Novo formulário"}</h2><button class="x" aria-label="Fechar">×</button></div>
    ${id?"":`<div class="row" style="margin-bottom:8px"><button type="button" class="btn ghost small" id="modComp">Usar modelo: PVV Competição 2027</button></div>`}
    <form id="fform"><div class="grid">
      <label class="f full">Título<input name="titulo" required value="${esc(base.titulo)}" placeholder="Ex.: Viagem para Búzios"></label>
      <label class="f full">Explicação para quem vai responder<textarea name="descricao">${esc(base.descricao)}</textarea></label>
      <label class="f">Tipo${selO("tipo",TIPOS_FORM,base.tipo)}</label>
      <label class="f">Quem recebe${selO("publico",PUBLICOS,base.publico)}</label>
      <label class="f">Respostas até<input name="prazo" type="date" value="${esc(base.prazo)}"></label>
      <label class="chk" style="align-self:end"><input type="checkbox" name="ativo" ${base.ativo!==false?"checked":""}> Aberto para respostas</label>
    </div>
    <h3 style="margin:16px 0 6px">Perguntas</h3><div id="camposBox"></div>
    <button type="button" class="btn ghost small" id="addCampo">Adicionar pergunta</button>
    <div class="row" style="margin-top:18px">${id?`<button type="button" class="btn danger small" id="delForm">Excluir</button>`:""}<span class="spacer"></span><button type="button" class="btn ghost" id="cForm">Cancelar</button><button class="btn" type="submit">${id?"Salvar":"Publicar formulário"}</button></div></form>`, root=>{
    const box=root.querySelector("#camposBox");
    const lerCampos=()=>{ box.querySelectorAll(".campo").forEach((el,i)=>{ const c=campos[i]; c.rotulo=el.querySelector("[data-k=rotulo]").value; c.tipo=el.querySelector("[data-k=tipo]").value; c.obrig=el.querySelector("[data-k=obrig]").checked; const op=el.querySelector("[data-k=opcoes]"); if(op) c.opcoes=op.value.split("\n").map(x=>x.trim()).filter(Boolean); }); };
    const desenha=()=>{ box.innerHTML=campos.map((c,i)=>`<div class="campo"><div class="row" style="gap:6px"><b class="cn">${i+1}</b><input data-k="rotulo" value="${esc(c.rotulo)}" placeholder="Pergunta" aria-label="Pergunta ${i+1}"><button type="button" class="ib" data-up="${i}" aria-label="Subir">↑</button><button type="button" class="ib" data-dn="${i}" aria-label="Descer">↓</button><button type="button" class="ib" data-rm="${i}" aria-label="Remover">✕</button></div>
      <div class="row" style="gap:10px;margin-top:6px"><select data-k="tipo">${Object.entries(TIPOS_CAMPO).map(([k,v])=>`<option value="${k}" ${k===c.tipo?"selected":""}>${v}</option>`).join("")}</select><label class="chk"><input type="checkbox" data-k="obrig" ${c.obrig?"checked":""}> Obrigatória</label></div>
      ${["escolha","multipla"].includes(c.tipo)?`<textarea data-k="opcoes" placeholder="Uma opção por linha">${esc((c.opcoes||[]).join("\n"))}</textarea>`:""}</div>`).join("");
      box.querySelectorAll("[data-k=tipo]").forEach(s=>s.addEventListener("change",()=>{ lerCampos(); desenha(); }));

      box.querySelectorAll("[data-dn]").forEach(b=>b.addEventListener("click",()=>{ lerCampos(); const i=+b.dataset.dn; if(i<campos.length-1){ [campos[i+1],campos[i]]=[campos[i],campos[i+1]]; desenha(); } }));
      box.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{ lerCampos(); campos.splice(+b.dataset.rm,1); desenha(); }));
    };
    desenha();

    root.querySelector("#fform").addEventListener("submit",async ev=>{

        if(!id){ await S.db.doc("avisos/form_"+fid).set({tipo:"formulario", titulo:o.titulo, texto:`${o.descricao}\nResponda no app, aba Mídia.${o.prazo?` Prazo: ${dataCurta(o.prazo)}.`:""}`, data_evento:o.prazo||"", hora:"", local:"", link:"", expira:o.prazo||"", fixado:false, criado:new Date().toISOString(), publico:o.publico});
          compartilharWhats(o.tipo==="competicao"?"competicao":"formulario", `*${o.titulo.toUpperCase()}*\n${o.descricao}\n\nPara: ${PUBLICOS[o.publico]}.${o.prazo?` Responda até ${dataCurta(o.prazo)}.`:""}\nResponda no app do clube, aba Mídia.`); }
        else { closeSheet(); toast("Formulário salvo"); }
      }catch(e){ failWrite(e); }
    });
  });
}
function campoHTML(c, v){
  const nm="c_"+c.id, req=c.obrig?" *":"";
  const lab=`<span class="ql">${esc(c.rotulo)}${req}</span>`;
  switch(c.tipo){
    case "paragrafo": return `<label class="f full">${lab}<textarea name="${nm}">${esc(v||"")}</textarea></label>`;
    case "data": return `<label class="f full">${lab}<input type="date" name="${nm}" value="${esc(v||"")}"></label>`;
    case "numero": return `<label class="f full">${lab}<input inputmode="decimal" name="${nm}" value="${esc(v||"")}"></label>`;
    case "email": return `<label class="f full">${lab}<input type="email" name="${nm}" value="${esc(v||"")}"></label>`;
    case "telefone": return `<label class="f full">${lab}<input type="tel" name="${nm}" value="${esc(v||"")}"></label>`;
    case "cpf": return `<label class="f full">${lab}<input inputmode="numeric" maxlength="14" data-cpf name="${nm}" placeholder="000.000.000-00" value="${esc(v||"")}"></label>`;

function lerCampo(f, c){ const nm="c_"+c.id; if(c.tipo==="multipla") return f.getAll(nm); const v=(f.get(nm)||"").toString().trim(); return c.tipo==="cpf"?fmtCPF(v):v; }
function erroCampo(c, v){
  const vazio = Array.isArray(v)? !v.length : !v;

function marcarVisto(k){ const max={midia:Object.values(S.midia).reduce((m,p)=>(p.criado||"")>m?p.criado:m,"")}[k]; if(max) lsSet("pvv-visto-"+k,max); }

function vagasDe(t){
  if(t.vagas!=null && t.vagas!=="" && !isNaN(+t.vagas)) return +t.vagas;
  const v=(S.config.canoas||[]).filter(c=>c.status!=="manutencao" && (c.local||LOCAIS[0])===t.local).reduce((a,c)=>a+(+c.lugares||0),0);
  return v>0?v:null;
}
const OFERTA_MS = 10*60*1000;
/* fila inteligente: quem entra com a remada cheia vai para a fila por ordem de chegada.
   Quando abre vaga, o primeiro da fila recebe a oferta e tem 10 minutos para confirmar; se não confirmar, passa para o próximo. */
function entradas(t){
  const out=[];
  for(const [uid,doc] of Object.entries(S.insc)){ const r=doc && doc.r && doc.r[t.id]; if(r && r.s) out.push({key:"u_"+uid, uid, s:r.s, t:r.t||"", tj:r.tj||r.t||"", fila:!!r.fila, aceite:r.aceite||"", saiu:r.saiu||""}); }
  for(const [mid,m] of Object.entries(t.manual||{})){ if(m && m.s) out.push({key:"m_"+mid, mid, nome:m.nome, s:m.s, t:m.t||"", tj:m.t||"", manual:true}); }
  const cap=vagasDe(t), now=Date.now();
  const vou=out.filter(e=>e.s==="vou").sort((a,b)=>a.tj.localeCompare(b.tj));
  const firmes=vou.filter(e=>e.manual||!e.fila||e.aceite);
  const pend=vou.filter(e=>!(e.manual||!e.fila||e.aceite));
  if(cap==null) return {cap, conf:vou, espera:[], ofertas:[], expirados:[], livres:Infinity, talvez:out.filter(e=>e.s==="talvez"), nao:out.filter(e=>e.s==="nao")};
  const conf=firmes.slice(0,cap), sobra=firmes.slice(cap);
  let livres=Math.max(0, cap-firmes.length);
  const saidas=out.filter(e=>e.saiu).map(e=>new Date(e.saiu).getTime()).sort((a,b)=>a-b);
  const base=saidas.length?saidas[saidas.length-1]:0;
  const slots=Array.from({length:livres},()=>base);
  const ofertas=[], expirados=[], espera=[...sobra];
  for(const e of pend){
    let j=slots.findIndex(x=>x!==null);
    while(j>=0){
      const ini=Math.max(slots[j], new Date(e.tj).getTime()), fim=ini+OFERTA_MS;
      if(now>fim){ e.expirou=fim; expirados.push(e); slots[j]=fim; e._done=true; break; }
      e.oferta=fim; ofertas.push(e); slots[j]=null; e._done=true; break;
    }
    if(!e._done) espera.push(e);
  }
  const livresReais = slots.filter(x=>x!==null).length;
  return {cap, conf, ofertas, espera, expirados, livres:livresReais, talvez:out.filter(e=>e.s==="talvez").sort((a,b)=>a.t.localeCompare(b.t)), nao:out.filter(e=>e.s==="nao")};
}
function nomeDe(e){
  if(e.manual) return e.nome||"Aluno";
  const al=S.alunos&&S.alunos.find(a=>a._id===e.uid); if(al&&al.nome) return al.nome;
  const d=S.insc[e.uid]; if(d && d.apelido) return d.apelido;
  const p=S.names[e.uid]; return (p && p.name) || "Aluno";
}
function meuStatus(t,E){
  if(!S.uid) return null;
  const r=S.insc[S.uid] && S.insc[S.uid].r && S.insc[S.uid].r[t.id]; if(!r) return null;
  if(r.s==="vou"){
    const o=E.ofertas.find(e=>e.uid===S.uid); if(o) return {s:"oferta", ate:o.oferta};
    const x=E.expirados.find(e=>e.uid===S.uid); if(x) return {s:"expirou"};
    const i=E.espera.findIndex(e=>e.uid===S.uid); if(i>=0) return {s:"espera", pos:i+1+E.ofertas.length};
  }
  return {s:r.s};
}
function conflitoHorario(t){
  if(!S.uid) return null; const meus=(S.insc[S.uid]&&S.insc[S.uid].r)||{};
  const ini=startMs(t), fim=new Date(`${t.data}T${t.fim||t.inicio}:00-03:00`).getTime()||ini+90*60e3;
  return Object.values(S.turmas).find(o=>o.id!==t.id && o.data===t.data && o.status!=="cancelada" && meus[o.id] && meus[o.id].s==="vou" && (()=>{ const a=startMs(o), b=new Date(`${o.data}T${o.fim||o.inicio}:00-03:00`).getTime()||a+90*60e3; return a<fim && ini<b; })())||null;
}
async function rsvp(tid,s,opts){
  opts=opts||{};
  if(!S.uid || S.pending) return;
  const t=S.turmas[tid]; if(!t) return;
  if(s==="vou" && !opts.semConflito){
    const c=conflitoHorario(t);
    if(c){ const ok=await ask(`Você já está confirmado na remada das ${c.inicio} ${naBase(c.local)} neste dia. Não é possível remar em duas bases no mesmo horário. Quer trocar para a base ${B(t.local).curto}?`,"Trocar de base"); closeSheet(); if(!ok) return;

  const cut=addDays(todaySP(),-120);
  Object.keys(r).forEach(k=>{ if(k.slice(0,10)<cut) delete r[k]; });
  const cur=r[tid]; if(cur && cur.s===s && !opts.reentrar) return;

  finally{ S.pending=false; renderAgenda(); refreshSheet(); }
}

function slug(t){ return (t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"").slice(0,20)||("base"+rid().slice(0,4)); }

const CATEG_PROVA = [["EST","Estreante"],["OPEN","Open"],["M40","Master 40+"],["M50","Master 50+"],["M60","Master 60+"],["M70","Master 70+"],["PCD","PCD"]];

function idadeEm(a, ano){ return a && +a.ano ? ano - (+a.ano) : null; }
function ehEstreante(a, ano){ if(!a) return false; if(a.competiu==="nao") return true; if(a.competiu==="sim" && +a.comp_desde) return ano - (+a.comp_desde) < 2; return false; }
function elegivel(a, cat, ano){
  if(!a) return [false,"Sem cadastro de competição"];
  const id=idadeEm(a, ano);
  if(cat==="OPEN") return [true,""];
  if(cat==="EST") return ehEstreante(a,ano)?[true,""]:[false, a.competiu?"Compete há 2 anos ou mais":"Não informou se já competiu"];
  if(cat==="PCD") return a.pcd==="sim"?[true,""]:[false,"Categoria para pessoas com deficiência"];
  const min=+cat.slice(1); if(id==null) return [false,"Ano de nascimento não informado"];
  return id>=min?[true,""]:[false,`Idade ${id}: abaixo de ${min} anos`];
}

function cadastroCompOk(a){ return !!(a && +a.ano && a.naipe && a.competiu && (a.competiu==="nao"||+a.comp_desde) && a.pcd && a.termo_comp); }

function aplicarA11y(){ const a=a11yGet(); document.body.style.zoom = a.fonte; document.documentElement.classList.toggle("hc", !!a.contraste); REDUZ = !!a.reduzir || (()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(_){ return false; } })(); }
const TEM_VOZ = "speechSynthesis" in window;
const Reconhecedor = window.SpeechRecognition || window.webkitSpeechRecognition || null;
function vozLang(){ return {"pt-BR":"pt-BR","pt-PT":"pt-PT",en:"en-US",es:"es-ES",fr:"fr-FR",zh:"zh-CN",hi:"hi-IN",ar:"ar-SA",bn:"bn-BD",ru:"ru-RU"}[LANG]||"pt-BR"; }
function falar(txt){ return new Promise(res=>{ if(!TEM_VOZ){ res(); return; } try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt); u.lang=vozLang(); u.rate=1; let ok=false; const fim=()=>{ if(!ok){ ok=true; res(); } }; u.onend=fim; u.onerror=fim; speechSynthesis.speak(u); setTimeout(fim, Math.min(20000, 1500+txt.length*75)); }catch(_){ res(); } }); }
function pararFala(){ try{ if(TEM_VOZ) speechSynthesis.cancel(); }catch(_){} }
function ouvirTela(){ const v=document.querySelector(`#v-${S.tab}`); if(!v) return; const t=v.innerText.replace(/\s+\n/g,"\n").trim().slice(0,3500); falar(t); toast(tr("Ouvir esta tela")); }

/* ----- cadastro guiado por voz (8 etapas) ----- */
const MESES={janeiro:1,fevereiro:2,"março":3,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
function lerSimNao(t){ t=(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); if(/\b(nao|no|negativo|nunca)\b/.test(t)) return "nao"; if(/\b(sim|s|yes|claro|aceito|pode|ok|isso|positivo|quero|vamos|bora|continuar|pronto)\b/.test(t)) return "sim"; return null; }
function lerData(t){ t=(t||"").toLowerCase(); let m=t.match(/(\d{1,2})\D+(\d{1,2})\D+(\d{4})/); if(m) return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  m=t.match(/(\d{1,2})\s*(?:de\s+)?([a-zç]+)\s*(?:de\s+)?(\d{4})/); if(m && MESES[m[2]]) return `${m[3]}-${String(MESES[m[2]]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  m=t.match(/primeiro\s*(?:de\s+)?([a-zç]+)\s*(?:de\s+)?(\d{4})/); if(m && MESES[m[1]]) return `${m[2]}-${String(MESES[m[1]]).padStart(2,"0")}-01`; return null; }
function lerFone(t){ const d=(t||"").replace(/\D/g,""); return d.length>=10&&d.length<=13 ? d : null; }
function fmtData(iso){ return new Date(iso+"T12:00").toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"}); }
function passosVoz(){
  const P=[];
  P.push({e:1, t:"simnao", f:"Olá! Vou fazer o seu cadastro lendo cada pergunta em voz alta. Você pode responder falando ou digitando. Vamos começar o seu cadastro?", parar:true});
  P.push({e:1, t:"livre", f:"Tenha em mãos seus dados: nome completo, telefone, data de nascimento, um contato de emergência e o seu plano de saúde, se tiver. São 8 etapas. Diga continuar quando estiver pronto."});
  P.push({e:2, t:"simnao", c:"termo", obrig:true, f:"Etapa 2 de 8: termo de responsabilidade. A canoa havaiana tem riscos como quedas na água, emborcamento, sol forte e mudanças de vento. Você se compromete a informar seu estado de saúde, seguir os instrutores, usar colete quando indicado e revisar a ficha todo ano. Você aceita o termo de responsabilidade?"});
  P.push({e:3, t:"simnao", c:"lgpd", obrig:true, f:"Etapa 3 de 8: privacidade. Seus dados de saúde e contatos são usados só para sua segurança e para a organização do clube. Você pode pedir correção ou exclusão quando quiser. Você aceita a política de privacidade?"});
  P.push({e:3, t:"simnao", c:"imagem", f:"Esta é opcional: você autoriza o uso da sua imagem em fotos e vídeos do clube?"});
  P.push({e:4, t:"texto", c:"nome", conf:true, f:"Etapa 4 de 8: dados pessoais. Qual é o seu nome completo?"});
  P.push({e:4, t:"fone", c:"telefone", conf:true, f:"Qual é o seu telefone, com DDD?"});
  P.push({e:4, t:"data", c:"nascimento", conf:true, f:"Qual é a sua data de nascimento? Por exemplo: 5 de maio de 1980."});
  P.push({e:4, t:"texto", c:"email", opc:true, f:"Qual é o seu e-mail? Se preferir não informar, diga pular."});
  P.push({e:5, t:"texto", c:"emerg1_nome", conf:true, f:"Etapa 5 de 8: emergência e plano de saúde. Qual é o nome do seu contato de emergência?"});
  P.push({e:5, t:"fone", c:"emerg1_tel", conf:true, f:"Qual é o telefone desse contato, com DDD?"});
  P.push({e:5, t:"texto", c:"emerg1_par", opc:true, f:"Qual é o parentesco? Por exemplo: mãe, marido ou amiga. Ou diga pular."});
  P.push({e:5, t:"texto", c:"plano", f:"Qual é o seu plano de saúde? Se não tiver, diga: não possuo."});
  P.push({e:5, t:"simnao", c:"nada", f:"Você sabe nadar?"});
  ANAM.forEach(([k,t,l],i)=>{ P.push({e:6, t:"simnao", c:k, f:(i===0?"Etapa 6 de 8: anamnese, seu histórico de saúde. ":"")+l.replace(/\s*\(.*\)/,"")}); P.push({e:6, t:"texto", c:t, se:k, f:"Descreva, por favor."}); });
  P.push({e:6, t:"simnao", c:"fuma", f:"Você é fumante?"});
  P.push({e:6, t:"simnao", c:"gestante", f:"Está gestante? Se não se aplica, diga não."});
  P.push({e:6, t:"ativ", c:"atividade", f:"Você pratica outra atividade física? Diga: não pratico, uma a duas vezes por semana, ou três ou mais vezes."});
  PARQ.forEach((q,i)=>P.push({e:7, t:"simnao", c:"parq_"+i, f:(i===0?"Etapa 7 de 8: questionário PAR-Q, sete perguntas de sim ou não. ":"")+`Pergunta ${i+1}: ${q}`}));
  P.push({e:8, t:"enviar", f:""});
  return P;
}
function cadastroPorVoz(){
  if(!S.uid){ toast("Entre com sua conta"); return; }
  const base=JSON.parse(JSON.stringify(S.minhaFicha||{status:"ativo"})); delete base._id; base.parq=base.parq||[];
  const P=passosVoz(); let k=0, aguardandoConf=null, ouvindo=null, auto=!!Reconhecedor;
  const ov=document.createElement("div"); ov.className="vozbot"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true"); ov.setAttribute("aria-label",tr("Cadastro por voz"));
  ov.innerHTML=`<div class="vbox"><div class="vhead"><b>${tr("Cadastro por voz")}</b><span id="vEt" aria-live="polite"></span><button class="x" id="vSair" aria-label="Sair do cadastro por voz">×</button></div><div class="wbar"><i id="vBar"></i></div>
    <div class="vlog" id="vLog" aria-live="polite"></div>
    <form id="vF" class="vform"><input id="vIn" autocomplete="off" aria-label="Sua resposta" placeholder="Digite ou toque no microfone"><button class="btn" type="submit">Enviar</button></form>
    <div class="row" style="gap:8px;justify-content:center;margin-top:8px">${Reconhecedor?`<button class="btn mic" id="vMic" aria-label="Falar a resposta">🎤 Falar</button>`:""}<button class="btn ghost small" id="vRep">Repetir pergunta</button></div>
    ${Reconhecedor?"":`<p class="hint" style="text-align:center">Este navegador não reconhece voz. As perguntas são lidas em voz alta e você responde digitando.</p>`}</div>`;
  document.body.appendChild(ov);
  const log=ov.querySelector("#vLog"), inp=ov.querySelector("#vIn");
  const add=(quem,txt)=>{ const d=document.createElement("div"); d.className="vmsg "+quem; d.textContent=txt; log.appendChild(d); log.scrollTop=log.scrollHeight; };
  const sair=()=>{ pararFala(); try{ ouvindo&&ouvindo.abort(); }catch(_){} ov.remove(); };
  ov.querySelector("#vSair").addEventListener("click",sair);
  const ouvir=()=>{ if(!Reconhecedor) return; try{ const r=new Reconhecedor(); r.lang=vozLang(); r.interimResults=false; r.maxAlternatives=1; ouvindo=r; ov.classList.add("ouvindo"); r.onresult=e=>{ const t=e.results[0][0].transcript; responder(t); }; r.onend=()=>ov.classList.remove("ouvindo"); r.onerror=()=>ov.classList.remove("ouvindo"); r.start(); }catch(_){} };
  const perguntar=async(txt)=>{ add("bot",txt); await falar(txt); if(auto) ouvir(); else inp.focus(); };
  const pular=()=>{ while(k<P.length && P[k].se && base[P[k].se]!=="sim") k++; };
  const atual=()=>{ pular(); const p=P[k]; ov.querySelector("#vEt").textContent=`Etapa ${p.e} de 8`; ov.querySelector("#vBar").style.width=`${p.e/8*100}%`; return p; };
  const resumo=()=>`Revisão: nome ${base.nome}; telefone ${base.telefone}; nascimento ${base.nascimento?fmtData(base.nascimento):"não informado"}; contato de emergência ${base.emerg1_nome}, telefone ${base.emerg1_tel}; plano ${base.plano}; sabe nadar: ${base.nada==="sim"?"sim":"não"}; PAR-Q com ${(base.parq||[]).filter(x=>x==="sim").length} respostas sim.`;
  const proxima=async()=>{ k++; const p=atual(); if(!p) return; if(p.t==="enviar"){ const msg=`Etapa 8 de 8: revisão e envio. ${resumo()} Posso enviar sua ficha?`; await perguntar(msg); return; } await perguntar(p.f); };
  const enviar=async()=>{
    base.termo_nome=base.nome; base.parq=PARQ.map((_,i)=>base.parq[i]||""); const ag=new Date().toISOString(); base.termo_v=TERMO_V; base.priv_v=PRIV_V; base.termo_em=base.termo_em||ag; base.priv_em=base.priv_em||ag; base.lgpd_data=base.lgpd_data||ag; base.origem="app"; base.voz=true;
    const falta=faltando(base); if(falta.length){ await perguntar(`Ainda falta: ${falta.slice(0,3).join(", ")}. Vamos voltar a essas perguntas.`); k=0; await proxima(); return; }
    base.ficha_em=ag; base.atualizado=ag;
    try{ await S.db.doc("alunos/"+S.uid).set(base); S.minhaFicha=base; const st=fichaStatus(base); const fim=st.s==="liberacao"?"Ficha enviada. Como você respondeu sim no PAR-Q, entregue a liberação médica à coordenação para poder agendar.":"Ficha enviada com sucesso. Você já pode agendar remadas. Obrigado!"; add("bot",fim); await falar(fim); setTimeout(()=>{ sair(); render(); }, 600); }
    catch(e){ failWrite(e); }
  };
  const responder=async(txt)=>{
    txt=(txt||"").trim(); if(!txt) return; add("eu",txt); inp.value="";
    const p=P[k];
    if(aguardandoConf){ const sn=lerSimNao(txt); if(sn==="sim"){ base[aguardandoConf.c]=aguardandoConf.v; aguardandoConf=null; await proxima(); } else if(sn==="nao"){ aguardandoConf=null; await perguntar("Tudo bem, vamos de novo. "+p.f); } else await perguntar("Diga sim ou não, por favor."); return; }
    if(p.t==="enviar"){ const sn=lerSimNao(txt); if(sn==="sim") await enviar(); else if(sn==="nao"){ await perguntar("Certo, não enviei. Vamos revisar desde o início dos dados pessoais."); k=P.findIndex(x=>x.c==="nome")-1; await proxima(); } else await perguntar("Diga sim para enviar ou não para revisar."); return; }
    if(p.t==="simnao"){ const sn=lerSimNao(txt); if(!sn){ await perguntar("Não entendi. Responda sim ou não. "+p.f); return; }
      if(p.parar && sn==="nao"){ add("bot","Tudo bem. Quando quiser, é só voltar."); await falar("Tudo bem. Quando quiser, é só voltar."); sair(); return; }
      if(p.obrig && sn==="nao"){ await perguntar("Para usar o clube é preciso aceitar. Se tiver dúvidas, fale com a coordenação. "+p.f); return; }
      if(p.c){ if(p.c.startsWith("parq_")) base.parq[+p.c.slice(5)]=sn; else if(["termo","lgpd","imagem"].includes(p.c)) base[p.c]=sn==="sim"; else base[p.c]=sn; }
      await proxima(); return; }
    if(p.t==="livre"){ await proxima(); return; }
    let v=txt;
    if(p.opc && /^pular|^nao|^não/i.test(txt)){ base[p.c]=""; await proxima(); return; }
    if(p.t==="fone"){ v=lerFone(txt); if(!v){ await perguntar("Não entendi o número. Diga o DDD e o telefone, número por número."); return; } }
    if(p.t==="data"){ v=lerData(txt); if(!v){ await perguntar("Não entendi a data. Diga por exemplo: 5 de maio de 1980."); return; } }
    if(p.t==="ativ"){ const t=txt.toLowerCase(); v=/n[aã]o/.test(t)?"sedentario":/(tr[eê]s|3|mais)/.test(t)?"regular":/(uma|duas|1|2)/.test(t)?"leve":null; if(!v){ await perguntar("Diga: não pratico, uma a duas vezes, ou três ou mais vezes."); return; } }
    if(p.c==="plano" && /n[aã]o (tenho|possuo)/i.test(txt)) v="Não possuo";
    if(p.conf){ const mostra=p.t==="data"?fmtData(v):p.t==="fone"?v.split("").join(" "):v; aguardandoConf={c:p.c, v}; await perguntar(`Entendi: ${mostra}. Está correto?`); return; }
    base[p.c]=v; await proxima();
  };
  ov.querySelector("#vF").addEventListener("submit",e=>{ e.preventDefault(); responder(inp.value); });
  const mic=ov.querySelector("#vMic"); if(mic) mic.addEventListener("click",()=>{ pararFala(); ouvir(); });
  ov.querySelector("#vRep").addEventListener("click",()=>{ const p=P[k]; perguntar(p.t==="enviar"?`Posso enviar sua ficha?`:p.f); });
  k=0; atual(); perguntar(P[0].f);
}

  db.collection("avisos").orderBy("criado","desc").limit(150).onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=Object.assign({_id:d.id}, d.data()); }); S.avisos=m; S.avisosLoaded=true; if(S.tab==="mural"){ marcarLido(); renderMural(); } else if(S.tab==="agenda") renderAgenda(); else if(S.tab==="mar") renderMar(); updateBadge(); }, ()=>{ S.avisosLoaded=true; });
  db.collection("forms").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=Object.assign({_id:d.id}, d.data()); }); S.forms=m; updateBadge(); if(["midia","perfil"].includes(S.tab)) render(); }, ()=>{});
  db.collection("midia").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=Object.assign({_id:d.id}, d.data()); }); S.midia=m; updateBadge(); if(S.tab==="midia") renderMidia(); }, ()=>{});
  if(S.platAdmin) db.collection("formresp").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=d.data()||{}; }); S.formresp=m; S.minhasResp=S.uid?(m[S.uid]||null):null; if(["midia","perfil"].includes(S.tab)) render(); }, ()=>{});
  else if(S.uid) db.doc("formresp/"+S.uid).onSnapshot(s=>{ S.minhasResp=s.exists?s.data():null; updateBadge(); if(["midia","perfil"].includes(S.tab)) render(); }, ()=>{});
  db.collection("provas").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=Object.assign({_id:d.id}, d.data()); }); S.provas=m; if(S.tab==="competicao") renderCompeticao(); }, ()=>{});
  if(S.platAdmin){
    db.collection("atletas").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=d.data()||{}; }); S.atletas=m; S.atletaMe=S.uid?(m[S.uid]||null):null; resolveNames(); if(S.tab==="competicao") renderCompeticao(); }, ()=>{});
    db.collection("alunos").onSnapshot(s=>{ S.alunos = s.docs.map(d=>Object.assign({_id:d.id}, d.data())); S.alunosLoaded=true; S.minhaFicha = S.uid ? (S.alunos.find(a=>a._id===S.uid)||null) : null; updateBadge(); if(S.tab==="alunos") renderAlunos(); else if(["competicao","perfil"].includes(S.tab)) render(); }, ()=>{ S.alunosLoaded=true; renderAlunos(); });
    db.collection(FB?"membros":"equipe").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=d.data()||{}; }); S.equipe=m; resolveNames(); if(S.tab==="clube") renderClube(); }, ()=>{});
    if(S.uid && !FB){ try{ const me=await db.doc("equipe/"+S.uid).get(); if(!me.exists) await db.doc("equipe/"+S.uid).set({desde:new Date().toISOString()}); }catch(_){} }
  } else if(S.uid){
    db.doc("atletas/"+S.uid).onSnapshot(s=>{ S.atletaMe=s.exists?s.data():null; if(S.tab==="competicao"||S.tab==="agenda") render(); }, ()=>{});
    let perguntou=false;
    db.doc("alunos/"+S.uid).onSnapshot(s=>{ S.minhaFicha=s.exists?s.data():null; S.alunosLoaded=true;
      if(!S.minhaFicha && !perguntou){ perguntou=true; let ja=false; try{ ja=!!sessionStorage.getItem("iako-boasvindas"); sessionStorage.setItem("iako-boasvindas","1"); }catch(_){}
        if(!ja) setTimeout(()=>openSheet(`<div class="head"><h2>Bem-vindo!</h2><button class="x" aria-label="Fechar">×</button></div><p>Para agendar remadas, faça seu cadastro e a ficha de saúde. Como você prefere?</p><div class="grid" style="gap:10px"><button class="btn full" id="bvVoz">🎙 Por voz, com leitura em voz alta</button><button class="btn ghost full" id="bvTela">Na tela, passo a passo</button></div><p class="hint">O cadastro por voz é indicado para pessoas cegas ou com baixa visão.</p>`, r=>{ r.querySelector("#bvVoz").addEventListener("click",()=>{ closeSheet(); cadastroPorVoz(); }); r.querySelector("#bvTela").addEventListener("click",()=>{ closeSheet(); editMinhaFicha(); }); }), 600); }
      if(!$("#ov").hidden && S.tab==="perfil") return; render(); }, ()=>{ S.alunosLoaded=true; });
  }
  render();
})();
function montarBarraTeste(){
  const b=document.createElement("div"); b.className="testbar";
  b.innerHTML=`<span><b>Versão de testes.</b> Previsão ao vivo; dados salvos só neste aparelho.</span><label>Ver como <select id="tbPapel"><option value="gestao">Gestão</option><option value="instrutor">Instrutor</option><option value="aluno">Aluno</option></select></label><button class="linkbtn" id="tbLimpa">Apagar dados de teste</button>`;
  document.querySelector("main").prepend(b);
  const sel=b.querySelector("#tbPapel"); sel.value=TESTE.papel;
  sel.addEventListener("change",()=>{ try{ localStorage.setItem(TESTE.RKEY, sel.value); }catch(_){} location.reload(); });
  b.querySelector("#tbLimpa").addEventListener("click",async()=>{ if(!await ask("Apagar todos os dados salvos nesta versão de testes?","Apagar")) return; try{ localStorage.removeItem(TESTE.KEY); }catch(_){} location.reload(); });
}
setInterval(()=>{ try{ updateBadge(); }catch(_){} }, 60000);
function showNoDb(){
  const n=$("#dbnotice"); n.hidden=false;
  n.textContent="Abra este app pelo Claude, conectado à sua conta, para salvar boletins e cadastros.";
  S.boletinsLoaded=true; S.alunosLoaded=true; S.turmasLoaded=true; S.avisosLoaded=true; render();
}
})();
</script>
</body>
</html>
