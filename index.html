/* ---------- maré: enchente ou vazante ---------- */
function faseMare(dia, i, base){
  const s=dia.h && dia.h.sea; if(!s) return null;
  const a=s[Math.max(0,i-1)], b=s[Math.min(23,i+1)]; if(a==null||b==null) return null;
  const d=(b-a)/2;
  let cur=null; if(dia.h.cur && dia.h.cur[i]!=null) cur={kn:dia.h.cur[i]/1.852, dir:dia.h.curdir?dia.h.curdir[i]:null};
  if(Math.abs(d)<0.025) return {cls:"estofo", nome:"Estofo", txt:"Virada da maré, corrente fraca", cur};
  const baia=(base&&B(base).baia)||"baía";
  return d>0 ? {cls:"enchente", nome:"Enchente", txt:`Água entrando na ${baia}`, cur}
             : {cls:"vazante", nome:"Vazante", txt:`Água saindo da ${baia}`, cur};
}
function mareFaixa(dia, i, manual, base){
  const f=faseMare(dia,i,base);
  if(!f) return manual ? `<div class="mareline"><b>Corrente de maré</b><span>${esc(manual)}</span></div>` : `<div class="mareline"><b>Corrente de maré</b><span>Sem dados do modelo. Consulte o SISCORAR antes de sair.</span></div>`;
  const seta = f.cls==="enchente" ? "M12 21 V5 M6 11 l6 -6 6 6" : f.cls==="vazante" ? "M12 3 V19 M6 13 l6 6 6 -6" : "M5 12 H19";
  return `<div class="mareline ${f.cls}"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="${seta}" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>${f.nome}: ${f.txt.toLowerCase()}</b><span>${f.cur&&f.cur.kn>=0.05?`Corrente estimada de ${fmtN(f.cur.kn)} nó${f.cur.kn>=1.5?"s":""}. `:""}Estimativa pelo nível do mar; confirme no SISCORAR.</span></div></div>`;
}

/* ---------- frequência ---------- */
function frequencia(dias){
  const ini=addDays(todaySP(),-dias), hoje=todaySP(), out={};
  const o=id=>out[id]||(out[id]={pres:0,agend:0,tarde:0,ult:""});
  for(const t of Object.values(S.turmas)){
    if(t.data<ini || t.data>hoje || t.status==="cancelada") continue;
    const ck=t.checkin||{};
    for(const k of Object.keys(ck)){ if(!ck[k]) continue; let id=null;
      if(k.startsWith("u_")) id=k.slice(2); else if(k.startsWith("m_")){ const m=(t.manual||{})[k.slice(2)]; id=m&&m.aluno; }
      if(id){ const x=o(id); x.pres++; if(t.data>x.ult) x.ult=t.data; } }
    for(const m of Object.values(t.manual||{})) if(m && m.s==="vou" && m.aluno) o(m.aluno).agend++;
  }
  for(const [uid,d] of Object.entries(S.insc)) for(const [tid,r] of Object.entries((d&&d.r)||{})){ const t=S.turmas[tid]; if(!t||t.data<ini||t.data>hoje) continue; if(r.s==="vou") o(uid).agend++; if(r.tarde) o(uid).tarde++; }
  return out;
}
function ultimaPresenca(){ return frequencia(120); }
function presencasSemana(semanas){
  const out=[]; const hoje=todaySP();
  for(let w=semanas-1; w>=0; w--){ const fim=addDays(hoje,-7*w), ini=addDays(fim,-6); let n={}; LOCAIS.forEach(l=>n[l]=0);
    for(const t of Object.values(S.turmas)){ if(t.data<ini||t.data>fim||t.status==="cancelada") continue; const c=Object.values(t.checkin||{}).filter(Boolean).length; n[t.local]=(n[t.local]||0)+c; }
    out.push({ini, n}); }
  return out;
}

function campoHTML(c, v){

    case "escolha": return `<div class="full qbox">${lab}<div class="opts">${(c.opcoes||[]).map(o=>`<label class="opt"><input type="radio" name="${nm}" value="${esc(o)}" ${v===o?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div></div>`;
    case "multipla": return `<div class="full qbox">${lab}<div class="opts">${(c.opcoes||[]).map(o=>`<label class="opt"><input type="checkbox" name="${nm}" value="${esc(o)}" ${(v||[]).includes(o)?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div></div>`;

  return null;
}

function vagasDe(t){
  if(t.vagas!=null && t.vagas!=="" && !isNaN(+t.vagas)) return +t.vagas;
  const v=(S.config.canoas||[]).filter(c=>c.status!=="manutencao" && (c.local||LOCAIS[0])===t.local).reduce((a,c)=>a+(+c.lugares||0),0);
  return v>0?v:null;
}
const OFERTA_MS = 10*60*1000;
/* fila inteligente: quem entra com a remada cheia vai para a fila por ordem de chegada.
   Quando abre vaga, o primeiro da fila recebe a oferta e tem 10 minutos para confirmar; se não confirmar, passa para o próximo. */
function entradas(t){
  const out=[];
  const saidasExtra=[];
  for(const [uid,doc] of Object.entries(S.insc)){ const r=doc && doc.r && doc.r[t.id]; if(r && !r.s && r.saiu) saidasExtra.push(r.saiu); if(r && r.s) out.push({key:"u_"+uid, uid, s:r.s, t:r.t||"", tj:r.tj||r.t||"", fila:!!r.fila, aceite:r.aceite||"", saiu:r.saiu||""}); }
  for(const [mid,m] of Object.entries(t.manual||{})){ if(m && m.s) out.push({key:"m_"+mid, mid, nome:m.nome, s:m.s, t:m.t||"", tj:m.t||"", manual:true}); }
  const cap=vagasDe(t), now=Date.now();
  const vou=out.filter(e=>e.s==="vou").sort((a,b)=>a.tj.localeCompare(b.tj));
  const firmes=vou.filter(e=>e.manual||!e.fila||e.aceite);
  const pend=vou.filter(e=>!(e.manual||!e.fila||e.aceite));
  if(cap==null) return {cap, conf:vou, espera:[], ofertas:[], expirados:[], livres:Infinity, talvez:out.filter(e=>e.s==="talvez"), nao:out.filter(e=>e.s==="nao")};
  const conf=firmes.slice(0,cap), sobra=firmes.slice(cap);
  let livres=Math.max(0, cap-firmes.length);
  const saidas=out.filter(e=>e.saiu).map(e=>e.saiu).concat(saidasExtra).map(x=>new Date(x).getTime()).sort((a,b)=>a-b);
  const base=saidas.length?saidas[saidas.length-1]:0;
  const slots=Array.from({length:livres},()=>base);
  const ofertas=[], expirados=[], espera=[...sobra];
  for(const e of pend){
    let j=slots.findIndex(x=>x!==null);
    while(j>=0){
      const ini=Math.max(slots[j], new Date(e.tj).getTime()), fim=ini+OFERTA_MS;
      if(now>fim){ e.expirou=fim; expirados.push(e); slots[j]=fim; e._done=true; break; }
      e.oferta=fim; ofertas.push(e); slots[j]=null; e._done=true; break;
    }
    if(!e._done) espera.push(e);
  }
  const livresReais = slots.filter(x=>x!==null).length;
  return {cap, conf, ofertas, espera, expirados, livres:livresReais, talvez:out.filter(e=>e.s==="talvez").sort((a,b)=>a.t.localeCompare(b.t)), nao:out.filter(e=>e.s==="nao")};
}
function nomeDe(e){
  if(e.manual) return e.nome||"Aluno";
  const al=S.alunos&&S.alunos.find(a=>a._id===e.uid); if(al&&al.nome) return al.nome;
  const d=S.insc[e.uid]; if(d && d.apelido) return d.apelido;
  const p=S.names[e.uid]; return (p && p.name) || "Aluno";
}
function meuStatus(t,E){
  if(!S.uid) return null;
  const r=S.insc[S.uid] && S.insc[S.uid].r && S.insc[S.uid].r[t.id]; if(!r) return null;
  if(r.s==="vou"){

    const i=E.espera.findIndex(e=>e.uid===S.uid); if(i>=0) return {s:"espera", pos:i+1+E.ofertas.length};
  }
  return {s:r.s};
}
function conflitoHorario(t){
  if(!S.uid) return null; const meus=(S.insc[S.uid]&&S.insc[S.uid].r)||{};
  const ini=startMs(t), fim=new Date(`${t.data}T${t.fim||t.inicio}:00-03:00`).getTime()||ini+90*60e3;
  return Object.values(S.turmas).find(o=>o.id!==t.id && o.data===t.data && o.status!=="cancelada" && meus[o.id] && meus[o.id].s==="vou" && (()=>{ const a=startMs(o), b=new Date(`${o.data}T${o.fim||o.inicio}:00-03:00`).getTime()||a+90*60e3; return a<fim && ini<b; })())||null;
}
async function rsvp(tid,s,opts){
  opts=opts||{};
  if(!S.uid || S.pending) return;
  if(s==="vou" && alunoBloqueado()){ avisoContato(); return; }
  const t=S.turmas[tid]; if(!t) return;
  if(s==="vou" && !opts.semConflito){
    const c=conflitoHorario(t);
    if(c){ const ok=await ask(`Você já está confirmado na remada das ${c.inicio} ${naBase(c.local)} neste dia. Não é possível remar em duas bases no mesmo horário. Quer trocar para a base ${B(t.local).curto}?`,"Trocar de base"); closeSheet(); if(!ok) return;
      await rsvp(c.id,"nao",{semConflito:true}); }
  }
  const mine=S.insc[S.uid]||{};
  let apelido=mine.apelido||"";
  if(!apelido && !(S.minhaFicha&&S.minhaFicha.nome) && !(S.names[S.uid] && S.names[S.uid].name)){
    const v=await askText("Seu nome na lista","Como você quer aparecer na lista de presença?");
    if(!v || !v.trim()) return; apelido=v.trim().slice(0,60);
  }
  const r=JSON.parse(JSON.stringify(mine.r||{}));

}

const SEG_KEY = ()=>"pvv-seg-"+(S.uid||"anon");

function segSet(o){ try{ localStorage.setItem(SEG_KEY(), JSON.stringify(o)); }catch(_){} }
async function hashSenha(s){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode("pvv:"+(S.uid||"")+":"+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function bioDisponivel(){ try{ return !NA_CLAUDE && !!window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }catch(_){ return false; } }
async function bioCadastrar(){
  const nome=(S.me&&S.me.name)||"Aluno PVV";
  const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)), rp:{name:"Praia Vermelha Va'a"}, user:{id:new TextEncoder().encode((S.uid||"u").slice(0,60)), name:nome, displayName:nome}, pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}], authenticatorSelection:{authenticatorAttachment:"platform", userVerification:"required", residentKey:"preferred"}, timeout:60000}});
  return btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
}
async function bioVerificar(id){ const raw=Uint8Array.from(atob(id),c=>c.charCodeAt(0)); await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)), allowCredentials:[{type:"public-key", id:raw}], userVerification:"required", timeout:60000}}); return true; }

function minhaFoto(){ return (S.role==="aluno"? (S.minhaFicha&&S.minhaFicha.foto) : (S.equipe&&S.equipe[S.uid]&&S.equipe[S.uid].foto)) || ""; }
function avatar(nome, foto, cls){ return foto?`<img class="av ${cls||""}" src="${foto}" alt="">`:`<span class="av ${cls||""}">${esc(initials(nome))}</span>`; }
async function trocarFoto(file){
  const d=await comprimirFotoMax(file, 320, .7);
  if(S.role==="aluno"){ const o=Object.assign({}, S.minhaFicha||{status:"ativo"}); delete o._id; o.foto=d; o.origem="app"; await S.db.doc("alunos/"+S.uid).set(o); S.minhaFicha=o; }
  else if(FB) { await S.db.doc("membros/"+S.uid).update({foto:d}); }
  else { await S.db.doc("equipe/"+S.uid).set(Object.assign({}, (S.equipe||{})[S.uid]||{}, {foto:d})); }
  toast("Foto atualizada"); render();
}
function comprimirFotoMax(file,max,q){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const img=new Image(); img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); const lado=Math.round(Math.min(img.width,img.height)*k); c.width=lado; c.height=lado; const sx=(img.width-Math.min(img.width,img.height))/2, sy=(img.height-Math.min(img.width,img.height))/2; c.getContext("2d").drawImage(img,sx,sy,Math.min(img.width,img.height),Math.min(img.width,img.height),0,0,lado,lado); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",q)); }; img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); }; img.src=url; }); }

function logoPng(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const img=new Image(); img.onload=()=>{ const k=Math.min(1,256/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/png")); }; img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); }; img.src=url; }); }

/* ---------- competição: categorias, elegibilidade e tripulações ---------- */
const CATEG_PROVA = [["EST","Estreante"],["OPEN","Open"],["M40","Master 40"],["M50","Master 50"],["M60","Master 60"],["M70","Master 70"],["PCD","PCD"]];
const CATP = Object.fromEntries(CATEG_PROVA);
const TIPO_CANOA = {F:"Feminina", M:"Masculina", X:"Mista"};
const PCD_TIPOS = {visual:"Deficiência visual", amputacao:"Amputação ou membro", mobilidade:"Mobilidade reduzida", outra:"Outra condição"};
const TERMO_COMP = "Estou ciente de que o clube não arca com despesas de viagem (hospedagem e deslocamento), alimentação e inscrição nas provas.";
function idadeEm(a, ano){ return a && +a.ano ? ano - (+a.ano) : null; }
function ehEstreante(a, ano){ if(!a) return false; if(a.competiu==="nao") return true; if(a.competiu==="sim" && +a.comp_desde) return ano - (+a.comp_desde) < 2; return false; }
function elegivel(a, cat, ano){
  if(!a) return [false,"Sem cadastro de competição"];
  const id=idadeEm(a, ano);
  if(cat==="OPEN") return [true,""];
  if(cat==="EST") return ehEstreante(a,ano)?[true,""]:[false, a.competiu?"Compete há 2 anos ou mais":"Não informou se já competiu"];
  if(cat==="PCD") return a.pcd==="sim"?[true,""]:[false,"Categoria para pessoas com deficiência"];
  const min=+cat.slice(1); if(id==null) return [false,"Ano de nascimento não informado"];
  return id>=min?[true,""]:[false,`Idade ${id}: abaixo de ${min} anos`];
}
function catsDoAtleta(a, ano){ return CATEG_PROVA.map(c=>c[0]).filter(c=>elegivel(a,c,ano)[0]); }
function cadastroCompOk(a){ return !!(a && +a.ano && a.naipe && a.competiu && (a.competiu==="nao"||+a.comp_desde) && a.pcd && a.termo_comp); }

const POR_PAGINA = 6;
function inscritosProva(p){
  const ano=+(p.data||todaySP()).slice(0,4);
  return Object.entries(S.atletas||{}).filter(([u,a])=>a&&a.provas&&a.provas[p._id]&&a.provas[p._id].s==="quero").map(([uid,a])=>({uid, a, nome:nomeAtleta(uid), naipe:a.naipe||"", cat:a.provas[p._id].cat||"", idade:idadeEm(a,ano), est:ehEstreante(a,ano), pcd:a.pcd==="sim"})).sort((x,y)=>x.nome.localeCompare(y.nome,"pt-BR"));

function canoaNova(n){ const fr=(S.config.canoas||[]).filter(c=>c.status!=="manutencao"); return {id:rid(), nome:fr[n-1]?fr[n-1].nome:`Canoa ${n}`, cat:"OPEN", tipo:"X", bancos:[null,null,null,null,null,null]}; }
function tripulacoesDe(p){ const t=p.tripulacoes; if(Array.isArray(t)&&t.length) return JSON.parse(JSON.stringify(t)); return Array.from({length:6},(_,i)=>canoaNova(i+1)); }
function validarBanco(c, idx, pessoa, ano){
  if(!pessoa) return [true,""];
  const [ok,mot]=elegivel(pessoa.a, c.cat, ano); if(!ok) return [false, `${CATP[c.cat]}: ${mot}`];
  if(c.tipo!=="X"){ const exig=c.tipo==="F"?"Feminino":"Masculino"; if(pessoa.naipe!==exig) return [false, pessoa.naipe?`Canoa ${TIPO_CANOA[c.tipo].toLowerCase()}: ${pessoa.naipe.toLowerCase()} não pode`:"Naipe não informado"]; }
  else { if(!pessoa.naipe) return [false,"Naipe não informado"]; const mesmo=c.bancos.filter((b,i)=>b&&i!==idx&&b.naipe===pessoa.naipe).length; if(mesmo>=3) return [false,`Mista: já tem 3 ${pessoa.naipe==="Feminino"?"mulheres":"homens"}`]; }
  if(c.bancos.some((b,i)=>b&&i!==idx&&b.uid===pessoa.uid)) return [false,"Já está nesta canoa"];
  return [true,""];
}

function textoTripulacoes(p, tr){

}

const MESES={janeiro:1,fevereiro:2,"março":3,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
function lerSimNao(t){ t=(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.,!?;:]/g," ").trim();
  if(/\b(nao|no|negativo|nunca|nem|depois)\b/.test(t)) return "nao";
  if(/\b(sim|s|si|sin|tim|yes|yeah|claro|aceito|aceitar|pode|ok|okay|isso|positivo|quero|queria|desejo|vamos|bora|continuar|pronto|confirmo|confirmar|confirma|agendar|agenda|agende|marcar|marca|marque|vou|com certeza|certo|beleza|perfeito)\b/.test(t) || /^agend|^marc|^confirm/.test(t)) return "sim";
  return null; }
function lerData(t){ t=(t||"").toLowerCase(); let m=t.match(/(\d{1,2})\D+(\d{1,2})\D+(\d{4})/); if(m) return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  m=t.match(/(\d{1,2})\s*(?:de\s+)?([a-zç]+)\s*(?:de\s+)?(\d{4})/); if(m && MESES[m[2]]) return `${m[3]}-${String(MESES[m[2]]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;

function lerFone(t){ const d=(t||"").replace(/\D/g,""); return d.length>=10&&d.length<=13 ? d : null; }

  s+=`Chuva no horário: ${fmtN(c.mm)} milímetros${c.prob!=null?`, ${n0(c.prob)} por cento de chance`:""}. `;
  if(ehMar(base) && c.wave!=null) s+=`Ondulação de ${fmtN(c.wave)} metros${c.wper!=null?`, período de ${n0(c.wper)} segundos`:""}${c.mar?`, mar ${c.mar[1].toLowerCase()}`:""}. `;

  if(ev.nivel>=1 && !c.cancelada) s+="Uso de colete salva-vidas recomendado. ";
  s+=`Dica: ${c.look.fala}`;
  return s;
}

  const api={ fechar:()=>{ pararFala(); try{ ouvindo&&ouvindo.abort(); }catch(_){} ov.remove(); },
    falar:async(t,esperar=true)=>{ ultima=t; add("bot",t); await falar(t); if(esperar && Reconhecedor) ouvir(); else inp.focus(); },
    onResposta:f=>{ cb=f; } };
  const env=t=>{ t=(t||"").trim(); if(!t) return; add("eu",t); inp.value=""; cb&&cb(t); };

async function agendaPorVoz(){
  const hoje=todaySP(); const lista=Object.values(S.turmas).filter(t=>(t.data>hoje||(t.data===hoje&&Date.now()<startMs(t))) && !substituida(t)).sort((a,b)=>(a.data+a.inicio).localeCompare(b.data+b.inicio));

  const pode = S.role!=="aluno" || podeAgendar(fichaStatus(S.minhaFicha));
  const perguntaDe=t=>{ const E=entradas(t), me=meuStatus(t,E); const jan=janela(t);
    if(t.status==="cancelada") return ["prox","Diga próxima para continuar."];
    if(Date.now()>=jan.fecha) return ["prox","O agendamento desta remada já encerrou. Diga próxima."];
    if(jan.abre && Date.now()<jan.abre) return ["prox","O agendamento ainda não abriu. Diga próxima."];

    if(alunoBloqueado()) return ["prox","Para agendar aulas, entre em contato com o responsável do clube. Diga próxima."];
    if(me&&me.s==="oferta") return ["oferta","Quer ficar com a vaga? Diga sim ou não."];
    if(me&&(me.s==="vou"||me.s==="espera")) return ["cancelar","Quer manter? Diga manter, ou diga cancelar meu agendamento, ou próxima."];
    const cheio=E.cap!=null&&(E.livres<=0||E.ofertas.length+E.espera.length>0);
    return ["agendar", cheio?"A remada está cheia. Quer entrar na fila de espera? Diga sim, não ou próxima.":"Deseja agendar? Diga sim, não ou próxima."]; };
  const ler=async()=>{ if(i>=lista.length){ await ch.falar("Fim da agenda. Para sair, toque em fechar.", false); modo="fim"; return; } const t=lista[i]; const [m,p]=perguntaDe(t); modo=m; await ch.falar(`${i+1} de ${lista.length}. ${textoTurma(lista[i])} ${p}`); };

    if(modo==="oferta"){ if(sn==="sim"){ await aceitarVaga(t.id); await ch.falar("Vaga confirmada.",false); } else if(sn==="nao"){ await rsvp(t.id,"nao"); await ch.falar("Certo, a vaga vai para o próximo da fila.",false); } await prox(); return; }
    if(modo==="cancelar"){ if(/cancel/.test(low)){ await rsvp(t.id,"nao"); await ch.falar("Seu agendamento foi cancelado.",false); } else await ch.falar("Mantido.",false); await prox(); return; }
    if(modo==="agendar"){ if(sn==="sim"){ const c=conflitoHorario(t); if(c){ S._conf=c; modo="conflito"; await ch.falar(`Você já está na remada das ${hFala(c.inicio)} ${naBase(c.local)} no mesmo horário. Quer trocar para esta? Diga sim ou não.`); return; } await rsvp(t.id,"vou",{semConflito:true}); const me=meuStatus(S.turmas[t.id],entradas(S.turmas[t.id])); await ch.falar(me&&me.s==="espera"?`Você entrou na fila, posição ${me.pos}.`:"Agendado! Você está confirmado.",false); await prox(); }
      else if(sn==="nao"){ await prox(); } else await ch.falar("Não entendi. Diga sim, não ou próxima."); return; }
  });
  if(S.role==="aluno" && !S.minhaFicha){ await ch.falar("Você ainda não tem ficha de saúde, que é obrigatória para agendar. Toque em fechar e escolha Cadastro por voz no seu perfil. Mesmo assim, vou ler a agenda.", false); }
  if(!lista.length){ await ch.falar("Não há remadas abertas no momento.", false); modo="fim"; return; }

}

    await limpezaAntigos();

  _syncando=false;
}

    ${vs.length?`<div style="margin-top:8px">${vs.map(v=>`<div class="grade-row"><div><b>${esc(v.nome)}</b><div class="hint" style="margin:0">${new Date(v.criado).toLocaleString("pt-BR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}, ${v.tripulacoes.reduce((s,c)=>s+c.bancos.filter(Boolean).length,0)} atletas em ${v.tripulacoes.length} canoas</div></div><span class="spacer"></span><button class="btn ghost small" data-vrest="${esc(v.id)}">Restaurar</button><button class="ib" data-vdel="${esc(v.id)}" aria-label="Excluir versão ${esc(v.nome)}">🗑</button></div>`).join("")}</div>`
      :`<p class="hint" style="margin:6px 0 0">Salve versões para comparar formações e voltar a uma montagem anterior. As alterações nas canoas são salvas automaticamente.</p>`}</div>`;
}
function bindVersoes(el,pid){
  const b=el.querySelector("#tripVer"); if(b) b.addEventListener("click",()=>salvarVersaoTrip(pid));
  el.querySelectorAll("[data-vrest]").forEach(x=>x.addEventListener("click",async()=>{ const p=S.provas[pid], v=(p.versoes||[]).find(z=>z.id===x.dataset.vrest); if(!v) return; if(!await ask(`Restaurar a versão “${v.nome}”? A montagem atual será substituída. Salve uma versão antes, se quiser guardá-la.`,"Restaurar")) return; closeSheet(); try{ await S.db.doc("provas/"+pid).update({tripulacoes:v.tripulacoes}); S.provas[pid].tripulacoes=v.tripulacoes; toast("Versão restaurada"); render(); }catch(e){ failWrite(e); } }));
  el.querySelectorAll("[data-vdel]").forEach(x=>x.addEventListener("click",async()=>{ if(!await ask("Excluir esta versão salva?","Excluir")) return; closeSheet(); const vs=(S.provas[pid].versoes||[]).filter(z=>z.id!==x.dataset.vdel); try{ await S.db.doc("provas/"+pid).update({versoes:vs}); S.provas[pid].versoes=vs; render(); }catch(e){ failWrite(e); } }));
}

/* ---------- EVENTOS: viagens, excursões e passeios ---------- */
const TIPOS_EV = {passeio:"Passeio", viagem:"Viagem", excursao:"Excursão", evento:"Evento", outro:"Outro"};
const MODELOS_REMADA = {revezamento:"Revezamento", continuo:"Contínuo (sem troca)", livre:"Livre"};
function evDias(e){ if(!e.data_inicio) return 0; const a=new Date(e.data_inicio+"T12:00"), b=new Date((e.data_fim||e.data_inicio)+"T12:00"); return Math.round((b-a)/864e5)+1; }
function evJanela(e){ const h=todaySP(); if(e.abre && h<e.abre) return "antes"; if(e.prazo && h>e.prazo) return "encerrado"; return "aberto"; }
function respEv(id){ const out={vou:[],talvez:[],nao:[]}; for(const [uid,doc] of Object.entries(S.insc||{})){ const r=doc&&doc.r&&doc.r["ev:"+id]; if(r&&r.s&&out[r.s]) out[r.s].push({uid, nome:nomeAtletaOuAluno(uid), t:r.t||""}); } Object.values(out).forEach(l=>l.sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"))); return out; }
function nomeAtletaOuAluno(uid){ const al=(S.alunos||[]).find(a=>a._id===uid); if(al&&al.nome) return al.nome; const d=S.insc[uid]; if(d&&d.apelido) return d.apelido; const p=S.names[uid]; return (p&&p.name)||"Aluno"; }
function meuEv(id){ const r=S.uid&&S.insc[S.uid]&&S.insc[S.uid].r&&S.insc[S.uid].r["ev:"+id]; return r&&r.s||""; }
async function rsvpEvento(id,s){
  if(!S.uid||S.pending) return; const e=S.eventos[id]; if(!e) return;
  if(evJanela(e)!=="aberto"){ toast(evJanela(e)==="antes"?`Confirmações abrem em ${dataCurta(e.abre)}`:"O prazo de confirmação terminou"); return; }
  if(s==="vou" && alunoBloqueado()){ avisoContato(); return; }
  const mine=S.insc[S.uid]||{}; const r=JSON.parse(JSON.stringify(mine.r||{})); const cur=r["ev:"+id];
  const nv = cur && cur.s===s ? "" : s;
  r["ev:"+id]={s:nv, t:new Date().toISOString()};
  const body=Object.assign({}, mine, {r});
  S.pending=true;
  try{ await S.db.doc("inscricoes/"+S.uid).set(body); S.insc[S.uid]=body; toast(nv==="vou"?"Presença confirmada no evento":nv==="talvez"?"Marcado como talvez":nv==="nao"?"Você avisou que não vai":"Marcação desfeita"); }
  catch(x){ failWrite(x); } finally{ S.pending=false; render(); refreshSheet(); }
}
function renderEventos(){
  const el=$("#eventosBody");
  if(S.evView && S.canAgenda && S.eventos[S.evView]){ renderCanoasEvento(el, S.evView); return; }
  const hoje=todaySP();
  const lista=Object.values(S.eventos||{}).sort((a,b)=>(a.data_inicio||"").localeCompare(b.data_inicio||""));
  const prox=lista.filter(e=>(e.data_fim||e.data_inicio||"")>=hoje), pass=lista.filter(e=>(e.data_fim||e.data_inicio||"")<hoje).reverse();
  const card=e=>{ const r=respEv(e._id), me=meuEv(e._id), jan=evJanela(e), d=evDias(e);
    return `<article class="turma evcard">
      <button class="t-main" data-evopen="${esc(e._id)}" aria-label="${esc(`${TIPOS_EV[e.tipo]||"Evento"}: ${e.titulo}, ${e.local||""}, ${dataFala(e.data_inicio)}${d>1?`, ${d} dias`:""}. ${r.vou.length} confirmados.`)}">
        <div class="t-time evdate"><span>${esc(new Date(e.data_inicio+"T12:00").toLocaleDateString("pt-BR",{day:"numeric"}))}</span><small>${esc(new Date(e.data_inicio+"T12:00").toLocaleDateString("pt-BR",{month:"short"}).replace(".",""))}</small></div>
        <div><div class="t-title">${esc(e.titulo)}</div><div class="t-sub">${esc(TIPOS_EV[e.tipo]||"Evento")}${e.local?", "+esc(e.local):""}${d>1?`, ${d} dias`:""}</div>
          <div class="chips">${jan==="aberto"?`<span class="b grn">Confirmações até ${esc(dataCurta(e.prazo||e.data_inicio))}</span>`:jan==="antes"?`<span class="b">Confirmações abrem ${esc(dataCurta(e.abre))}</span>`:`<span class="b">Confirmações encerradas</span>`}${e.transporte?`<span class="b">${esc(e.transporte)}</span>`:""}</div>
          <div class="vagas" style="margin-top:8px">${e.vagas?`<div><b>${e.vagas}</b><span>vagas</span></div>`:""}<div><b>${r.vou.length}</b><span>vão</span></div><div><b>${r.talvez.length}</b><span>talvez</span></div>${e.vagas?`<div class="${e.vagas-r.vou.length>0?"ok":"zero"}"><b>${Math.max(0,e.vagas-r.vou.length)}</b><span>disponíveis</span></div>`:""}</div></div>
        <span aria-hidden="true" style="color:var(--muted);font-size:24px;line-height:1">›</span></button>
      ${me?`<div class="mine">${{vou:"Você confirmou presença",talvez:"Você marcou talvez",nao:"Você avisou que não vai"}[me]}</div>`:""}
      ${S.canAgenda?`<div class="staffrow"><button class="ib" data-evedit="${esc(e._id)}" aria-label="Editar evento">✏️</button><button class="ib lixo" data-evdel="${esc(e._id)}" aria-label="Excluir evento">🗑</button><button class="btn small" data-evcan="${esc(e._id)}">Montar canoas</button></div>`:""}
      ${S.uid&&S.role!=="agencia"&&jan==="aberto"?`<div class="rsvp" data-ev="${esc(e._id)}">${[["vou","Vou"],["talvez","Talvez"],["nao","Não vou"]].map(([k,l])=>`<button class="${k}" data-evs="${k}" aria-pressed="${me===k}" title="${me===k?"Toque de novo para desmarcar":""}">${l}</button>`).join("")}</div>`:""}
    </article>`; };
  let html=`<div class="ag-head"><div><h2>Eventos</h2><p class="hint">Passeios, viagens e excursões do clube.</p></div><span class="spacer"></span>${S.canAgenda?`<button class="btn small" id="evNovo">Novo evento</button>`:""}</div>`;
  html+= prox.length ? prox.map(card).join("") : `<div class="empty">Nenhum evento programado.${S.canAgenda?" Toque em Novo evento para criar um passeio, viagem ou excursão.":""}</div>`;
  if(pass.length) html+=`<details class="panel"><summary><b>Eventos anteriores (${pass.length})</b></summary>${pass.slice(0,10).map(card).join("")}</details>`;
  el.innerHTML=html;
  const nv=el.querySelector("#evNovo"); if(nv) nv.addEventListener("click",()=>editEvento());
  el.querySelectorAll("[data-evopen]").forEach(b=>b.addEventListener("click",()=>verEvento(b.dataset.evopen)));
  el.querySelectorAll("[data-evedit]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); editEvento(b.dataset.evedit); }));
  el.querySelectorAll("[data-evdel]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); excluirEvento(b.dataset.evdel); }));
  el.querySelectorAll("[data-evcan]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); empilhar(); S.evView=b.dataset.evcan; renderEventos(); window.scrollTo(0,0); }));
  el.querySelectorAll(".rsvp[data-ev]").forEach(r=>r.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>rsvpEvento(r.dataset.ev,b.dataset.evs))));
}
function verEvento(id){
  const e=S.eventos[id]; if(!e) return; const r=respEv(id), d=evDias(e), me=meuEv(id), jan=evJanela(e);
  const lista=(t,l)=>l.length?`<h3 style="margin:14px 0 6px">${t} (${l.length})</h3><p style="margin:0">${l.map(x=>esc(x.nome)).join(", ")}</p>`:"";
  openSheet(`<div class="head"><div><h2>${esc(e.titulo)}</h2><div class="hint" style="margin:0">${esc(TIPOS_EV[e.tipo]||"Evento")}${e.local?", "+esc(e.local):""}</div></div><button class="x" aria-label="Fechar">×</button></div>
    <dl class="kv"><dt>Data</dt><dd>${esc(dataCurta(e.data_inicio))}${e.data_fim&&e.data_fim!==e.data_inicio?` a ${esc(dataCurta(e.data_fim))}`:""}${d>1?` (${d} dias)`:""}</dd>
      ${e.encontro?`<dt>Encontro</dt><dd>${esc(e.encontro)}${e.hora?`, ${esc(e.hora)}`:""}</dd>`:""}
      ${e.transporte?`<dt>Transporte</dt><dd>${esc(e.transporte)}</dd>`:""}
      ${e.hospedagem?`<dt>Hospedagem</dt><dd>${esc(e.hospedagem)}</dd>`:""}
      ${e.custo?`<dt>Custo</dt><dd>${esc(e.custo)}</dd>`:""}
      <dt>Confirmação</dt><dd>${e.abre?`de ${esc(dataCurta(e.abre))} `:""}até ${esc(dataCurta(e.prazo||e.data_inicio))}${jan==="encerrado"?" (encerrada)":""}</dd></dl>
    ${e.descricao?`<p style="white-space:pre-wrap">${esc(e.descricao)}</p>`:""}
    ${(e.roteiro||[]).length?`<h3 style="margin:14px 0 6px">Roteiro</h3><ol class="roteiro">${e.roteiro.map(x=>`<li><b>${esc(x.titulo||"Dia "+x.dia)}</b>${x.data?` <span class="hint">${esc(dataCurta(x.data))}</span>`:""}<div>${x.horario?esc(x.horario)+", ":""}${x.de?`de ${esc(x.de)}`:""}${x.ate?` até ${esc(x.ate)}`:""}${x.km?`, ${esc(x.km)} km`:""}${x.modelo?`, ${esc(MODELOS_REMADA[x.modelo]||x.modelo)}`:""}</div>${x.obs?`<small>${esc(x.obs)}</small>`:""}</li>`).join("")}</ol>`:""}
    <div class="stats" style="margin-top:12px"><div><div class="n">${r.vou.length}</div><div class="l">vão</div></div><div><div class="n">${r.talvez.length}</div><div class="l">talvez</div></div><div><div class="n">${r.nao.length}</div><div class="l">não vão</div></div></div>
    ${S.canAgenda?lista("Vão",r.vou)+lista("Talvez",r.talvez)+lista("Não vão",r.nao):""}
    ${S.uid&&S.role!=="agencia"&&jan==="aberto"?`<div class="rsvp" style="margin-top:14px;border-radius:12px;overflow:hidden" data-ev="${esc(id)}">${[["vou","Vou"],["talvez","Talvez"],["nao","Não vou"]].map(([k,l])=>`<button class="${k}" data-evs="${k}" aria-pressed="${me===k}">${l}</button>`).join("")}</div>`:""}
    <div class="row" style="margin-top:14px;gap:8px">${S.canAgenda?`<button class="btn ghost small" id="evWa">Enviar no WhatsApp</button><button class="btn ghost small" id="evEd">Editar</button><button class="btn small" id="evCn">Montar canoas</button>`:""}${botaoTraduzir(e.titulo+"\n"+(e.descricao||""))}</div>`, root=>{
    root.querySelectorAll(".rsvp[data-ev] button").forEach(b=>b.addEventListener("click",()=>rsvpEvento(id,b.dataset.evs)));
    const w=root.querySelector("#evWa"); if(w) w.addEventListener("click",()=>compartilharWhats("viagem", textoEvento(e)));
    const ed=root.querySelector("#evEd"); if(ed) ed.addEventListener("click",()=>editEvento(id));
    const cn=root.querySelector("#evCn"); if(cn) cn.addEventListener("click",()=>{ closeSheet(); S.evView=id; if(S.tab!=="eventos") setTab("eventos"); S.evView=id; renderEventos(); });
  });
}
function textoEvento(e){
  let s=`*${(TIPOS_EV[e.tipo]||"Evento").toUpperCase()}: ${e.titulo}*\n${dataCurta(e.data_inicio)}${e.data_fim&&e.data_fim!==e.data_inicio?` a ${dataCurta(e.data_fim)}`:""}${e.local?`, ${e.local}`:""}\n`;
  if(e.encontro) s+=`Encontro: ${e.encontro}${e.hora?`, ${e.hora}`:""}\n`; if(e.transporte) s+=`Transporte: ${e.transporte}\n`; if(e.hospedagem) s+=`Hospedagem: ${e.hospedagem}\n`; if(e.custo) s+=`Custo: ${e.custo}\n`;
  if((e.roteiro||[]).length) s+=`\n*Roteiro*\n`+e.roteiro.map(x=>`• ${x.titulo||"Dia "+x.dia}: ${x.de?`${x.de}`:""}${x.ate?` → ${x.ate}`:""}${x.km?`, ${x.km} km`:""}${x.modelo?`, ${MODELOS_REMADA[x.modelo]||x.modelo}`:""}${x.horario?` (${x.horario})`:""}`).join("\n")+"\n";
  s+=`\nConfirme até ${dataCurta(e.prazo||e.data_inicio)} no app, aba Eventos.`; return s;
}
function editEvento(id){
  const e=id?JSON.parse(JSON.stringify(S.eventos[id])):{tipo:"passeio", titulo:"", local:"", data_inicio:addDays(todaySP(),14), data_fim:"", abre:todaySP(), prazo:addDays(todaySP(),10), roteiro:[]};
  const linhaRot=(x,i)=>`<div class="rot campo"><div class="row" style="gap:6px"><b class="cn">${i+1}</b><input data-r="titulo" value="${esc(x.titulo||"")}" placeholder="Ex.: 1º dia, remada" style="flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px"><button type="button" class="ib" data-rrm aria-label="Remover etapa">🗑</button></div>
    <div class="grid" style="margin-top:6px"><label class="f">Data<input type="date" data-r="data" value="${esc(x.data||"")}"></label><label class="f">Horário<input data-r="horario" value="${esc(x.horario||"")}" placeholder="07:00"></label>

    <label class="f full">Observações<input data-r="obs" value="${esc(x.obs||"")}" placeholder="Ex.: almoço no restaurante X"></label></div></div>`;
  openSheet(`<div class="head"><h2>${id?"Editar evento":"Novo evento"}</h2><button class="x" aria-label="Fechar">×</button></div>
    <form id="fev"><div class="grid">
      <label class="f">Tipo<select name="tipo">${Object.entries(TIPOS_EV).map(([k,l])=>`<option value="${k}" ${e.tipo===k?"selected":""}>${l}</option>`).join("")}</select></label>

      <label class="f full">Título<input name="titulo" required value="${esc(e.titulo)}" placeholder="Ex.: Travessia Ilha Grande"></label>
      <label class="f full">Local<input name="local" value="${esc(e.local||"")}" placeholder="Ex.: Angra dos Reis, RJ"></label>

      <label class="f">Fim (se mais de um dia)<input type="date" name="data_fim" value="${esc(e.data_fim||"")}"></label>
      <label class="f">Confirmação abre<input type="date" name="abre" value="${esc(e.abre||"")}"></label>
      <label class="f">Prazo para confirmar<input type="date" name="prazo" value="${esc(e.prazo||"")}"></label>
      <label class="f">Ponto de encontro<input name="encontro" value="${esc(e.encontro||"")}"></label>
      <label class="f">Horário de encontro<input name="hora" value="${esc(e.hora||"")}" placeholder="05:30"></label>
      <label class="f full">Transporte<input name="transporte" value="${esc(e.transporte||"")}" placeholder="Ex.: van saindo da sede, carona, ônibus"></label>
      <label class="f full">Hospedagem<input name="hospedagem" value="${esc(e.hospedagem||"")}" placeholder="Onde o clube fechou a hospedagem"></label>
      <label class="f full">Custo por pessoa<input name="custo" value="${esc(e.custo||"")}" placeholder="Ex.: R$ 350, inclui transporte e hospedagem"></label>

      const nid=id||("ev"+Date.now().toString(36)+rid());
      try{ await S.db.doc("eventos/"+nid).set(o); auditar(id?"Evento editado":"Evento criado",o.titulo);
        if(!id){ await S.db.doc("avisos/ev_"+nid).set({tipo:o.tipo==="viagem"?"viagem":"passeio", titulo:`${TIPOS_EV[o.tipo]}: ${o.titulo}`, texto:`${dataCurta(o.data_inicio)}${o.local?", "+o.local:""}. Confirme até ${dataCurta(o.prazo||o.data_inicio)} na aba Eventos.`, data_evento:o.data_inicio, local:"", link:"", expira:o.data_fim||o.data_inicio, fixado:false, criado:new Date().toISOString()}); }
        toast(id?"Evento salvo":"Evento criado"); if(!id) compartilharWhats("viagem", textoEvento(o)); else closeSheet();
      }catch(x){ failWrite(x); } });

async function pdfTabela(titulo, cols, linhas){

  d.setFont("helvetica","bold"); d.setFontSize(14); d.text(sem(MARCA.nome),10,12); d.setFontSize(11); d.text(sem(titulo),10,19); d.setFont("helvetica","normal"); d.setFontSize(8); d.text(sem(new Date().toLocaleString("pt-BR")),10,24);
  const cw=(W-10)/cols.length; let y=32; d.setFontSize(9); d.setFont("helvetica","bold"); cols.forEach((c,i)=>d.text(sem(c),10+i*cw,y)); d.setFont("helvetica","normal"); y+=5;

function remadasDoMes(uid, ym){
  const r=(S.insc[uid]&&S.insc[uid].r)||{}, hoje=todaySP(), out=[];
  Object.entries(r).forEach(([k,x])=>{ if(k.startsWith("ev:")||!x) return; const t=S.turmas[k]||{id:k, data:k.slice(0,10), local:k.split("_")[1]||"", inicio:"", status:""}; if(t.data.slice(0,7)!==ym) return;
    const firme = x.s==="vou" && (!x.fila||x.aceite), passou = t.data<hoje || (t.data===hoje && Date.now()>startMs(t));
    let est = t.status==="cancelada" ? (x.s==="vou"?"cancelada":"") : !firme ? "" : !passou ? "agendado" : x.treino ? "feito" : "pendente";
    if(est) out.push({t,x,est}); });
  return out.sort((a,b)=>(a.t.data+a.t.inicio).localeCompare(b.t.data+b.t.inicio));
}

const FIN_EST = {emdia:["Em dia","grn"], vence7:["Vence em até 7 dias","amb"], vence30:["Vence em até 30 dias","amb"], atrasado:["Atrasado","red"], semreg:["Sem pagamento registrado","red"], semplano:["Sem plano","" ]};
function finEstado(a){ const h=todaySP(); if(!a.pago_ate) return "semreg"; const d=Math.round((new Date(a.pago_ate+"T12:00")-new Date(h+"T12:00"))/864e5); if(d<0) return "atrasado"; if(d<=7) return "vence7"; if(d<=30) return "vence30"; return "emdia"; }

function revisarSituacoes(lista, depois){
  openSheet(`<div class="head"><h2>Revisar situações</h2><button class="x" aria-label="Fechar">×</button></div>
    <p class="hint">Sugestão pelo pagamento: atrasado vira <b>Suspenso</b>; mais de 6 meses sem pagar vira <b>Inativo</b>; em dia vira <b>Ativo</b>. Desmarque quem não deve mudar. Os alunos não recebem aviso.</p>
    <form id="fsug"><div class="list">${lista.map(a=>`<label class="item" style="cursor:pointer"><input type="checkbox" name="s" value="${esc(a._id)}" checked style="width:20px;height:20px;flex:none"><span style="flex:1;min-width:0"><span class="nm">${esc(a.nome)}</span><span class="sub"> ${a.pago_ate?`pago até ${esc(dataCurta(a.pago_ate))}`:"sem registro"}</span><span class="badges"><span class="b ${STATUS_COR[statusAluno(a)]}">${STATUS[statusAluno(a)]}</span> → <span class="b ${STATUS_COR[sugestaoStatus(a)]}">${STATUS[sugestaoStatus(a)]}</span></span></span></label>`).join("")}</div>
    <div class="row" style="margin-top:14px"><span class="spacer"></span><button type="button" class="btn ghost" id="cSug">Cancelar</button><button class="btn">Aplicar</button></div></form>`, root=>{
    root.querySelector("#cSug").addEventListener("click",closeSheet);
    root.querySelector("#fsug").addEventListener("submit",async ev=>{ ev.preventDefault(); const ids=new FormData(ev.target).getAll("s"); let n=0;
      for(const id of ids){ const a=S.alunos.find(x=>x._id===id); const s=sugestaoStatus(a); if(!s) continue; try{ await S.db.doc("alunos/"+id).update({status:s}); auditar("Situação alterada",`${a.nome}: ${STATUS[statusAluno(a)]} → ${STATUS[s]} (sugestão do financeiro)`); n++; }catch(e){ failWrite(e); } }
      closeSheet(); toast(`${n} ${n===1?"situação atualizada":"situações atualizadas"}`); if(depois) setTimeout(depois,400); });
  });
}

function editDespesa(id){

  openSheet(`<div class="head"><h2>${id?"Editar despesa":"Lançar despesa"}</h2><button class="x" aria-label="Fechar">×</button></div>
    <form id="fdsp"><div class="grid"><label class="f full">Descrição<input name="descricao" required value="${esc(d.descricao)}" placeholder="Ex.: Reparo do ama da Iemanjá"></label>
      <label class="f">Valor (R$)<input name="valor" inputmode="decimal" required value="${esc(d.valor)}"></label>
      <label class="f">Data<input type="date" name="data" required value="${esc(d.data)}"></label>
      <label class="f full">Categoria<select name="categoria">${Object.entries(CAT_DESP).map(([k,n])=>`<option value="${k}" ${d.categoria===k?"selected":""}>${n}</option>`).join("")}</select></label></div>
      <div class="row" style="margin-top:14px"><span class="spacer"></span><button type="button" class="btn ghost" id="cDsp">Cancelar</button><button class="btn">Salvar</button></div></form>`, root=>{
    root.querySelector("#cDsp").addEventListener("click",closeSheet);
    root.querySelector("#fdsp").addEventListener("submit",async ev=>{ ev.preventDefault(); const f=new FormData(ev.target); const v=num(String(f.get("valor")).replace(/\./g,"").replace(",","."));

      try{ await S.db.doc("despesas/"+(id||("d"+Date.now().toString(36)+rid()))).set(o); auditar(id?"Despesa editada":"Despesa lançada",`${o.descricao}: ${brl(v)}`); closeSheet(); toast("Despesa salva"); }catch(e){ failWrite(e); } });
  });
}

/* ---------- Painel social (dashboard com filtros cruzados) ---------- */
function eixoNum(v){ return v>=1000?(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":String(Math.round(v)); }
function maxBonito(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); return Math.ceil(v/p*2)/2*p; }
const FAIXAS_FREQ=[["zero","Não remou",0,0,"#C0392B"],["baixa","1 a 3 remadas",1,3,"#F2B33D"],["media","4 a 7 remadas",4,7,"#5BA8D0"],["alta","8 ou mais",8,999,"#0B3A5B"]];
function renderPainelX(el){
  const hoje=todaySP(), F=S.sd||(S.sd={dias:30, sit:["ativo"], base:"", faixa:null, sem:null, busca:""});
  const desde=addDays(hoje,-F.dias+1);
  const alunos=S.alunos.filter(a=>F.sit.includes(statusAluno(a)));
  const feitas=a=>minhasRemadasFeitas(a._id,desde).filter(o=>!F.base||o.t.local===F.base);
  const dados=alunos.map(a=>{ const f=feitas(a); const ult=minhasRemadasFeitas(a._id,"2000-01-01")[0]; return {a,n:f.length,km:f.reduce((s,o)=>s+(+((o.x.treino||{}).km)||0),0),ult:ult?ult.t.data:"",f}; });
  const faixaDe=n=>FAIXAS_FREQ.find(x=>n>=x[2]&&n<=x[3])[0];
  const semanas=[...Array(Math.max(4,Math.round(F.dias/7)))].map((_,i,arr)=>{ const fim=addDays(hoje,-(arr.length-1-i)*7), ini=addDays(fim,-6); return {ini,fim}; });
  const dadosF=dados.filter(d=>(!F.faixa||faixaDe(d.n)===F.faixa) && (!F.busca||(d.a.nome||"").toLowerCase().includes(F.busca.toLowerCase())));
  const pres=dadosF.reduce((s,d)=>s+d.f.filter(o=>!F.sem||(o.t.data>=F.sem.ini&&o.t.data<=F.sem.fim)).length,0);
  const ativosN=dadosF.filter(d=>d.n>0).length, media=dadosF.length?pres/dadosF.length:0;
  const resgatar=dadosF.filter(d=>pagoEmDia(d.a)!==false && (!d.ult||d.ult<addDays(hoje,-21)));
  const novos=alunos.filter(a=>(a.inicio||"")>=desde).length;
  const kmTot=dadosF.reduce((s,d)=>s+d.km,0);
  // colunas por semana empilhadas por base
  const porSem=semanas.map(w=>{ const o={}; LOCAIS.forEach(l=>o[l]=0); dadosF.forEach(d=>d.f.forEach(x=>{ if(x.t.data>=w.ini&&x.t.data<=w.fim&&o[x.t.local]!=null) o[x.t.local]++; })); return Object.assign(w,{o,tot:LOCAIS.reduce((s,l)=>s+o[l],0)}); });
  const maxS=maxBonito(Math.max(1,...porSem.map(w=>w.tot)));
  const CORB=["#0B3A5B","#F2BE7A","#5BA8D0","#7A4FD0"];
  const colSem=`<div class="cols" style="height:210px">${porSem.map(w=>{ const sel=F.sem&&F.sem.ini===w.ini; return `<button class="colb ${F.sem&&!sel?"dim":""}" data-fsem="${w.ini}" aria-label="Semana de ${dataCurta(w.ini)}: ${w.tot} presenças"><em>${w.tot||""}</em><span class="cbar" style="flex-direction:column-reverse">${LOCAIS.map((l,k)=>`<i style="height:${w.o[l]/maxS*100}%;background:${CORB[k%4]};border-radius:0"></i>`).join("")}</span><b>${new Date(w.ini+"T12:00").toLocaleDateString("pt-BR",{day:"numeric",month:"numeric"})}</b></button>`; }).join("")}</div>
    <div class="legend">${LOCAIS.map((l,k)=>`<span><i style="background:${CORB[k%4]}"></i>${esc(B(l).curto)}</span>`).join("")}</div>`;
  // rosca de faixas de frequência
  const cont=FAIXAS_FREQ.map(f=>[f,dados.filter(d=>faixaDe(d.n)===f[0]).length]); const tot=Math.max(1,cont.reduce((s,x)=>s+x[1],0)); let ang=-Math.PI/2;
  const arco=(a0,a1)=>{ const p=(a,r)=>[110+r*Math.cos(a),110+r*Math.sin(a)]; const lg=a1-a0>Math.PI?1:0; const [x0,y0]=p(a0,100),[x1,y1]=p(a1,100),[x2,y2]=p(a1,62),[x3,y3]=p(a0,62); return `M${x0} ${y0} A100 100 0 ${lg} 1 ${x1} ${y1} L${x2} ${y2} A62 62 0 ${lg} 0 ${x3} ${y3}Z`; };
  const fat=cont.filter(x=>x[1]).map(([f,n])=>{ const a1=ang+2*Math.PI*n/tot-(n===tot?0.0001:0); const d=arco(ang,a1); ang=a1; return `<path d="${d}" fill="${f[4]}" class="fat ${F.faixa&&F.faixa!==f[0]?"dim":""}" data-ffx="${f[0]}" tabindex="0" role="button" aria-label="${f[1]}: ${n}"/>`; }).join("");
  const engaj=dados.length?Math.round(dados.filter(d=>d.n>=4).length/dados.length*100):0;
  const rosca=`<div class="rosca"><svg viewBox="0 0 220 220" class="graf" style="max-width:220px">${fat||'<circle cx="110" cy="110" r="81" fill="none" stroke="var(--line)" stroke-width="38"/>'}<text x="110" y="104" text-anchor="middle" class="rc1">${engaj}%</text><text x="110" y="124" text-anchor="middle" class="rc2">remam 4+ vezes</text></svg>
    <div class="rleg">${cont.map(([f,n])=>`<button class="rli ${F.faixa===f[0]?"on":""}" data-ffx="${f[0]}"><i style="background:${f[4]}"></i><span>${f[1]}</span><b>${n}</b></button>`).join("")}</div></div>`;
  // barras por base
  const porBase=LOCAIS.map((l,k)=>({l,k,v:dados.reduce((s,d)=>s+minhasRemadasFeitas(d.a._id,desde).filter(o=>o.t.local===l).length,0)})); const maxB=Math.max(1,...porBase.map(x=>x.v));
  const bases=`<div class="catbars">${porBase.map(x=>`<button class="cb ${F.base&&F.base!==x.l?"dim":""}" data-fbase="${esc(x.l)}"><span>${esc(B(x.l).nome)}</span><span class="cbt"><i style="width:${x.v/maxB*100}%;background:${CORB[x.k%4]}"></i></span><b>${x.v}</b></button>`).join("")}</div>`;
  // ranking
  const rk=dadosF.slice().sort((x,y)=>y.n-x.n||y.km-x.km);
  const fone=a=>(a.telefone||"").replace(/\D/g,"");

/* ---------- vagas sempre pela frota disponível ---------- */
function capFrota(local){ const l=(S.config.canoas||[]).filter(c=>c.status!=="manutencao" && (c.local||LOCAIS[0])===local); return l.length?l.reduce((s,c)=>s+(+c.lugares||0),0):null; }
function vagasDe(t){ const fr=capFrota(t.local); const lim=(t.vagas!=null&&t.vagas!==""&&!isNaN(+t.vagas))?+t.vagas:null; if(fr==null) return lim; return lim!=null?Math.min(fr,lim):fr; }

/* ---------- frota: editor em tabela ---------- */
function editarFrota(){
  let linhas=(S.config.canoas||[]).map(c=>({nome:c.nome||"", local:c.local||LOCAIS[0], tipo:MODELOS_CANOA[c.tipo]?c.tipo:"OC6", castelo:!!c.castelo, status:c.status==="manutencao"?"indisponivel":"disponivel"}));
  for(let i=linhas.length;i<7;i++) linhas.push({nome:`Canoa ${i+1}`, local:LOCAIS[0], tipo:"OC6", castelo:false, status:"disponivel"});
  openSheet(`<div class="head"><div><h2>Frota do clube</h2><div class="hint" style="margin:0">As vagas de cada remada vêm das canoas disponíveis da base.</div></div><button class="x" aria-label="Fechar">×</button></div>

    const soma=()=>{ ler(); root.querySelector("#frSoma").innerHTML=`<b>Vagas por base:</b> `+LOCAIS.map(b=>{ const ls=linhas.filter(l=>l.nome&&l.local===b&&l.status==="disponivel"); return `${esc(B(b).curto)} <b>${ls.reduce((s,l)=>s+lugaresModelo(l.tipo,l.castelo),0)}</b> (${ls.length} ${ls.length===1?"canoa":"canoas"})`; }).join(" · "); };
    const desenha=()=>{ box.innerHTML=linhas.map((l,i)=>`<div class="frl ${l.status!=="disponivel"?"off":""}">
      <span class="frn">${i+1}</span>

      <select data-k="local" aria-label="Base">${LOCAIS.map(b=>`<option value="${esc(b)}" ${l.local===b?"selected":""}>${esc(B(b).curto)}</option>`).join("")}</select>
      <span class="frmod"><select data-k="tipo" aria-label="Modelo">${Object.keys(MODELOS_CANOA).map(m=>`<option ${l.tipo===m?"selected":""}>${m}</option>`).join("")}</select><label class="frcast ${l.tipo==="OC6"?"":"oculto"}" title="OC6 com castelo leva 7"><input type="checkbox" data-k="castelo" ${l.castelo?"checked":""}> castelo</label></span>
      <span class="frlug">${lugaresModelo(l.tipo,l.castelo)}</span>
      <select data-k="status" class="frst" aria-label="Situação"><option value="disponivel" ${l.status==="disponivel"?"selected":""}>Disponível</option><option value="indisponivel" ${l.status!=="disponivel"?"selected":""}>Indisponível</option></select>
      <button type="button" class="ib" data-frm="${i}" aria-label="Remover canoa ${i+1}">🗑</button></div>`).join("");
      box.querySelectorAll("[data-frm]").forEach(b=>b.addEventListener("click",()=>{ ler(); linhas.splice(+b.dataset.frm,1); desenha(); }));
      box.querySelectorAll("input,select").forEach(x=>x.addEventListener("change",()=>{ ler(); box.querySelectorAll(".frl").forEach((el,i)=>{ const l=linhas[i]; el.querySelector(".frcast").classList.toggle("oculto",l.tipo!=="OC6"); el.querySelector(".frlug").textContent=lugaresModelo(l.tipo,l.castelo); el.classList.toggle("off",l.status!=="disponivel"); }); soma(); })); soma(); };
    desenha();

      if(await saveConfig({canoas})){ auditar("Frota atualizada",`${canoas.length} canoas`); closeSheet(); toast("Frota salva"); } });
  });
}

/* ---------- nome da canoa a partir da frota ---------- */
function selCanoaFrota(attr, atual, usados, localPref){

}

    <div class="row" style="margin-top:16px"><span class="spacer"></span><button type="button" class="btn ghost" id="cP">Cancelar</button><button class="btn" type="submit">${id?"Salvar":"Publicar"}</button></div></form>`, root=>{
    const prev=root.querySelector("#pPrev"), rm=root.querySelector("#pImgRm");
    root.querySelector("#pImg").addEventListener("change",async e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; prev.innerHTML=`<span class="hint">Preparando…</span>`; try{ img=await comprimirFoto(f); prev.innerHTML=`<img src="${img}" alt="">`; rm.hidden=false; }catch(_){ prev.innerHTML=`<span class="hint">Não foi possível ler a imagem</span>`; } });
    rm.addEventListener("click",()=>{ img=""; prev.innerHTML=`<span class="hint">Sem imagem</span>`; rm.hidden=true; });
    root.querySelector("#cP").addEventListener("click",closeSheet);
    root.querySelector("#fpost").addEventListener("submit",async ev=>{ ev.preventDefault(); const f=new FormData(ev.target), g=k=>(f.get(k)||"").toString().trim();
      const o={tipo, titulo:g("titulo"), texto:g("texto"), link:g("link"), rede:tipo==="social"?(g("rede")||"instagram"):"site", cta:g("cta"), fim:g("fim"), fixado:!!f.get("fixado"), rascunho:!!f.get("rascunho"), publicar_em:g("publicar_em")||todaySP(), imagem:img, criado:p.criado||new Date().toISOString(), atualizado:new Date().toISOString(), por:S.uid||""};
      if(tipo==="social" && !linkOk(o.link)){ toast("Cole o link do post"); return; }
      const pid=id||("m"+Date.now().toString(36)+rid());
      try{ await S.db.doc("midia/"+pid).set(o); auditar(id?"Publicação editada":"Publicação criada",o.titulo||TIPOS_POST[tipo][0]);
        const publico = !o.rascunho && o.publicar_em<=todaySP();
        if(publico && !(S.avisos||{})["midia_"+pid]){ await S.db.doc("avisos/midia_"+pid).set({tipo:"midia", titulo:o.titulo||`Novo post no ${REDES[o.rede]?REDES[o.rede][0]:"clube"}`, texto:(o.texto||"").slice(0,240)+"\nVeja na aba Mídia.", data_evento:o.tipo==="campanha"&&o.fim?o.fim:"", hora:"", local:"", link:o.link, expira:o.tipo==="campanha"&&o.fim?o.fim:"", fixado:false, criado:new Date().toISOString()}); }
        if(!id && publico){ toast("Publicado"); compartilharWhats("midia",`*${(o.titulo||TIPOS_POST[tipo][0]).toUpperCase()}*\n${o.texto||""}${linkOk(o.link)?`\n${o.link}`:""}`); }
        else { closeSheet(); toast(o.rascunho?"Rascunho salvo":o.publicar_em>todaySP()?`Agendado para ${dataCurta(o.publicar_em)}`:"Publicação salva"); }
      }catch(e){ failWrite(e); } });
  });
}

/* ---------- render ---------- */
function render(){
  if(S.tab==="mural"){ marcarLido(); }
  updateBadge();
  barraVerComo();
  { const inat = S.role==="aluno" && statusAluno(S.minhaFicha)==="inativo"; document.querySelectorAll('nav [data-tab="mar"]').forEach(b=>b.classList.toggle("oculto",inat)); }
  { const com = S.role==="agencia"; ["agenda","competicao"].forEach(t=>document.querySelectorAll(`nav [data-tab="${t}"]`).forEach(b=>b.classList.toggle("oculto",com)));
    if(com && (S.tab==="agenda"||S.tab==="competicao")){ setTab("mural"); return; } }
  ({agenda:renderAgenda, mar:renderMar, mural:renderMural, midia:renderMidia, competicao:renderCompeticao, eventos:renderEventos, clube:renderSobre, perfil:renderPerfil, alunos:renderAlunos, operacao:renderClube})[S.tab]();
}

/* ---------- capabilities ---------- */
function computeRole(){
  const p=S.config.papeis||{};
  if(FB){ const pp=FB.papel(); S.role = ["gestao","instrutor","agencia"].includes(pp) ? pp : (S.uid ? "aluno" : "visitante"); }
  else S.role = S.isOwner ? "gestao" : S.platAdmin ? ({gestao:"gestao",agencia:"agencia"}[p[S.uid]]||"instrutor") : (S.uid ? "aluno" : "visitante");
  S.papelReal = S.role; let vc=null; try{ vc=sessionStorage.getItem("iako-vercomo"); }catch(_){}
  if(S.papelReal==="gestao" && ["instrutor","agencia","aluno"].includes(vc)) S.role=vc;
  S.canEdit = S.role==="gestao"; S.canAgenda = S.canEdit || S.role==="instrutor"; S.canMidia = S.canEdit || S.role==="agencia"; S.canAviso = S.canAgenda || S.canMidia;
  const nome = S.me && S.me.name ? S.me.name.split(" ")[0] : "";
  $("#who").textContent = nome ? `${nome} (${{gestao:"administrador",instrutor:"instrutor",agencia:"comunicação",aluno:"aluno",visitante:"visitante"}[S.role]})` : "";
  document.querySelectorAll('[data-tab="perfil"] .lbl').forEach(l=>l.textContent = (S.canAgenda) ? "Gestão" : "Perfil");
  const inat = S.role==="aluno" && statusAluno(S.minhaFicha)==="inativo";
  document.querySelectorAll('nav [data-tab="mar"]').forEach(b=>b.classList.toggle("oculto",inat));
}

$("#btnVoltar").addEventListener("click", ()=>history.back());
setTimeout(()=>{ window.__navOk=true; try{ history.replaceState({iako:0},"",location.hash); }catch(_){} }, 300);
if(!NA_CLAUDE && "serviceWorker" in navigator && location.protocol==="https:"){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
(async function boot(){
  if(FB){ await FB.entrar(); } else if(!NA_CLAUDE) montarBarraTeste();
  const [db, user] = await Promise.all([CL.use("db"), CL.use("user")]);
  S.db = db; S.user = user;
  if(user){
    try{ S.platAdmin = await user.canEdit(); }catch(_){}
    try{ S.isOwner = await user.isOwner(); }catch(_){}
    try{ S.uid = await user.id(); }catch(_){}
    try{ S.canWrite = await user.can("data.write"); }catch(_){}
    try{ S.me = await user.me(); }catch(_){}
  }
  S.ownerIds = S.isOwner && S.uid ? [S.uid] : [];
  computeRole();
  bloqueioInicial();
  if(!db){ showNoDb(); return; }
  db.doc("config/clube").onSnapshot(s=>{ S.configClube = s.exists ? s.data() : null; juntarConfig(); S.configLoaded=true; computeRole(); if(S.tab!=="alunos") render(); else updateBadge(); }, ()=>{});
  db.doc("config/agenda").onSnapshot(s=>{ S.configAgenda = s.exists ? s.data() : null; juntarConfig(); _syncEm=0; juntarConfigSync(); if(["agenda","operacao"].includes(S.tab)) render(); }, ()=>{});
  db.collection("boletins").orderBy("data","desc").limit(30).onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{const x=d.data(); if(x&&x.data) m[x.data]=x;}); S.boletins=m; S.boletinsLoaded=true; if(S.tab==="mar") renderMar(); else if(S.tab==="agenda") renderAgenda(); }, ()=>{ S.boletinsLoaded=true; renderMar(); });
  db.collection("previsoes").where("data",">=",addDays(todaySP(),-2)).orderBy("data","asc").limit(30).onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ const x=d.data(); if(x&&x.data) m[x.data]=x; }); S.previsoes=m; S.previsaoConectada=s.docs.length>0; if(S.tab==="mar") renderMar(); else if(S.tab==="agenda") renderAgenda(); }, ()=>{});
  const desde = addDays(todaySP(), -120);
  db.collection("turmas").where("data",">=",desde).orderBy("data","asc").limit(1000).onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{const x=d.data(); if(x) m[d.id]=Object.assign({id:d.id},x);}); S.turmas=m; S.turmasLoaded=true; juntarConfigSync(); S.turmasLoaded=true; if(S.tab==="agenda") renderAgenda(); else if(S.tab==="competicao") renderCompeticao(); else if(S.tab==="mar") renderMar(); refreshSheet(); }, ()=>{ S.turmasLoaded=true; renderAgenda(); });
  db.collection("inscricoes").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=d.data()||{}; }); S.insc=m; resolveNames(); if(S.tab==="agenda") renderAgenda(); else if(S.tab==="competicao") renderCompeticao(); refreshSheet(); }, ()=>{});
  db.collection("avisos").orderBy("criado","desc").limit(150).onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=Object.assign({_id:d.id}, d.data()); }); S.avisos=m; S.avisosLoaded=true; registrarNovidades("avisos", Object.keys(m), id=>{ const a=m[id]; if(!a||(a.expira&&a.expira<todaySP())) return ""; return a.tipo==="cancelamento"?`Alerta: ${a.titulo}`:a.tipo==="agenda"?`Agenda: ${a.titulo}`:`Novo comunicado: ${a.titulo}`; }); if(S.tab==="mural"){ marcarLido(); renderMural(); } else if(S.tab==="agenda") renderAgenda(); else if(S.tab==="mar") renderMar(); updateBadge(); }, ()=>{ S.avisosLoaded=true; });
  db.collection("forms").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=Object.assign({_id:d.id}, d.data()); }); S.forms=m; updateBadge(); if(["midia","perfil"].includes(S.tab)) render(); }, ()=>{});
  db.collection("midia").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=Object.assign({_id:d.id}, d.data()); }); S.midia=m; registrarNovidades("midia", Object.keys(m), id=>`Nova publicação na Mídia: ${m[id].titulo}`); updateBadge(); if(S.tab==="midia") renderMidia(); }, ()=>{});
  if(S.platAdmin) db.collection("formresp").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=d.data()||{}; }); S.formresp=m; S.minhasResp=S.uid?(m[S.uid]||null):null; if(["midia","perfil"].includes(S.tab)) render(); }, ()=>{});
  else if(S.uid) db.doc("formresp/"+S.uid).onSnapshot(s=>{ S.minhasResp=s.exists?s.data():null; updateBadge(); if(["midia","perfil"].includes(S.tab)) render(); }, ()=>{});
  db.collection("eventos").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=Object.assign({_id:d.id}, d.data()); }); S.eventos=m; registrarNovidades("eventos", Object.keys(m), id=>`Novo evento: ${m[id].titulo}`); if(S.tab==="eventos") renderEventos(); }, ()=>{});
  db.collection("provas").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=Object.assign({_id:d.id}, d.data()); }); S.provas=m; registrarNovidades("provas", Object.keys(m), id=>{ const pv=m[id]; const pcd=(pv.categorias||[]).includes("PCD")&&S.atletaMe&&S.atletaMe.pcd==="sim"; return pcd?`Nova prova com categoria PCD: ${pv.nome}`:`Nova prova no calendário: ${pv.nome}`; }); if(S.tab==="competicao") renderCompeticao(); }, ()=>{});
  if(S.platAdmin){
    db.collection("atletas").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=d.data()||{}; }); S.atletas=m; S.atletaMe=S.uid?(m[S.uid]||null):null; resolveNames(); if(S.tab==="competicao") renderCompeticao(); }, ()=>{});
    db.collection("alunos").onSnapshot(s=>{ S.alunos = s.docs.map(d=>Object.assign({_id:d.id}, d.data())); S.alunosLoaded=true; S.minhaFicha = S.uid ? (S.alunos.find(a=>a._id===S.uid)||null) : null; updateBadge(); if(S.tab==="alunos") renderAlunos(); else if(["competicao","perfil"].includes(S.tab)) render(); }, ()=>{ S.alunosLoaded=true; renderAlunos(); });
    db.collection("despesas").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=Object.assign({_id:d.id}, d.data()); }); S.despesas=m; if(S.tab==="perfil"&&S.gsub==="painelfin") renderPerfil(); }, ()=>{});
    if(FB) db.collection("convitelinks").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=d.data()||{}; }); S.convLinks=m; if(S.tab==="operacao") renderClube(); }, ()=>{});
    if(FB) db.collection("convites").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=d.data()||{}; }); S.convites=m; if(S.tab==="operacao") renderClube(); }, ()=>{});
    db.collection(FB?"membros":"equipe").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=d.data()||{}; }); S.equipe=m; resolveNames(); if(S.tab==="clube") renderClube(); }, ()=>{});
    if(S.uid && !FB){ try{ const me=await db.doc("equipe/"+S.uid).get(); if(!me.exists) await db.doc("equipe/"+S.uid).set({desde:new Date().toISOString()}); }catch(_){} }
  } else if(S.uid){
    db.doc("atletas/"+S.uid).onSnapshot(s=>{ S.atletaMe=s.exists?s.data():null; if(S.tab==="competicao"||S.tab==="agenda") render(); }, ()=>{});
    let perguntou=false;
    db.doc("alunos/"+S.uid).onSnapshot(s=>{ S.minhaFicha=s.exists?s.data():null; S.alunosLoaded=true;
      if(!S.minhaFicha && !perguntou){ perguntou=true; let ja=false; try{ ja=!!sessionStorage.getItem("iako-boasvindas"); sessionStorage.setItem("iako-boasvindas","1"); }catch(_){}
        if(!ja) setTimeout(()=>openSheet(`<div class="head"><h2>Bem-vindo!</h2><button class="x" aria-label="Fechar">×</button></div><p>Para agendar remadas, faça seu cadastro e a ficha de saúde. Como você prefere?</p><div class="grid" style="gap:10px"><button class="btn full" id="bvVoz">🎙 Por voz, com leitura em voz alta</button><button class="btn ghost full" id="bvTela">Na tela, passo a passo</button></div><p class="hint">O cadastro por voz é indicado para pessoas cegas ou com baixa visão.</p>`, r=>{ r.querySelector("#bvVoz").addEventListener("click",()=>{ closeSheet(); cadastroPorVoz(); }); r.querySelector("#bvTela").addEventListener("click",()=>{ closeSheet(); editMinhaFicha(); }); }), 600); }
      if(!$("#ov").hidden && S.tab==="perfil") return; render(); }, ()=>{ S.alunosLoaded=true; });
  }
  render();
})();
function montarBarraTeste(){
  const b=document.createElement("div"); b.className="testbar";
  b.innerHTML=`<span><b>Versão de testes.</b> Previsão ao vivo; dados salvos só neste aparelho.</span><label>Ver como <select id="tbPapel"><option value="gestao">Gestão</option><option value="instrutor">Instrutor</option><option value="aluno">Aluno</option></select></label><button class="linkbtn" id="tbLimpa">Apagar dados de teste</button>`;
  document.querySelector("main").prepend(b);
  const sel=b.querySelector("#tbPapel"); sel.value=TESTE.papel;
  sel.addEventListener("change",()=>{ try{ localStorage.setItem(TESTE.RKEY, sel.value); }catch(_){} location.reload(); });
  b.querySelector("#tbLimpa").addEventListener("click",async()=>{ if(!await ask("Apagar todos os dados salvos nesta versão de testes?","Apagar")) return; try{ localStorage.removeItem(TESTE.KEY); }catch(_){} location.reload(); });
}
setInterval(()=>{ try{ updateBadge(); }catch(_){} }, 60000);
function showNoDb(){
  const n=$("#dbnotice"); n.hidden=false;
  n.textContent="Abra este app pelo Claude, conectado à sua conta, para salvar boletins e cadastros.";
  S.boletinsLoaded=true; S.alunosLoaded=true; S.turmasLoaded=true; S.avisosLoaded=true; render();
}
