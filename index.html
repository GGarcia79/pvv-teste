<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Praia Vermelha Va’a Clube</title>
<meta name="theme-color" content="#F04A12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F2; --surface:#FFFFFF; --surface-2:#F4F8F9; --ink:#10293A; --muted:#5B7282; --line:#D3DEE3;
  --ocean:#1C6C86; --ocean-soft:#D8EAF0; --brand:#F04A12; --brand-2:#FB6713;
  --ok:#2C8A57; --ok-soft:#DDF1E5; --warn:#B9800F; --warn-soft:#FBEFD2; --stop:#C0392B; --stop-soft:#F8DEDA;
  --shadow:0 1px 0 var(--line);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1A24; --surface:#122634; --surface-2:#0F202C; --ink:#E4EDF1; --muted:#93A9B6; --line:#24404F;
    --ocean:#5FB3CF; --ocean-soft:#16384A; --brand:#FF6A2E; --brand-2:#FF7F3A;
    --ok:#5CC48A; --ok-soft:#173A29; --warn:#E5B54A; --warn-soft:#3A3016; --stop:#F07463; --stop-soft:#43201C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1A24; --surface:#122634; --surface-2:#0F202C; --ink:#E4EDF1; --muted:#93A9B6; --line:#24404F;
  --ocean:#5FB3CF; --ocean-soft:#16384A; --brand:#FF6A2E; --brand-2:#FF7F3A;
  --ok:#5CC48A; --ok-soft:#173A29; --warn:#E5B54A; --warn-soft:#3A3016; --stop:#F07463; --stop-soft:#43201C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#F23F0C}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ocean)}
:focus-visible{outline:2px solid var(--ocean);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(100deg,#F23F0C 0%,#FA5A10 55%,#FC6A14 100%);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.top-in{max-width:960px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;flex:none;display:block;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.top h1{margin:0;font-size:23px;font-weight:700;line-height:1;color:#fff;white-space:nowrap}
.top-in>div{flex:none}
.top small{display:block;color:rgba(255,255,255,.85);font-size:13px;margin-top:3px}
.top .who{margin-left:auto;font-size:13px;color:rgba(255,255,255,.9);text-align:right;white-space:nowrap}
@media (max-width:1100px){.top .who{display:none}}
@media (max-width:520px){.top h1{font-size:21px}}
nav.tabs{display:none}

main{max-width:960px;margin:0 auto;padding:18px}
.view[hidden]{display:none}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:flex}
nav.bottom button{flex:1;min-width:0;position:relative;background:none;border:0;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:500;cursor:pointer}
nav.bottom button svg{width:23px;height:23px}
.dotn{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
nav.tabs button{position:relative}
nav.tabs .dotn{top:-4px;left:auto;right:-4px;background:#fff;color:#F04A12}
nav.bottom button[aria-current="page"]{color:var(--ocean)}
@media (min-width:760px){
  body{padding-bottom:24px}
  nav.bottom{display:none}
  nav.tabs{display:flex;gap:2px;margin-left:auto}
  nav.tabs button{background:none;border:0;padding:8px 11px;border-radius:8px;color:rgba(255,255,255,.88);font-weight:600;cursor:pointer}
  nav.tabs button:hover{background:rgba(255,255,255,.14)}
  nav.tabs button[aria-current="page"]{background:#fff;color:#E2400C}
  header.top :focus-visible{outline-color:#fff}
}

/* ---------- Mar ---------- */
.daybar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.daybar h2{margin:0;font-size:26px;font-weight:700;line-height:1.1}
.daybar .place{color:var(--muted);font-size:15px}
.daybar input[type=date]{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}

.verdict{border-radius:14px;padding:18px 20px 16px;position:relative;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.verdict.l0{background:var(--ok-soft);border-color:transparent}
.verdict.l1{background:var(--warn-soft);border-color:transparent}
.verdict.l2{background:var(--stop-soft);border-color:transparent}
.verdict .word{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-size:clamp(40px,11vw,64px);line-height:.95;margin:0}
.verdict.l0 .word{color:var(--ok)} .verdict.l1 .word{color:var(--warn)} .verdict.l2 .word{color:var(--stop)}
.verdict .why{margin:10px 0 0;padding:0;list-style:none;font-size:15px}
.verdict .why li{padding:2px 0}
.verdict .src{font-size:13px;color:var(--muted);margin-top:10px}
.verdict svg.wave{position:absolute;right:-10px;bottom:-6px;width:200px;opacity:.18;pointer-events:none}

.gauges{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
@media (min-width:640px){.gauges{grid-template-columns:repeat(4,1fr)}}
.g{background:var(--surface);padding:14px 16px}
.g .k{font-size:14px;color:var(--muted)}
.g .v{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:600;font-size:38px;line-height:1.05}
.g .v small{font-size:18px;font-weight:500;color:var(--muted);margin-left:2px}
.g .d{font-size:14px;color:var(--muted)}
.g.flag-1 .v{color:var(--warn)} .g.flag-2 .v{color:var(--stop)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
.panel h3{margin:0 0 8px;font-size:20px;font-weight:600}
.tides{display:flex;gap:8px;flex-wrap:wrap}
.tide{background:var(--surface-2);border-radius:10px;padding:8px 12px;min-width:110px}
.tide .t{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:24px;font-weight:600;line-height:1}
.tide .h{font-size:14px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--ocean-soft);text-decoration:none;font-weight:600;font-size:15px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.hist li:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.dot.l0{background:var(--ok)} .dot.l1{background:var(--warn)} .dot.l2{background:var(--stop)}
.hist .meta{color:var(--muted);font-size:14px;margin-left:auto;text-align:right}
.empty{padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.empty p{margin:0 0 12px}

/* ---------- buttons/forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--ocean);color:#fff}
:root .btn{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06141C}}
:root[data-theme="dark"] .btn{color:#06141C}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--stop);border:1px solid var(--stop)}
.btn.small{padding:7px 12px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,18,26,.45);display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.overlay{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sheet h2{margin:0;font-size:26px;font-weight:700}
.sheet .head{display:flex;align-items:center;gap:10px;margin-bottom:6px;position:sticky;top:-18px;background:var(--surface);padding:6px 0;z-index:1}
.sheet .x{margin-left:auto;background:var(--surface-2);border:0;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1}
fieldset{border:0;margin:14px 0 0;padding:0}
legend{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:19px;font-weight:600;padding:0;margin-bottom:6px;color:var(--ocean)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
label.f input,label.f select,label.f textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);font-size:16px;width:100%}
label.f textarea{min-height:64px;resize:vertical}
label.chk{display:flex;align-items:center;gap:8px;font-size:15px}
label.chk input{width:20px;height:20px;accent-color:var(--ocean)}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.tiderow{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-bottom:8px}

/* ---------- Alunos ---------- */
.stats{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.stats div{flex:1;background:var(--surface);padding:10px 14px}
.stats .n{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:30px;font-weight:600;line-height:1}
.stats .l{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tools input{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tools select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.av{width:40px;height:40px;border-radius:50%;background:var(--ocean-soft);color:var(--ocean);display:grid;place-items:center;font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-size:18px;flex:none}
.item .nm{font-weight:600}
.item .sub{font-size:14px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.b{font-size:12.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--surface-2);color:var(--muted)}
.b.red{background:var(--stop-soft);color:var(--stop)}
.b.amb{background:var(--warn-soft);color:var(--warn)}
.b.grn{background:var(--ok-soft);color:var(--ok)}

.health{border-left:4px solid var(--stop);background:var(--stop-soft);border-radius:8px;padding:10px 12px;margin-top:10px}
.health.none{border-color:var(--ok);background:var(--ok-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.call{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:10px;margin-top:8px;text-decoration:none;color:var(--ink)}
.call strong{display:block}
.call span{font-size:14px;color:var(--muted)}
.call .ph{margin-left:auto;color:var(--ocean);font-weight:600}
.section{margin-top:16px}
.section h3{font-size:19px;margin:0 0 6px;color:var(--ocean);font-weight:600}

.locked{padding:30px 20px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.locked h3{margin:0 0 6px;font-size:22px}
.locked p{margin:0;color:var(--muted)}

/* ---------- Clube ---------- */
.capacity{display:flex;align-items:baseline;gap:10px}
.capacity .n{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:56px;font-weight:700;line-height:1;color:var(--ocean)}
.canoe{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.canoe:first-of-type{border-top:0}
.canoe .nm{font-weight:600}
.canoe .sub{font-size:14px;color:var(--muted)}
.limits{width:100%;border-collapse:collapse;font-size:15px}
.limits th,.limits td{text-align:left;padding:7px 6px;border-top:1px solid var(--line)}
.limits th{color:var(--muted);font-weight:500;font-size:14px;border-top:0}
.limits input{width:80px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.scroll-x{overflow-x:auto}

/* ---------- Agenda ---------- */
.ag-head{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ag-head h2{margin:0;font-size:26px;font-weight:700;line-height:1.1}
.ag-head .hint{margin:0}
.dayhdr{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:21px;font-weight:600;margin:22px 0 8px;display:flex;align-items:baseline;gap:8px}
.dayhdr span{font-family:"Barlow",system-ui,sans-serif;font-size:14px;font-weight:400;color:var(--muted)}
.turma{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.turma.off{opacity:.72}
.t-main{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:14px 16px 12px;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.t-time{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:34px;font-weight:700;line-height:.95;color:var(--ocean)}
.t-time small{display:block;font-size:15px;font-weight:500;color:var(--muted);margin-top:3px}
.t-title{font-weight:600;font-size:17px;line-height:1.25}
.t-sub{font-size:14px;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cap{margin-top:8px}
.cap .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.cap .bar i{display:block;height:100%;background:var(--ocean)}
.cap .bar i.full{background:var(--brand)}
.cap .txt{font-size:14px;color:var(--muted);margin-top:4px}
.cap .txt b{color:var(--ink);font-weight:600}
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.rsvp button{background:none;border:0;border-left:1px solid var(--line);padding:12px 4px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer}
.rsvp button:first-child{border-left:0}
.rsvp button[aria-pressed="true"]{background:var(--ocean-soft);color:var(--ocean)}
.rsvp button.vou[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok)}
.rsvp button.nao[aria-pressed="true"]{background:var(--stop-soft);color:var(--stop)}
.rsvp button:disabled{cursor:default}
.mine{font-size:14px;font-weight:600;padding:8px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.mine.esp{color:var(--warn)}
.people{list-style:none;margin:0;padding:0}
.people li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.people li:first-child{border-top:0}
.people .av{width:32px;height:32px;font-size:14px}
.people .pos{font-family:"Barlow Condensed",system-ui,sans-serif;color:var(--muted);width:22px;text-align:right;flex:none}
.people .tag{font-size:12.5px;color:var(--muted)}
.ck{margin-left:auto;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 10px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.ck[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.rm{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px}
.grade-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.grade-row:first-of-type{border-top:0}

/* ---------- Mural ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin:10px 0 8px}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.aviso{--kc:var(--muted);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--kc);border-radius:12px;padding:13px 16px 14px;margin-bottom:10px}
.aviso.k-cancelamento{--kc:var(--stop)} .aviso.k-competicao{--kc:var(--ocean)} .aviso.k-passeio{--kc:var(--ok)} .aviso.k-evento{--kc:var(--brand)} .aviso.k-viagem{--kc:var(--warn)}
.aviso .tp{font-size:14px;font-weight:600;color:var(--kc)}
.aviso .when{font-size:13px;color:var(--muted)}
.aviso h3{margin:2px 0 2px;font-size:22px;font-weight:600;line-height:1.15}
.aviso .qd{font-size:15px;font-weight:500;color:var(--ink);margin-bottom:4px}
.aviso .tx{white-space:pre-wrap;margin:4px 0 0;max-width:68ch}
.aviso .tx.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{background:none;border:0;padding:4px 0;color:var(--ocean);font-weight:600;cursor:pointer}
a.btn{text-decoration:none}
/* ---------- Competição ---------- */
.hero{display:block;width:100%;text-align:left;border:0;cursor:pointer;background:var(--ocean-soft);color:var(--ink);border-radius:14px;padding:16px 18px;margin-top:12px}
.hero .hk{font-size:14px;color:var(--ocean);font-weight:600}
.hero .hn{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-size:clamp(40px,11vw,60px);line-height:.95;color:var(--ocean);margin:2px 0 6px}
.hero .ht{font-weight:600;font-size:18px}
.hero .hs{font-size:15px;color:var(--muted)}
.hero .hs.warn{color:var(--warn);font-weight:600}
.catline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.catbig{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:34px;font-weight:700;color:var(--ocean);line-height:1}
.subday{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:18px;font-weight:600;margin:12px 0 6px;display:flex;gap:8px;align-items:baseline}
.subday span{font-family:"Barlow",system-ui,sans-serif;font-size:14px;font-weight:400;color:var(--muted)}
.datebox{width:48px;flex:none;text-align:center;border-radius:10px;background:var(--ocean-soft);color:var(--ocean);font-size:13px;padding:4px 0;line-height:1.1}
.datebox b{display:block;font-family:"Barlow Condensed",system-ui,sans-serif;font-size:24px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}

/* ---------- Mar v2 ---------- */
.bcards{display:grid;gap:12px}
@media (min-width:760px){.bcards{grid-template-columns:1fr 1fr}}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bhead{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 12px;background:var(--surface-2)}
.bcard.l0 .bhead{background:var(--ok-soft)} .bcard.l1 .bhead{background:var(--warn-soft)} .bcard.l2 .bhead{background:var(--stop-soft)}
.bname{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:22px;font-weight:700;line-height:1.1}
.bsub{font-size:14px;color:var(--muted)}
.bword{margin-left:auto;font-family:"Barlow Condensed",system-ui,sans-serif;font-size:30px;font-weight:700;line-height:1}
.bcard.l0 .bword{color:var(--ok)} .bcard.l1 .bword{color:var(--warn)} .bcard.l2 .bword{color:var(--stop)}
.bm{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bm>div{background:var(--surface);padding:10px 14px}
.bm .k{font-size:13px;color:var(--muted)} .bm .v{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:32px;font-weight:600;line-height:1.05}
.bm .v small{font-size:16px;color:var(--muted);margin-left:2px;font-weight:500} .bm .d{font-size:13px;color:var(--muted)}
.bm .flag-1 .v{color:var(--warn)} .bm .flag-2 .v{color:var(--stop)}
.bfbox{padding:10px 14px 4px}
.bft-t{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-size:14px;margin-bottom:6px}
.bft-t span{color:var(--muted)}
.c0{color:var(--ok)} .c1{color:var(--warn)} .c2{color:var(--stop)}
.bft{display:grid;grid-template-columns:repeat(13,1fr);gap:2px}
.bft span{font-size:11px;text-align:center;padding:3px 0;border-radius:3px;color:var(--muted)}
.bft .s0{background:var(--ok-soft)} .bft .s1{background:var(--warn-soft)} .bft .s2{background:var(--stop-soft)}
.bft span.on{color:#fff;font-weight:700;box-shadow:0 0 0 2px var(--ink)}
.bft .s0.on{background:var(--ok)} .bft .s1.on{background:var(--warn)} .bft .s2.on{background:var(--stop)}
.bxtra{padding:8px 14px 0;font-size:14px;display:grid;gap:4px}
.bxtra .k{color:var(--muted)}
.bcard .why{list-style:none;margin:0;padding:8px 14px 14px;font-size:14px}
.bcard .why li{padding:2px 0}
.hb{display:inline-flex;align-items:center;gap:5px;margin-left:10px}
details.panel summary{cursor:pointer}
.limits select{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.basefs{border-top:1px solid var(--line);padding-top:10px}
/* ---------- Ficha ---------- */
.fstat{border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px;margin-top:6px}
.fstat span{color:var(--muted)}
.fstat.s-ok{background:var(--ok-soft)} .fstat.s-ok b{color:var(--ok)}
.fstat.s-vence{background:var(--warn-soft)} .fstat.s-vence b{color:var(--warn)}
.fstat.s-incompleta,.fstat.s-vencida,.fstat.s-liberacao{background:var(--stop-soft)}
.fstat.s-incompleta b,.fstat.s-vencida b,.fstat.s-liberacao b{color:var(--stop)}
.yn{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.ynq{font-size:15px;line-height:1.35}
.ynq .hint{display:block}
.ynb{display:flex;flex:none;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ynb label{cursor:pointer}
.ynb input{position:absolute;opacity:0;pointer-events:none}
.ynb span{display:block;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.ynb label+label span{border-left:1px solid var(--line)}
.ynb input:checked+span{background:var(--ocean);color:#fff}
.ynb input:focus-visible+span{outline:2px solid var(--ocean);outline-offset:-2px}
label.yt textarea{min-height:44px}
.termo{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.errbox{background:var(--stop-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:8px}
.errbox ul{margin:4px 0 0;padding-left:18px}
.linkbtn{background:none;border:0;padding:0;color:var(--ocean);font-weight:700;text-decoration:underline;cursor:pointer;font-size:inherit}
.daypick{display:flex;flex-wrap:wrap;gap:6px}
.daypick label{cursor:pointer}
.daypick input{position:absolute;opacity:0;pointer-events:none}
.daypick span{display:block;min-width:44px;text-align:center;padding:8px 6px;border:1px solid var(--line);border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);background:var(--surface-2)}
.daypick input:checked+span{background:var(--ocean);border-color:var(--ocean);color:#fff}
.daypick input:focus-visible+span{outline:2px solid var(--ocean);outline-offset:2px}

.stats>div{min-width:0;padding:10px 10px} .stats .l{font-size:12.5px;overflow-wrap:anywhere}
/* ---------- Mar cards animados ---------- */
.daypick-l{margin-left:auto;display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);gap:2px}
.daypick-l input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:16px}
.wxs{display:grid;gap:14px}
@media (min-width:900px){.wxs{grid-template-columns:1fr 1fr}}
.wx{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--line);border-radius:18px;overflow:hidden}
.wx.l0{border-top-color:var(--ok)} .wx.l1{border-top-color:var(--warn)} .wx.l2{border-top-color:var(--stop)}
.wx-scene{position:relative;line-height:0}
.wx-svg{width:100%;height:auto;aspect-ratio:360/196;display:block}
.bubble{position:absolute;top:10px;left:10px;max-width:60%;background:rgba(255,255,255,.94);color:#10293A;border-radius:12px;padding:8px 11px;font-size:13.5px;line-height:1.32;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bubble::after{content:"";position:absolute;right:-7px;bottom:12px;border:7px solid transparent;border-left-color:rgba(255,255,255,.94);border-right:0}
@media (max-width:420px){.bubble{font-size:12.5px;max-width:64%;padding:7px 9px}}
.wx-head{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.wx-name{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:23px;font-weight:700;line-height:1.05}
.wx-cond{font-size:14px;color:var(--muted)}
.wx-stat{margin-left:auto;font-family:"Barlow Condensed",system-ui,sans-serif;font-size:26px;font-weight:700}
.wx.l0 .wx-stat{color:var(--ok)} .wx.l1 .wx-stat{color:var(--warn)} .wx.l2 .wx-stat{color:var(--stop)}
.wx-hours{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px}
.wx-hours button{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.wx-hours button[aria-pressed="true"]{background:var(--ocean);border-color:var(--ocean);color:#fff}
.wx-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.wt{background:var(--surface);padding:10px 14px;min-width:0}
.wt.wide{grid-column:1/-1}
.wt .k{font-size:13px;color:var(--muted)}
.wt .v{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:30px;font-weight:600;line-height:1.1;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.wt .v small{font-family:"Barlow",system-ui,sans-serif;font-size:14px;font-weight:500;color:var(--muted)}
.wt .d{font-size:13px;color:var(--muted)}
.wt.flag-1 .v{color:var(--warn)} .wt.flag-2 .v{color:var(--stop)}
.wt .bft{margin-top:6px}
.wind{display:inline-flex;align-items:center;gap:3px}
.arrow{color:var(--ocean);transition:transform .4s}
.uv{display:inline-block;min-width:36px;text-align:center;border-radius:7px;padding:0 7px}
.tide{width:100%;max-width:300px;height:46px;display:block;margin:4px 0 2px}
.wx .why{list-style:none;margin:0;padding:10px 16px 14px;font-size:14px}
.wx .why li{padding:2px 0}

/* ---------- v5 ---------- */
.vestnote{display:flex;align-items:center;gap:10px;margin:0 16px 10px;padding:9px 12px;border-radius:10px;background:var(--warn-soft);border-left:4px solid #FFD21A}

.vestnote svg{flex:none}
.vestnote b{display:block;color:var(--ink)}
.vestnote span{font-size:14px;color:var(--ink)}
.alertbar{display:flex;align-items:center;gap:10px;background:var(--stop);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:14px}
.alertbar b{display:block}
.alertbar span{display:block;font-size:14px;opacity:.92}
.alertbar .linkbtn{color:#fff;margin-left:auto}
nav.bottom button.alerta{background:var(--stop);color:#fff}
nav.bottom button.alerta svg{color:#fff}
@media (prefers-reduced-motion:no-preference){nav.bottom button.alerta{animation:pulsa 1.6s ease-in-out infinite}@keyframes pulsa{50%{background:#E2574A}}}
nav.tabs button.alerta{background:#fff;color:var(--stop)}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.pill{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px}
.pill.p0{background:var(--ok-soft);color:var(--ok)} .pill.p1{background:var(--warn-soft);color:var(--warn)} .pill.p2{background:var(--stop-soft);color:var(--stop)}
.remline{margin:0 16px 10px;padding:8px 12px;border-radius:10px;background:var(--surface-2);font-size:14px;display:flex;flex-direction:column}
.remline span{color:var(--muted);font-size:13px}
.remline.ok{background:var(--ok-soft)} .remline.ok b{color:var(--ok)}
.remline.cx{background:var(--stop-soft)} .remline.cx b{color:var(--stop)}
.wx-hours button.rem{position:relative}
.wx-hours button.rem::after{content:"";position:absolute;top:3px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.wx-hours button.rem.cx::after{background:var(--stop)}
.staffrow{padding:8px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.testbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--ocean-soft);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:14px}
.testbar select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px}

.fotobox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fotobox img{max-width:150px;max-height:96px;border-radius:8px;border:1px solid var(--line);display:block}
.thumb{border:0;padding:0;background:none;cursor:zoom-in}
.thumb img{max-width:120px;max-height:76px;border-radius:6px;border:1px solid var(--line);display:block}
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.lightbox .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:#fff;border:0;width:40px;height:40px;border-radius:50%;font-size:22px}
/* ---------- v8 ---------- */
nav.bottom button{font-size:10.5px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.novo{background:#FFD21A;color:#3A2F00}
nav.bottom button.novo svg{color:#3A2F00}
nav.tabs button.novo{background:#FFD21A;color:#3A2F00}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hbtn{background:rgba(255,255,255,.16);border:0;color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none;margin-left:8px}
@media (max-width:1100px){.hbtn{margin-left:auto}}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.langs .opt span{text-align:center}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:7px 12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.plist{list-style:none;margin:10px 0 0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}
.plist .av{width:34px;height:34px;font-size:14px}
.pick .pk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;color:inherit}
.pick .pk.no{opacity:.55;cursor:not-allowed}
.pick .nao{display:block;color:var(--stop);font-size:13px;font-weight:600}
.cgrid{display:grid;gap:12px;margin-top:14px}
@media (min-width:760px){.cgrid{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.cgrid{grid-template-columns:1fr 1fr 1fr}}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.chead{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cnome{flex:1;min-width:0;font-family:"Barlow Condensed",system-ui,sans-serif;font-size:21px;font-weight:700;border:1px solid transparent;border-radius:8px;padding:2px 6px;background:none;color:var(--ink)}
.cnome:focus{border-color:var(--line);background:var(--surface-2)}
.lixo{font-size:16px}
.ccard select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px}
.canoa-topo{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:600/150}
.cnv{position:absolute;inset:0;width:100%;height:100%}
.banco{position:absolute;top:56%;transform:translate(-50%,-50%);width:13%;max-width:46px;aspect-ratio:1;border-radius:50%;border:2px dashed #fff;background:rgba(255,255,255,.88);color:#10293A;display:grid;place-items:center;cursor:pointer;padding:0;font-weight:700}
.banco .bn{position:absolute;top:-7px;right:-7px;width:17px;height:17px;border-radius:50%;background:#FFD21A;color:#10293A;font-size:10.5px;font-weight:800;display:grid;place-items:center;line-height:1}
.banco .bi{font-size:clamp(10px,2.6vw,14px)}
.banco.ocup{background:#10293A;color:#fff;border:2px solid #fff}
.banco.erro{background:var(--stop);color:#fff;border:2px solid #fff}
.banco:focus-visible{outline:3px solid #FFD21A;outline-offset:2px}
.blist{margin:10px 0 0;padding:0;list-style:none;font-size:14.5px}
.blist li{display:flex;gap:8px;padding:4px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.blist li:first-child{border-top:0}
.blist li span{color:var(--muted);min-width:64px}
.blist li.erro b{color:var(--stop)}
.blist small{flex-basis:100%;color:var(--stop);margin-left:72px}
.addc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:220px;border:2px dashed var(--line);background:none;cursor:pointer;color:var(--ocean);font-weight:700}
.addc span{font-size:40px;line-height:1}
.pager{justify-content:center;gap:14px;margin-top:14px}
.catprev{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.iakofoot{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0 6px;color:var(--muted);font-size:13px}
.iakofoot b{color:var(--ink);letter-spacing:.08em}
.vozbot{position:fixed;inset:0;z-index:70;background:rgba(5,18,26,.6);display:flex;align-items:flex-end;justify-content:center}
.vbox{background:var(--surface);width:100%;max-width:620px;height:min(88vh,760px);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.vozbot{align-items:center}.vbox{border-radius:20px}}
.vhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.vhead b{font-size:19px}
.vhead span{color:var(--muted);font-size:14px}
.vhead .x{margin-left:auto;background:var(--surface-2);border:0;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}
.vlog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px 2px}
.vmsg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:16px;line-height:1.4}
.vmsg.bot{background:var(--ocean-soft);align-self:flex-start;border-bottom-left-radius:4px}
.vmsg.eu{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.vform{display:flex;gap:8px}
.vform input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:17px;background:var(--surface-2);color:var(--ink)}
.btn.mic{font-size:17px;padding:12px 22px}
.vozbot.ouvindo .btn.mic{background:var(--stop);animation:pulsa 1.2s infinite}
html.hc{--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F2F2F2;--ink:#000000;--muted:#1F1F1F;--line:#5A5A5A;--ocean:#00456B;--ocean-soft:#DCEFFF;--ok:#00602C;--warn:#7A4E00;--stop:#A30000}
html.hc .hint, html.hc .sub, html.hc .k{color:#1F1F1F !important}
html.hc .btn{outline:2px solid #000}
html[dir="rtl"] .bubble::after{display:none}
.loginscreen{position:fixed;inset:0;z-index:15;background:linear-gradient(160deg,#F23F0C,#FC6A14);display:grid;place-items:center;padding:24px;overflow:auto}
.loginscreen form{display:grid;gap:8px}
.loginscreen input{border:1px solid #D3DEE3;border-radius:10px;padding:11px 12px;font-size:16px}
.lgiako{display:flex;align-items:center;justify-content:center;gap:6px;color:#5B7282;font-size:12px;font-weight:700;letter-spacing:.12em;margin-top:4px}
.ltabs{display:flex;background:#EEF2F4;border-radius:10px;padding:3px}

.ltabs button[aria-pressed="true"]{background:#fff;color:#10293A;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.mine.cxl{background:var(--stop-soft);color:var(--stop)}
.mine.cxl b{display:block;font-size:16px}
.mine.cxl span{display:block;font-weight:500;color:var(--ink);font-size:14px}
.backbtn{background:none;border:0;color:var(--ocean);font-weight:600;font-size:15px;padding:4px 0 10px;cursor:pointer}
.sech{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:21px;font-weight:600;margin:22px 0 8px}
.ptitle{margin:0 0 12px;font-size:26px}
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:760px){.gtiles{grid-template-columns:repeat(3,1fr)}}
.gtile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;min-height:132px}
.gtile b{font-size:17px}
.gtile span:last-child{font-size:13.5px;color:var(--muted);line-height:1.3}
.gic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}

.bars{display:grid;gap:6px}
.barrow{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:14px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:5px}
.bv{font-weight:600;min-width:28px;text-align:right}
.bv small{font-weight:400;color:var(--muted)}
.wk{display:flex;gap:6px;align-items:flex-end;height:130px;padding-top:6px}
.wkc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}

.wkc span{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.fcard,.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.fcard{padding:14px 16px;border-left:5px solid var(--warn)}
.fcard.off{opacity:.65}
.fcard .tp{font-size:14px;font-weight:600;color:var(--warn)}
.fcard h3,.post h3{margin:4px 0;font-size:21px}
.fcard .tx,.post .tx{white-space:pre-wrap;margin:4px 0 0}
.post img{width:100%;max-height:340px;object-fit:cover;display:block}
.pbody{padding:12px 16px 14px}
.b.rede{background:var(--ocean-soft);color:var(--ocean)}
.b.r-instagram{background:#FCE4EF;color:#B0185B} .b.r-youtube{background:#FDE2E0;color:#C0392B} .b.r-facebook{background:#E3ECFA;color:#2050A0} .b.r-tiktok{background:#E8E8E8;color:#111}
.wapre{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;max-height:260px;overflow:auto;margin:0}
.btn.wa{background:#1FA855;color:#fff}
.wprog{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.wbar{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.wbar i{display:block;height:100%;background:var(--ocean);transition:width .3s}
.wprog span{font-size:13px;color:var(--muted);white-space:nowrap}
.wnav{position:sticky;bottom:-18px;background:var(--surface);padding:12px 0 4px;margin-top:16px;border-top:1px solid var(--line)}
.wstep[hidden],.fstep[hidden]{display:none}
.wt{margin:4px 0 10px;font-size:20px}
.legal{max-height:46vh;overflow:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14.5px}
.legal h4{margin:4px 0 8px;font-size:18px;color:var(--ocean);text-align:center}
.legal h5{margin:12px 0 4px;font-size:15px;color:var(--ocean)}
.legal p,.legal ul{margin:0 0 6px}
.concorda{display:flex;gap:10px;align-items:center;background:var(--ocean-soft);border-radius:12px;padding:12px 14px;margin-top:10px;font-weight:600;cursor:pointer}
.concorda input{width:22px;height:22px;accent-color:var(--ocean);flex:none}
.concorda.opc{background:var(--surface-2);font-weight:500}
.passos{padding-left:20px;margin:6px 0 10px} .passos li{margin:4px 0}
.mareline{display:flex;align-items:center;gap:10px;margin:0 16px 10px;padding:9px 12px;border-radius:10px;background:var(--surface-2);font-size:14px}
.mareline svg{flex:none}
.mareline b{display:block}
.mareline span{display:block;color:var(--muted);font-size:13px}
.mareline.enchente{background:#E1F0FA;color:#14577A} .mareline.vazante{background:#EAF3EE;color:#1E6B45} .mareline.estofo{background:var(--warn-soft);color:var(--warn)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mareline.enchente{background:#16384A;color:#9CD3EE} :root:not([data-theme="light"]) .mareline.vazante{background:#173A29;color:#9BDDB7}}
.b.mare-enchente{background:#E1F0FA;color:#14577A} .b.mare-vazante{background:#EAF3EE;color:#1E6B45} .b.mare-estofo{background:var(--warn-soft);color:var(--warn)}
.vagas{display:flex;gap:6px;margin-top:8px}
.vagas>div{flex:1;background:var(--surface-2);border-radius:8px;padding:5px 6px;text-align:center;min-width:0}
.vagas b{display:block;font-family:"Barlow Condensed",system-ui,sans-serif;font-size:22px;line-height:1.05}
.vagas span{font-size:11.5px;color:var(--muted)}
.vagas .ok b{color:var(--ok)} .vagas .zero b{color:var(--stop)}
.oferta{background:#FFF4C2;color:#3A2F00;padding:12px 16px;border-top:1px solid var(--line)}
.oferta b{display:block;font-size:16px}
.oferta span{font-size:14px}
.tag.of{color:var(--warn);font-weight:600}
.planos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:760px){.planos{grid-template-columns:repeat(5,1fr)}}
.plano{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.plano.dest{border:2px solid var(--brand)}
.pn{font-weight:600}
.pv{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:clamp(21px,6.2vw,28px);font-weight:700;color:var(--ocean);white-space:nowrap}
.plano{min-width:0}
.vagasw{padding:0 16px 12px}
.vagasw .vagas{margin-top:0}
.pm{font-size:13px;color:var(--muted)}
.eco{font-size:12.5px;font-weight:700;color:var(--ok)}
.bases{display:grid;gap:12px}
@media (min-width:760px){.bases{grid-template-columns:1fr 1fr}}
.estl{list-style:none;margin:0;padding:0}
.estl li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.estl li:first-child{border-top:0}
.estl small{display:block;color:var(--muted);font-size:13px}
.est{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.est.sim{background:var(--ok-soft);color:var(--ok)} .est.nao{background:var(--stop-soft);color:var(--stop)} .est.q{background:var(--surface-2);color:var(--muted)}
.estrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.estrow input{grid-column:1/-1;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.estrow select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px}
.dif{margin:0;padding-left:20px} .dif li{margin:4px 0}
.perfilcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:6px}
.perfilcard b{display:block;font-size:19px}
.perfilcard span{display:block;color:var(--muted);font-size:14px}
img.av{object-fit:cover;padding:0}
.av.big{width:64px;height:64px;font-size:26px}
.lockscreen{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#F23F0C,#FC6A14);display:grid;place-items:center;padding:24px}
.lockbox{background:rgba(255,255,255,.96);border-radius:20px;padding:24px;max-width:340px;width:100%;text-align:center;display:grid;gap:10px;color:#10293A}
.lockbox img{margin:0 auto;background:#F04A12;border-radius:14px;padding:6px}
.lockbox h2{margin:0}
.lockbox form{display:grid;gap:8px}
.lockbox input{border:1px solid #D3DEE3;border-radius:10px;padding:10px 12px;font-size:16px}
.lkerr{color:#C0392B;margin:0;min-height:1em}
.campo{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--surface-2)}
.campo input[data-k=rotulo]{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.campo select,.campo textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px}
.campo textarea{width:100%;margin-top:6px;min-height:70px}
.cn{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:18px;color:var(--muted);width:20px}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;cursor:pointer}
.qbox{display:flex;flex-direction:column;gap:6px}
.ql{font-size:15px;color:var(--ink);font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font-size:14.5px}
.opt input:checked+span{background:var(--ocean);border-color:var(--ocean);color:#fff}
.opt input:focus-visible+span{outline:2px solid var(--ocean);outline-offset:2px}
.aceite{background:var(--ocean-soft);border-radius:12px;padding:12px;font-weight:600}
details.resp{border-top:1px solid var(--line);padding:8px 0}
details.resp summary{cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:30}
.toast[hidden]{display:none}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:15px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

  <button data-tab="clube"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 14h20l-2.5 3.5h-15z"/><path d="M5 14V9M19 14V9M5 9h14"/></svg><span class="lbl">Clube</span></button>

<div class="overlay" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => (v === "" || v == null || isNaN(+v)) ? null : +v;
const fmtN = (v, d=1) => v == null ? "–" : (+v).toLocaleString("pt-BR",{maximumFractionDigits:d});

function todaySP(){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  return p;
}
function dateLabel(iso){
  if(!iso) return "";
  const t = todaySP();
  const d = new Date(iso+"T12:00:00");
  const td = new Date(t+"T12:00:00");
  const diff = Math.round((d - td)/86400000);
  if(diff===0) return "Hoje";
  if(diff===1) return "Amanhã";
  if(diff===-1) return "Ontem";
  return d.toLocaleDateString("pt-BR",{weekday:"short",day:"numeric",month:"short"}).replace(".","");
}

const DEFAULT_LIM = {
  vento:{a:12,c:18}, rajada:{a:16,c:22}, onda:{a:1.5,c:2.5}, chuva_prob:{a:60,c:null}, chuva_mm:{a:5,c:15}
};
const DEFAULT_CONFIG = { canoas:[], limites: DEFAULT_LIM, grade:[] };
/* ---------- bases e marca do clube (configuráveis) ---------- */
const BASES_PADRAO = [
  {id:"Urca", nome:"Praia da Urca", curto:"Urca", tipo:"mar", lat:-22.9530, lon:-43.1640, mlat:-22.9640, mlon:-43.1560, mare:true, baia:"Baía de Guanabara", paisagem:"paodeacucar"},
  {id:"Lagoa", nome:"Lagoa Rodrigo de Freitas", curto:"Lagoa", tipo:"lagoa", lat:-22.9711, lon:-43.2105, mare:false, baia:"", paisagem:"morros"}];
let BASES = BASES_PADRAO.slice();
let LOCAIS = BASES.map(b=>b.id);
function B(id){ return BASES.find(b=>b.id===id) || {id, nome:id, curto:id, tipo:"mar", lat:0, lon:0, mare:false, paisagem:"plano"}; }
function ehMar(id){ return B(id).tipo==="mar"; }
function temMare(id){ return !!B(id).mare; }
function naBase(id){ return `na base ${B(id).curto||id}`; }
const DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const DIRS = ["N","NE","E","SE","S","SO","O","NO"];
const TIPOS = {OC6:6, OC2:2, OC1:1, V6:6, V1:1};

const S = {
  db:null, user:null, canEdit:false, uid:null,
  tab:"agenda", day:todaySP(),
  previsoes:{}, marHora:{}, marSim:null, previsaoConectada:false,
  forms:{}, midia:{}, formresp:{}, minhasResp:null, gsub:null, canMidia:false,
  role:"visitante", canAgenda:false, platAdmin:false, isOwner:false, equipe:{}, minhaFicha:null, me:null, agendaBase:"todas",
  avisos:{}, avisosLoaded:false, muralFiltro:"todos", muralAberto:{},
  provas:{}, atletas:{}, atletaMe:null, showPastProvas:false,
  turmas:{}, turmasLoaded:false, insc:{}, names:{}, canWrite:null, pending:false, showPast:false,
  config:DEFAULT_CONFIG, configLoaded:false,
  boletins:{}, boletinsLoaded:false,
  alunos:[], alunosLoaded:false, alunosSearch:"", alunosFilter:"todos",
  readOnly:false
};

/* ---------- tabs ---------- */
const TABS = ["agenda","mar","mural","midia","competicao","clube","perfil","alunos","operacao"];
const SUB_PERFIL = ["alunos","operacao"];
function setTab(t){
  S.tab = t;
  document.querySelectorAll("nav [data-tab]").forEach(b => b.setAttribute("aria-current", (b.dataset.tab===t || (b.dataset.tab==="perfil" && SUB_PERFIL.includes(t))) ? "page" : "false"));
  S.gsub=null; if(t!=="competicao") S.compView=null;
  TABS.forEach(k => $("#v-"+k).hidden = k!==t);
  if(location.hash !== "#"+t) history.replaceState(null,"","#"+t);
  render();
  window.scrollTo(0,0);
}
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if(TABS.includes(h) && h!==S.tab) setTab(h); });

$("#dayPick").value = S.day;
$("#dayPick").addEventListener("change", e => { if(e.target.value){ S.day = e.target.value; renderMar(); }});

/* ---------- toast ---------- */
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

/* ---------- sheet ---------- */
function openSheet(html, onMount){
  S.openTurma = null;
  $("#sheet").innerHTML = html;
  $("#ov").hidden = false;
  document.body.style.overflow="hidden";
  const x = $("#sheet .x"); if(x) x.addEventListener("click", closeSheet);
  if(onMount) onMount($("#sheet"));
}
function closeSheet(){ S.openTurma = null; $("#ov").hidden = true; document.body.style.overflow=""; }
function ask(msg, ok){ return new Promise(res=>{ openSheet(`<div class="head"><h2>Confirmar</h2><button class="x" aria-label="Fechar">×</button></div><p style="margin:4px 0 0">${esc(msg)}</p><div class="row" style="margin-top:18px"><span class="spacer"></span><button class="btn ghost" id="qN">Voltar</button><button class="btn" id="qY">${esc(ok||"Confirmar")}</button></div>`, root=>{ let done=false; const fin=v=>{ if(done) return; done=true; res(v); }; root.querySelector("#qN").addEventListener("click",()=>{ closeSheet(); fin(false); }); root.querySelector("#qY").addEventListener("click",()=>fin(true)); root.querySelector(".x").addEventListener("click",()=>fin(false)); }); }); }
function askText(title, label){ return new Promise(res=>{ openSheet(`<div class="head"><h2>${esc(title)}</h2><button class="x" aria-label="Fechar">×</button></div><form id="qF"><label class="f">${esc(label)}<input name="v" required maxlength="60" autocomplete="name"></label><div class="row" style="margin-top:18px"><span class="spacer"></span><button class="btn" type="submit">Continuar</button></div></form>`, root=>{ root.querySelector("input").focus(); root.querySelector("#qF").addEventListener("submit",e=>{ e.preventDefault(); const v=new FormData(e.target).get("v").toString().trim(); closeSheet(); res(v||null); }); root.querySelector(".x").addEventListener("click",()=>res(null)); }); }); }
$("#ov").addEventListener("click", e => { if(e.target.id==="ov") closeSheet(); });
document.addEventListener("keydown", e => { if(e.key==="Escape" && !$("#ov").hidden) closeSheet(); });

/* ---------- avaliação das condições ---------- */
function lim(){ return Object.assign({}, DEFAULT_LIM, S.config.limites||{}); }
const BEAUFORT = [[1,"Calmaria","menos de 1 nó"],[4,"Bafagem","1 a 3 nós"],[7,"Aragem","4 a 6 nós"],[11,"Fraco","7 a 10 nós"],[17,"Moderado","11 a 16 nós"],[22,"Fresco","17 a 21 nós"],[28,"Muito fresco","22 a 27 nós"],[34,"Forte","28 a 33 nós"],[41,"Muito forte","34 a 40 nós"],[48,"Duro","41 a 47 nós"],[56,"Muito duro","48 a 55 nós"],[64,"Tempestuoso","56 a 63 nós"],[Infinity,"Furacão","64 nós ou mais"]];
const DEFAULT_BF = { mar:[0,0,0,0,1,2,2,2,2,2,2,2,2], lagoa:[0,0,0,0,0,1,2,2,2,2,2,2,2] };
const NIVEL_TXT = ["Liberada","Atenção","Cancelada"];
const NOME_BASE = {}; BASES.forEach(b=>NOME_BASE[b.id]=b.nome);
function beaufort(kn){ if(kn==null) return null; const v=Math.round(kn); for(let f=0; f<BEAUFORT.length; f++){ if(v<BEAUFORT[f][0]) return {f, n:BEAUFORT[f][1], faixa:BEAUFORT[f][2]}; } return null; }
function bfTabela(base){ const t=S.config.beaufort && S.config.beaufort[base]; return (t && t.length===13) ? t : DEFAULT_BF[ehMar(base)?"mar":"lagoa"]; }
function baseData(b, base){ if(!b) return null; if(b.bases) return b.bases[base]||null; return base===LOCAIS[0] ? b : null; }
function temDados(d){ return !!d && ["temp_ar","chuva_prob","chuva_mm","vento","rajada","onda"].some(k=>d[k]!==""&&d[k]!=null); }
function avaliarBase(d, base){
  const L=lim(); const motivos=[]; let nivel=0; const flags={};
  const bt=bfTabela(base);
  const bf=beaufort(num(d.vento)), bg=beaufort(num(d.rajada));
  if(bf){ const s=bt[bf.f]; flags.vento=s; nivel=Math.max(nivel,s); if(s>0) motivos.push(`Vento de ${fmtN(num(d.vento),0)} nós: força ${bf.f} (${bf.n}) na escala Beaufort`); }
  if(bg){ const fg=Math.max(0,bg.f-1), s=bt[fg]; if(s>(flags.vento||0)){ flags.rajada=s; nivel=Math.max(nivel,s); motivos.push(`Rajadas de ${fmtN(num(d.rajada),0)} nós: força ${bg.f} (${bg.n})`); } }
  const chk=(key,val,label,unit)=>{ if(val==null) return; const l=L[key]; if(!l) return;
    if(l.c!=null && val>=l.c){ nivel=Math.max(nivel,2); flags[key]=2; motivos.push(`${label} ${fmtN(val)} ${unit}, limite para cancelar é ${fmtN(l.c)}`); }
    else if(l.a!=null && val>=l.a){ nivel=Math.max(nivel,1); flags[key]=1; motivos.push(`${label} ${fmtN(val)} ${unit}, acima de ${fmtN(l.a)}`); } };
  if(ehMar(base)) chk("onda", num(d.onda), "Ondulação", "m");
  chk("chuva_mm", num(d.chuva_mm), "Chuva", "mm");
  chk("chuva_prob", num(d.chuva_prob), "Chance de chuva", "%");
  let manual=false;
  if(d.decisao && d.decisao!=="auto"){ manual=true; nivel={liberada:0,atencao:1,cancelada:2}[d.decisao]; }
  return {nivel, motivos, flags, manual, bf, bg};
}
function bfStrip(base, f){ const t=bfTabela(base); return `<div class="bft" role="img" aria-label="Escala Beaufort de 0 a 12, força atual ${f}">${t.map((s,i)=>`<span class="s${s}${i===f?" on":""}">${i}</span>`).join("")}</div>`; }
const WORD = ["Remada liberada","Remar com atenção","Remada cancelada"];

/* ---------- MAR ---------- */
function cardBase(base, d){
  if(!temDados(d)) return `<article class="bcard"><div class="bhead"><div><div class="bname">${NOME_BASE[base]}</div><div class="bsub">Sem previsão lançada</div></div></div><p class="hint" style="padding:0 16px 14px;margin:0">${S.canAgenda?"Toque em “Lançar previsão” e preencha com os dados do Windy.":"Os instrutores publicam a previsão antes da remada."}</p></article>`;
  const ev=avaliarBase(d,base), bf=ev.bf;
  const mares=(d.mares||[]).filter(m=>m.hora);
  return `<article class="bcard l${ev.nivel}">
    <div class="bhead"><div><div class="bname">${NOME_BASE[base]}</div><div class="bsub">Previsão para as ${esc(d.hora||"06:00")}</div></div><div class="bword">${NIVEL_TXT[ev.nivel]}</div></div>
    <div class="bm">
      <div><div class="k">Temperatura</div><div class="v">${fmtN(num(d.temp_ar),0)}<small>°C</small></div>${ehMar(base)&&num(d.temp_agua)!=null?`<div class="d">água ${fmtN(num(d.temp_agua),0)} °C</div>`:""}</div>
      <div class="flag-${ev.flags.chuva_prob||0}"><div class="k">Chance de chuva</div><div class="v">${fmtN(num(d.chuva_prob),0)}<small>%</small></div></div>
      <div class="flag-${ev.flags.chuva_mm||0}"><div class="k">Chuva no horário</div><div class="v">${fmtN(num(d.chuva_mm))}<small>mm</small></div></div>
      <div class="flag-${Math.max(ev.flags.vento||0,ev.flags.rajada||0)}"><div class="k">Vento no horário</div><div class="v">${fmtN(num(d.vento),0)}<small>nós</small></div><div class="d">${d.vento_dir?esc(d.vento_dir)+", ":""}rajada ${fmtN(num(d.rajada),0)}</div></div>
    </div>
    ${bf?`<div class="bfbox"><div class="bft-t"><b>Beaufort ${bf.f}: ${bf.n}</b> <span>${bf.faixa}</span><span class="spacer"></span><b class="c${bfTabela(base)[bf.f]}">${["vento liberado","vento pede atenção","vento acima do limite"][bfTabela(base)[bf.f]]}</b></div>${bfStrip(base,bf.f)}</div>`:""}
    ${ehMar(base)&&(num(d.onda)!=null||mares.length||d.corrente)?`<div class="bxtra">
      ${num(d.onda)!=null?`<div><span class="k">Ondulação</span> <b class="${ev.flags.onda?"c"+ev.flags.onda:""}">${fmtN(num(d.onda))} m</b>${d.periodo?`, ${fmtN(num(d.periodo),0)} s`:""}${d.onda_dir?`, ${esc(d.onda_dir)}`:""}</div>`:""}
      ${mares.length?`<div><span class="k">Maré</span> ${mares.map(m=>`${esc(m.tipo||"")} ${esc(m.hora)}${m.altura!==""&&m.altura!=null?` (${fmtN(num(m.altura))} m)`:""}`).join(", ")}</div>`:""}
      ${d.corrente?`<div><span class="k">Corrente</span> ${esc(d.corrente)}</div>`:""}
    </div>`:""}
    <ul class="why">${ev.manual?`<li>Decisão do instrutor${d.decisao_motivo?`: ${esc(d.decisao_motivo)}`:""}</li>`:""}${ev.motivos.length?ev.motivos.map(m=>`<li>${esc(m)}</li>`).join(""):(ev.manual?"":"<li>Todas as leituras dentro dos limites do clube.</li>")}</ul>
  </article>`;
}
function dirSelect(name, val){
  return `<select name="${name}"><option value="">–</option>${DIRS.map(d=>`<option ${d===val?"selected":""}>${d}</option>`).join("")}</select>`;
}
function editBoletim(){
  const b = S.boletins[S.day] || {};
  const campos = (base)=>{
    const d = baseData(b, base) || {};
    const p = base+"_";
    const m = (d.mares||[]).concat([{},{},{},{}]).slice(0,4);
    return `<fieldset class="basefs"><legend>${NOME_BASE[base]}</legend><div class="grid">
      <label class="f">Horário da previsão<input name="${p}hora" type="time" value="${esc(d.hora||"06:00")}"></label>
      <label class="f">Temperatura (°C)<input name="${p}temp_ar" inputmode="decimal" value="${esc(d.temp_ar)}"></label>
      <label class="f">Chance de chuva (%)<input name="${p}chuva_prob" inputmode="numeric" value="${esc(d.chuva_prob)}"></label>
      <label class="f">Chuva no horário (mm)<input name="${p}chuva_mm" inputmode="decimal" value="${esc(d.chuva_mm)}"></label>
      <label class="f">Vento médio (nós)<input name="${p}vento" data-bf="${base}" inputmode="decimal" value="${esc(d.vento)}"></label>
      <label class="f">Rajada (nós)<input name="${p}rajada" inputmode="decimal" value="${esc(d.rajada)}"></label>
      <label class="f full">Direção do vento${dirSelect(p+"vento_dir", d.vento_dir)}</label>
      <p class="hint full bfprev" id="bfp_${base}"></p>
      ${ehMar(base)?`
      <label class="f">Ondulação (m)<input name="${p}onda" inputmode="decimal" value="${esc(d.onda)}"></label>
      <label class="f">Período (s)<input name="${p}periodo" inputmode="decimal" value="${esc(d.periodo)}"></label>
      <label class="f">Direção da ondulação${dirSelect(p+"onda_dir", d.onda_dir)}</label>
      <label class="f">Água (°C)<input name="${p}temp_agua" inputmode="decimal" value="${esc(d.temp_agua)}"></label>
      <div class="full"><div class="hint" style="margin:6px 0">Maré</div>${m.map((x,i)=>`<div class="tiderow">
        <label class="f">Hora<input name="${p}m_hora_${i}" type="time" value="${esc(x.hora)}"></label>
        <label class="f">Altura (m)<input name="${p}m_alt_${i}" inputmode="decimal" value="${esc(x.altura)}"></label>
        <label class="f">Tipo<select name="${p}m_tipo_${i}"><option value="">–</option><option ${x.tipo==="Preamar"?"selected":""}>Preamar</option><option ${x.tipo==="Baixa-mar"?"selected":""}>Baixa-mar</option></select></label></div>`).join("")}</div>
      <label class="f full">Corrente (SISCORAR)<textarea name="${p}corrente" placeholder="Ex.: enchente forte na entrada da baía até 7h">${esc(d.corrente)}</textarea></label>`:""}
      <label class="f full">Semáforo<select name="${p}decisao">
        <option value="auto" ${!d.decisao||d.decisao==="auto"?"selected":""}>Automático (Beaufort e limites do clube)</option>
        <option value="liberada" ${d.decisao==="liberada"?"selected":""}>Liberada, decisão do instrutor</option>
        <option value="atencao" ${d.decisao==="atencao"?"selected":""}>Atenção, decisão do instrutor</option>
        <option value="cancelada" ${d.decisao==="cancelada"?"selected":""}>Cancelada, decisão do instrutor</option></select></label>
      <label class="f full">Motivo da decisão<input name="${p}decisao_motivo" value="${esc(d.decisao_motivo)}"></label>
    </div></fieldset>`;
  };
  openSheet(`
    <div class="head"><h2>Previsão de ${esc(dateLabel(S.day).toLowerCase())}</h2><button class="x" aria-label="Fechar">×</button></div>
    <p class="hint">Copie do Windy os valores do horário da remada. A força Beaufort e o semáforo são calculados automaticamente.</p>
    <form id="fb">${LOCAIS.map(campos).join("")}
      <fieldset><legend>Geral</legend><div class="grid">
        <label class="f full">Recado para os alunos<textarea name="obs">${esc(b.obs)}</textarea></label>
        <label class="f full">Fonte<input name="fonte" value="${esc(b.fonte||"Windy e SISCORAR")}"></label></div></fieldset>
      <div class="row" style="margin-top:18px">${S.boletins[S.day]?`<button type="button" class="btn danger small" id="delB">Apagar</button>`:""}<span class="spacer"></span><button type="button" class="btn ghost" id="cancelB">Cancelar</button><button type="submit" class="btn">Publicar previsão</button></div>
    </form>`, root=>{
      const prev = inp => { const base=inp.dataset.bf, out=root.querySelector("#bfp_"+base), bf=beaufort(num(inp.value.replace(",","."))); out.textContent = bf ? `Força ${bf.f} na escala Beaufort (${bf.n}, ${bf.faixa}): ${["liberada","atenção","cancelada"][bfTabela(base)[bf.f]]} na ${NOME_BASE[base]}.` : ""; };
      root.querySelectorAll("[data-bf]").forEach(i=>{ i.addEventListener("input",()=>prev(i)); prev(i); });
      root.querySelector("#cancelB").addEventListener("click", closeSheet);
      const del=root.querySelector("#delB");
      if(del) del.addEventListener("click", async()=>{ if(!await ask("Apagar a previsão deste dia?","Apagar previsão")) return; try{ await S.db.doc("boletins/"+S.day).delete(); closeSheet(); toast("Previsão apagada"); }catch(e){ failWrite(e); } });
      root.querySelector("#fb").addEventListener("submit", async ev=>{
        ev.preventDefault();
        const f=new FormData(ev.target); const g=k=>(f.get(k)||"").toString().trim();
        const nm=v=>v.replace(",",".");
        const bases={};
        for(const base of LOCAIS){
          const p=base+"_", o={};
          ["hora","temp_ar","chuva_prob","chuva_mm","vento","rajada","vento_dir","decisao"].forEach(k=>o[k]=nm(g(p+k)));
          o.decisao_motivo=g(p+"decisao_motivo");
          if(ehMar(base)){
            ["onda","periodo","onda_dir","temp_agua"].forEach(k=>o[k]=nm(g(p+k)));
            o.corrente=g(p+"corrente");
            o.mares=[0,1,2,3].map(i=>({hora:g(p+"m_hora_"+i), altura:nm(g(p+"m_alt_"+i)), tipo:g(p+"m_tipo_"+i)})).filter(x=>x.hora);
          }
          bases[base]=o;
        }
        const doc={data:S.day, bases, obs:g("obs"), fonte:g("fonte"), atualizado:new Date().toISOString()};
        try{ await S.db.doc("boletins/"+S.day).set(doc); closeSheet(); toast("Previsão publicada"); }catch(e){ failWrite(e); }
      });
    });
}

/* ---------- runtime: Claude ou versão de testes ---------- */
const TESTE = (function(){
  const KEY="pvv-teste-db", RKEY="pvv-teste-papel";
  let store={}; try{ store=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(_){}

const COORD = new Proxy({}, {get:(_,k)=>{ const b=B(k); return {lat:b.lat, lon:b.lon, mlat:b.mlat??b.lat, mlon:b.mlon??b.lon}; }});
const LIVE = {}, LIVE_ST = {};
async function buscarPrevisao(date){
  if(!AO_VIVO || LIVE[date] || LIVE_ST[date]) return;
  LIVE_ST[date]="carregando";
  const hv="temperature_2m,apparent_temperature,relative_humidity_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index,is_day";
  const tz="America%2FSao_Paulo", rng=`&start_date=${date}&end_date=${date}`;
  const get=async u=>{ const r=await fetch(u); const j=await r.json(); if(!r.ok||j.error) throw new Error(j.reason||("HTTP "+r.status)); return j.hourly; };
  try{
    const bases={};
    for(const b of LOCAIS){
      const c=COORD[b];
      const w=await get(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&hourly=${hv}&wind_speed_unit=kn&timezone=${tz}${rng}`);
      const h={temp:w.temperature_2m, feels:w.apparent_temperature, rh:w.relative_humidity_2m, prob:w.precipitation_probability, mm:w.precipitation, code:w.weather_code, wind:w.wind_speed_10m, dir:w.wind_direction_10m, gust:w.wind_gusts_10m, uv:w.uv_index, isday:w.is_day};
      if(ehMar(b)){
        try{ const m=await get(`https://marine-api.open-meteo.com/v1/marine?latitude=${c.mlat}&longitude=${c.mlon}&hourly=wave_height,wave_period,wave_direction,sea_level_height_msl,sea_surface_temperature,ocean_current_velocity,ocean_current_direction&cell_selection=sea&timezone=${tz}${rng}`);
          Object.assign(h,{wave:m.wave_height, wper:m.wave_period, wdir:m.wave_direction, sea:m.sea_level_height_msl, sst:m.sea_surface_temperature, cur:m.ocean_current_velocity, curdir:m.ocean_current_direction}); }catch(_){ h.semMar=true; }
      }
      bases[b]=h;
    }
    LIVE[date]={bases, atualizado:new Date().toISOString(), fonte:"Open-Meteo"}; LIVE_ST[date]="ok";
  }catch(e){ LIVE_ST[date]="erro:"+(e&&e.message||"falha"); }
  if(S.tab==="mar") renderMar(); else if(S.tab==="agenda") renderAgenda();
}

function substituida(t){ return !!t && t.status==="cancelada" && Object.values(S.turmas||{}).some(o=>o.id!==t.id && o.status!=="cancelada" && mesmoHorario(o,t)); }

function alertasAtivos(){
  const lim=Date.now()-12*3600e3, hoje=todaySP();

    if(a.tipo!=="cancelamento" || !a.criado || new Date(a.criado).getTime()<lim) return false;

async function excluirRemada(id){
  const t=S.turmas[id]; if(!t) return;
  const agendados=Object.entries(S.insc||{}).filter(([u,d])=>d&&d.r&&d.r[id]&&d.r[id].s==="vou");
  const manuais=Object.entries(t.manual||{}).filter(([k,m])=>m&&m.s==="vou");
  const n=agendados.length+manuais.length;
  const outra=Object.values(S.turmas).find(o=>o.id!==id && mesmoHorario(o,t) && o.status!=="cancelada");
  const msg = outra && n ? `Excluir esta remada de ${dataCurta(t.data)}, ${t.inicio}, ${naBase(t.local)}? Os ${n} agendados serão transferidos para a outra remada do mesmo horário, sem perder a vaga.`
    : n ? `Excluir esta remada de ${dataCurta(t.data)}, ${t.inicio}, ${naBase(t.local)}? ${n===1?"1 aluno agendado perde":`${n} alunos agendados perdem`} o agendamento. Se for só uma mudança, prefira cancelar com motivo.`
    : `Excluir esta remada de ${dataCurta(t.data)}, ${t.inicio}, ${naBase(t.local)}? Ninguém está agendado nela.`;
  if(!await ask(msg,"Excluir remada")) return; closeSheet();
  try{
    if(outra && n){
      for(const [uid,d] of agendados){ const r=JSON.parse(JSON.stringify(d.r)); const x=r[id]; delete r[id]; if(!r[outra.id] || r[outra.id].s!=="vou") r[outra.id]=Object.assign({},x,{fila:false, aceite:x.aceite||""}); await S.db.doc("inscricoes/"+uid).set(Object.assign({},d,{r})); }
      if(manuais.length){ const man=Object.assign({}, outra.manual||{}); manuais.forEach(([k,m])=>{ if(!Object.values(man).some(z=>z.aluno&&z.aluno===m.aluno&&z.s==="vou")) man[k]=m; }); await S.db.doc("turmas/"+outra.id).update({manual:man}); }
    }
    await S.db.doc("turmas/"+id).delete();
    for(const pre of ["canc_","ag_"]){ try{ await S.db.doc("avisos/"+pre+id).delete(); }catch(_){} }
    auditar("Remada excluída",`${t.local} ${t.data} ${t.inicio}${outra&&n?`, ${n} agendados transferidos`:""}`);
    toast(outra&&n?`Remada excluída. ${n} ${n===1?"agendado transferido":"agendados transferidos"}.`:"Remada excluída");
  }catch(e){ failWrite(e); }
}
async function reabrirRemada(id, semPerguntar){
  const t=S.turmas[id]; if(!t) return;
  const outra=Object.values(S.turmas).find(o=>o.id!==id && o.status!=="cancelada" && mesmoHorario(o,t));
  if(outra){ toast("Já existe outra remada ativa neste horário e base. Use a remada ativa."); return; }
  if(!semPerguntar){ const ok=await ask(`Reverter o cancelamento da remada de ${dataCurta(t.data)}, ${t.inicio}, ${naBase(t.local)}? Ela volta a valer com os mesmos agendamentos e o alerta de cancelamento some.`,"Reverter cancelamento"); closeSheet(); if(!ok) return; }
  try{ await S.db.doc("turmas/"+id).update({status:"aberta", motivo:"", motivo_obs:"", revertida_em:new Date().toISOString(), revertida_por:S.uid||""}); try{ await S.db.doc("avisos/canc_"+id).delete(); }catch(_){} auditar("Cancelamento revertido",`${t.local} ${t.data} ${t.inicio}`); toast("Cancelamento revertido. A remada voltou a valer.");
    compartilharWhats("agenda", `*REMADA MANTIDA*\n${t.titulo||"Remada "+naBase(t.local)}: ${dataCurta(t.data)}, ${t.inicio}\nO cancelamento foi revertido. Quem estava agendado continua confirmado.`);
  }catch(e){ failWrite(e); }
}

function initials(n){ return (n||"?").trim().split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]).join("").toUpperCase(); }
function faltando(a){

function fichaStatus(a){
  if(!a) return {s:"incompleta", label:"Ficha não preenchida", f:["Ficha completa"]};

  const desde=a.ficha_em.slice(0,10), ate=addDays(desde,365), dias=diasAte(ate);

function renderMinhaFicha(el){
  const a=S.minhaFicha, st=fichaStatus(a);
  el.innerHTML = `<div class="ag-head"><div><h2>Minha ficha</h2><p class="hint">Cadastro, saúde e termo de responsabilidade. Revisão obrigatória todo ano.</p></div><span class="spacer"></span><div class="row" style="gap:8px"><button class="btn ghost small" id="edMFv" aria-label="Cadastro por voz, com leitura em voz alta">🎙 ${tr("Cadastro por voz")}</button><button class="btn small" id="edMF">${a?"Revisar ficha":"Preencher ficha"}</button></div></div>
    ${a?`<div class="panel">${fichaResumoHTML(a)}</div>`:`<div class="empty" style="margin-top:14px"><p>Você ainda não preencheu sua ficha.</p><p>Ela é obrigatória para agendar remadas.</p></div>`}
    ${st.s==="liberacao"?`<div class="notice" style="margin-top:14px">Você respondeu “sim” no PAR-Q. Entregue a liberação médica à coordenação para voltar a agendar.</div>`:""}`;
  $("#edMF").addEventListener("click", editMinhaFicha);
  $("#edMFv").addEventListener("click", async()=>{ if(S.minhaFicha && S.minhaFicha.ficha_em && !(await confirmarIdentidade())) return; cadastroPorVoz(); });
}
async function editMinhaFicha(){
  if(S.minhaFicha && S.minhaFicha.ficha_em && !(await confirmarIdentidade())) return;
  const a = JSON.parse(JSON.stringify(S.minhaFicha || {status:"ativo", inicio:todaySP()}));
  if(!a.nome && S.me && S.me.name) a.nome=S.me.name;
  fichaForm(a, false, async (o)=>{
    if(!o.status) o.status="ativo"; o.origem="app";
    await S.db.doc("alunos/"+S.uid).set(o); S.minhaFicha=o; closeSheet();
    const st=fichaStatus(o); toast(st.s==="liberacao"?"Ficha enviada. Falta a liberação médica.":"Ficha enviada, você já pode agendar");
    render();
  });
}
function renderAlunos(){
  const el = $("#alunosBody");
  if(!S.db){ el.innerHTML = `<div class="locked"><h3>Portal indisponível aqui</h3><p>Abra este app pelo Claude, conectado à sua conta.</p></div>`; return; }
  if(S.role==="aluno"){ renderMinhaFicha(el); return; }
  if(!S.canAgenda){ el.innerHTML = `<div class="locked"><h3>Entre com sua conta</h3><p>Faça login no Claude para preencher sua ficha e agendar remadas.</p></div>`; return; }
  if(!S.alunosLoaded){ el.innerHTML = `<div class="empty">Carregando alunos…</div>`; return; }
  const all = S.alunos, ativos=all.filter(a=>a.status!=="inativo");

  const saude = ativos.filter(a=>alertas(a).some(x=>["Alergia","Condição de saúde","Não sabe nadar"].includes(x[1]))).length;
  const q = S.alunosSearch.toLowerCase();
  let list = all.filter(a=>!q || (a.nome||"").toLowerCase().includes(q) || (a.telefone||"").includes(q));
  if(S.alunosFilter==="revisar") list=list.filter(precisaRevisao);

  list.sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt-BR"));
  let html = `<div class="stats"><div><div class="n">${ativos.length}</div><div class="l">alunos</div></div><div><div class="n">${emDia}</div><div class="l">fichas em dia</div></div><div><div class="n" style="color:${revisar?"var(--stop)":"inherit"}">${revisar}</div><div class="l">a revisar</div></div><div><div class="n">${saude}</div><div class="l">atenção à saúde</div></div></div>
  ${!S.canEdit?`<div class="notice">Visão de instrutor: consulta de contatos de emergência e saúde. Alterações são feitas pela gestão.</div>`:""}

    ${S.canEdit?`<button class="btn" id="addA">Novo aluno</button>`:""}
    ${S.canEdit&&revisar?`<button class="btn ghost" id="lemA">Copiar lembrete</button>`:""}
    ${S.canEdit&&all.length?`<button class="btn ghost" id="csvA">Exportar</button>`:""}
  </div>`;
  if(!all.length) html += `<div class="empty"><p>Nenhum aluno cadastrado ainda.</p><p>Os alunos aparecem aqui quando preenchem a ficha no app, ou quando a gestão cadastra.</p></div>`;

  else html += `<div class="list">${list.map(a=>{const al=alertas(a);return `<button class="item" data-id="${esc(a._id)}">${avatar(a.nome,a.foto)}<span style="min-width:0"><span class="nm">${esc(a.nome||"Sem nome")}</span><span class="sub"> ${esc(NIVEL[a.nivel]||"")}${a.equipe?", equipe "+esc(CAT_LABEL[catPrincipal(catsPorAno((a.nascimento||"").slice(0,4)))]||""):""}${a.status&&a.status!=="ativo"?", "+esc(STATUS[a.status]):""}</span>${al.length?`<span class="badges">${al.map(x=>`<span class="b ${x[0]}">${esc(x[1])}</span>`).join("")}</span>`:`<span class="badges"><span class="b grn">Ficha em dia</span></span>`}</span></button>`}).join("")}</div>`;
  el.innerHTML = html;

async function exportCSV(){

function startMs(t){ return new Date(`${t.data}T${t.inicio||"06:00"}:00-03:00`).getTime(); }

function gNorm(g){ return Object.assign({}, g, {dias: g.dias || (g.dia!=null?[+g.dia]:[]), locais: g.locais || (g.local?[g.local]:[LOCAIS[0]])}); }
function diasTxt(ds){
  const s=[...new Set(ds.map(Number))].sort((a,b)=>a-b);
  if(s.length>=3 && s[s.length-1]-s[0]===s.length-1) return `${DIAS_C[s[0]]} a ${DIAS_C[s[s.length-1]]}`;
  return s.map(d=>DIAS_C[d]).join(s.length===2?" e ":", ");
}
function locaisTxt(ls){ const n=ls.map(l=>B(l).curto||l); return n.length>1 ? n.slice(0,-1).join(", ")+" e "+n[n.length-1] : (n[0]||""); }
async function abrirAgenda(){
  const grade=(S.config.grade||[]).map(gNorm);
  openSheet(`
    <div class="head"><h2>Abrir agenda</h2><button class="x" aria-label="Fechar">×</button></div>
    <p class="hint">Cria as remadas da grade semanal para as bases e o período escolhidos. Remadas que já existem não são duplicadas.</p>
    <form id="fa2"><div class="grid">
      <div class="full"><div class="hint" style="margin:0 0 6px">Bases</div><div class="row" style="gap:16px">${LOCAIS.map(l=>`<label class="chk"><input type="checkbox" name="b_${l}" checked> ${NOME_BASE[l]}</label>`).join("")}</div></div>
      <label class="f full">Período<select name="dias"><option value="7">Próximos 7 dias</option><option value="14">Próximos 14 dias</option><option value="28">Próximas 4 semanas</option></select></label>
    </div>
    <p class="hint" id="prevA"></p>
    <div class="row" style="margin-top:14px"><span class="spacer"></span><button type="button" class="btn ghost" id="cA2">Cancelar</button><button class="btn" type="submit">Abrir agenda</button></div></form>`, root=>{
      const form=root.querySelector("#fa2");
      const plano=()=>{ const f=new FormData(form); const bases=LOCAIS.filter(l=>f.get("b_"+l)); const n=+f.get("dias"); const hoje=todaySP(); const out=[];
        for(let i=0;i<n;i++){ const d=addDays(hoje,i), wd=weekday(d);
          for(const g of grade){ if(!g.dias.includes(wd) || g.ativo===false) continue;
            for(const l of g.locais){ if(!bases.includes(l)) continue;
              const id=`${d}_${l}_${g.inicio.replace(":","")}${g.categoria?"_"+g.categoria:""}`;
              const t={data:d, inicio:g.inicio, fim:g.fim, local:l, titulo:g.titulo||"", categoria:g.categoria||"", vagas:g.vagas||"", obs:"", status:"aberta", manual:{}, checkin:{}, instrutor:g.instrutor||"", abre_h:g.abre_h||"", fecha_min:g.fecha_min||"0", cancel_h:g.cancel_h||""};
              if(S.turmas[id] || (d===hoje && encerrada(t))) continue; out.push([id,t]); } } }
        return out; };
      const upd=()=>{ const p=plano(); root.querySelector("#prevA").textContent = p.length ? `${p.length} ${p.length===1?"remada será aberta":"remadas serão abertas"}.` : "Nenhuma remada nova para abrir com essa escolha."; };
      form.addEventListener("change",upd); upd();
      root.querySelector("#cA2").addEventListener("click",closeSheet);
      form.addEventListener("submit",async ev=>{ ev.preventDefault(); const p=plano(); let n=0;
        for(const [id,t] of p){ try{ t.criado=new Date().toISOString(); await S.db.doc("turmas/"+id).set(t); n++; }catch(e){ failWrite(e); break; } }
        if(!n){ closeSheet(); toast("Nada novo para abrir"); return; }
        const dias=[...new Set(p.slice(0,n).map(([,t])=>t.data))].sort();
        const resumo=p.slice(0,n).map(([,t])=>`${dataCurta(t.data)}, ${t.inicio}, ${t.local}`).join("\n");
        await S.db.doc("avisos/agenda_"+Date.now().toString(36)).set({tipo:"agenda", titulo:`Agenda aberta: ${n} ${n===1?"remada":"remadas"}`, texto:`De ${dataCurta(dias[0])} a ${dataCurta(dias[dias.length-1])}. Confirme sua presença na aba Agenda.`, data_evento:dias[0], hora:"", local:"", link:"", expira:dias[dias.length-1], fixado:false, criado:new Date().toISOString()});
        auditar("Agenda aberta",`${n} remadas`);
        toast(`${n} ${n===1?"remada aberta":"remadas abertas"}`);
        compartilharWhats("agenda", `*AGENDA ABERTA*\n${resumo}\n\nConfirme sua presença no app, aba Agenda. Vagas limitadas; com a remada cheia, você entra na fila de espera.`); });
    });
}
